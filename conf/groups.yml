###########################################################################
# 玩家群組資料庫
###########################################################################
#
# 玩家群組設定
#
###########################################################################
# - Id                    群組 ID。
#   Name                  群組名稱。
#   Level                 用於群組排序的 GM 等級。（預設：0）
#   LogCommands           是否記錄 AtCommand 指令。（預設：false）
#   Commands:             此群組可使用的 AtCommand 清單。（預設：無）
#     <atcommand name>    設定此群組是否可使用指定的 AtCommand。
#   CharCommands:         此群組可使用的 CharCommand 清單。（預設：無）
#     <charcommand name>  設定此群組是否可使用指定的 CharCommand。
#   Permissions:          此群組擁有的權限清單。（預設：無）
#     <permission name>   設定此群組是否擁有指定權限。
#   Inherit:              要繼承的群組清單。（預設：無）
#     <group name>        設定是否繼承指定群組。
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  - Id: 0
    # 群組 0 是每個新帳號的預設群組。
    Name: 玩家
    Level: 0
    Commands:
      changedress: true
      resurrect: true
    Permissions:
      # 若沒有這些基本權限，一般玩家將無法交易或組隊。
      can_trade: true
      can_party: true
      attendance: true
  - Id: 1
    Name: 超級玩家
    # 可執行玩家能做的所有操作，並擁有更多權限。
    Inherit:
      玩家: true
    Level: 0
    Commands:
      # 資訊查詢指令
      commands: true
      charcommands: true
      help: true
      rates: true
      uptime: true
      showdelay: true
      exp: true
      mobinfo: true
      iteminfo: true
      whodrops: true
      time: true
      jailtime: true
      hominfo: true
      homstats: true
      showexp: true
      showzeny: true
      whereis: true
      # 功能指令
      refresh: true
      noask: true
      noks: true
      autoloot: true
      alootid: true
      autoloottype: true
      autotrade: true
      request: true
      go: true
      breakguild: true
      channel: true
      langtype: true
    Permissions:
      attendance: false
  - Id: 2
    Name: 支援人員
    Inherit:
      超級玩家: true
    Level: 1
    Commands:
      version: true
      where: true
      jumpto: true
      who: true
      who2: true
      who3: true
      whomap: true
      whomap2: true
      whomap3: true
      users: true
      broadcast: true
      localbroadcast: true
    LogCommands: true
    Permissions:
      receive_requests: true
      view_equipment: true
  - Id: 3
    Name: 腳本管理員
    Inherit:
      支援人員: true
    Level: 1
    Commands:
      tonpc: true
      hidenpc: true
      shownpc: true
      loadnpc: true
      unloadnpc: true
      npcmove: true
      addwarp: true
    LogCommands: true
    Permissions:
      any_warp: true
  - Id: 4
    Name: 活動管理員
    Inherit:
      支援人員: true
    Level: 1
    Commands:
      monster: true
      monstersmall: true
      monsterbig: true
      killmonster2: true
      cleanarea: true
      cleanmap: true
      item: true
      zeny: true
      disguise: true
      undisguise: true
      size: true
      raise: true
      raisemap: true
      day: true
      night: true
      skillon: true
      skilloff: true
      pvpon: true
      pvpoff: true
      gvgon: true
      gvgoff: true
      allowks: true
      me: true
      marry: true
      divorce: true
      refreshall: true
    CharCommands:
      item: true
      zeny: true
      disguise: true
      undisguise: true
      size: true
    LogCommands: true
    Permissions:
      can_trade: false
      any_warp: true
  - Id: 5
    Name: VIP
    # 可執行玩家能做的所有操作。
    Inherit:
      玩家: true
    Level: 0
    Commands:
      rates: true
      who: true
  - Id: 10
    Name: 執法人員
    Inherit:
      支援人員: true
    Level: 2
    Commands:
      hide: true
      follow: true
      kick: true
      disguise: true
      fakename: true
      option: true
      speed: true
      warp: true
      kill: true
      recall: true
      ban: true
      block: true
      jail: true
      jailfor: true
      mute: true
      storagelist: true
      cartlist: true
      itemlist: true
      stats: true
    LogCommands: true
    Permissions:
      join_chat: true
      kick_chat: true
      hide_session: true
      who_display_aid: true
      hack_info: true
      any_warp: true
      view_hpmeter: true
      macro_detect: true
  - Id: 99
    Name: 管理員
    Level: 99
    Inherit:
      支援人員: true
      執法人員: true
    LogCommands: true
    Permissions:
      can_trade: true
      can_party: true
      command_enable: true
      all_skill: false
      all_equipment: false
      skill_unconditional: false
      use_check: true
      use_changemaptype: true
      all_commands: true
      channel_admin: true
      can_trade_bounded: true
      item_unconditional: false
      bypass_stat_onclone: true
      bypass_max_stat: true
      macro_register: true
      trade_unconditional: true
      #all_permission: true

Footer:
  Imports:
  - Path: conf/import/groups.yml
