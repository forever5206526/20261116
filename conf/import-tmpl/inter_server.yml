##########################################################################
# 倉庫資料庫
##########################################################################
#
# 倉庫設定
#
##########################################################################
#	- ID                       倉庫 ID。
#	  Name                     傳送給用戶端並顯示在標題列上的倉庫名稱。
#	  Table                    儲存倉庫資料的 SQL 資料表名稱；資料表結構與預設倉庫資料表相同。
#	  Max                      可存放的最大物品數量。（預設：MAX_STORAGE）
###########################################################################
# 若要開啟進階倉庫，請使用腳本指令「openstorage2」。
# 若要新增更多進階倉庫，請複製倉庫資料表結構，並在此設定檔中填入相符的資料表名稱。
# 進階倉庫的 Max 不會受到 vip_storage_increase 設定或 MIN_STORAGE 影響。
###########################################################################

Header:
  Type: INTER_SERVER_DB
  Version: 1

