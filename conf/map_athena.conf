//--------------------------------------------------------------
// rAthena 地圖伺服器設定檔
//--------------------------------------------------------------

// 注意：「註解」是指雙斜線「//」右側的所有文字。
// 被註解的文字不會由伺服器解析，僅供
// 資訊參考用途。

//--------------------------------------------------------------
//                     Configuration Info
//--------------------------------------------------------------
// Interserver communication passwords, set in account.txt (or equiv.)
userid: s1
passwd: p1

// 角色伺服器 IP 位址
// 地圖伺服器會使用此 IP 位址連線至角色伺服器。
// 注意：當伺服器位於防火牆後方，或電腦具有
// 多個網路介面時，此設定相當有用。
//char_ip: 127.0.0.1

// 地圖伺服器會在此 IP 位址所指定的網路介面上監聽。
// 注意：此設定可讓您在多個網路介面上執行多個伺服器，
// 並讓每個伺服器使用相同的連接埠。
//bind_ip: 127.0.0.1

// 角色伺服器連接埠
char_port: 6121

// 地圖伺服器 IP 位址
// 用戶端連線時使用的 IP 位址。
// 請設定為伺服器對外公開的 IP 位址。
//map_ip: 127.0.0.1

// 地圖伺服器連接埠
map_port: 5121

// 顯示在所有訊息前方的時間戳記格式。
// 最多可使用 20 個字元。
// 常用格式：
// %I:%M:%S %p（時:分:秒，12 小時制，含 AM／PM）
// %H:%M:%S（時:分:秒，24 小時制）
// %d/%b/%Y（日／月份英文縮寫／年）
// 完整格式說明請參閱 strftime() 手冊。
//timestamp_format: [%d/%b %H:%M]

// 若輸出重新導向時包含跳脫序列（色彩碼），請設定是否保留。
stdout_with_ansisequence: no

// 將指定類型的伺服器訊息記錄至 /log/ 資料夾中的檔案。
// 1：記錄警告訊息
// 2：記錄錯誤與 SQL 錯誤訊息。
// 4：記錄除錯訊息
// 範例：設定「console_msg_log: 7」會記錄上述三種類型的訊息。
// 此設定所記錄的訊息優先於 console_silent 設定。
console_msg_log: 0

// 用來儲存上述主控台訊息的檔案路徑。
console_log_filepath: ./log/map-msg_log.log

// 可隱藏指定類型的訊息，讓伺服器輸出更精簡：
// 1：隱藏資訊訊息
// 2：隱藏狀態訊息
// 4：隱藏通知訊息
// 8：隱藏警告訊息
// 16：隱藏錯誤與 SQL 錯誤訊息。
// 32：隱藏除錯訊息
// 範例：「console_silent: 7」會隱藏資訊、狀態及通知訊息（1+2+4）。
console_silent: 0

//Where should all database data be read from?
db_path: db

// 是否啟用 @guildspy 與 @partyspy 管理指令？
// 注意：啟用這些指令會降低封包傳送效能。
enable_spy: no

// 是否從 GRF 檔案或資料目錄中的 GAT、RSW 讀取地圖資料，
// 而非從 mapcache 讀取？資料來源由 grf-files.txt 指定。
use_grf: no

// 主控台指令
// 設定是否允許使用主控台指令。
// 關閉後可避免使用 >& log.file 進行輸出重新導向。
console: off

// 資料庫自動儲存間隔
// 所有角色會依此間隔（秒）進行儲存（例如：
// autosave of 60 secs with 60 characters online -> one char is saved every 
// 一個角色）。
autosave_time: 300

// 資料庫最小儲存間隔（毫秒）
// Prevent saving characters faster than at this rate (prevents char-server 
// 角色伺服器的儲存／載入負載過高）。
minsave_time: 100

// 除 autosave_time 外，玩家進行下列操作時也會儲存角色資料
//（可依需求新增）：
// 1：每次交易成功後
// 2：開啟露天商店／每筆露天商店交易後
// 4：關閉倉庫／公會倉庫後
// 8：寵物孵化／收回蛋中後
// 16：成功寄出附有附件的郵件後
// 32：成功提交拍賣物品後
// 64：成功取得／刪除／完成任務後
// 128：每次銀行交易（存款／提款）後
// 256：每次領取簽到獎勵後
// 4095：所有上述情況都儲存
// 注意：這些設定可降低伺服器當機時物品重複或遺失的機率，
// server crash at the expense of increasing the map/char server lag. If your 
// 卻經常發生伺服器間延遲，您可以考慮將這些選項
// 關閉。
save_settings: 4095

// 每日訊息檔案；角色登入時會顯示此訊息。
motd_txt: conf/motd.txt

// GM 輸入 @help 或 @h 時會顯示此說明，協助新任 GM 了解管理指令。
charhelp_txt: conf/charhelp.txt

// 載入頻道設定的檔案：
channel_conf: conf/channels.conf

// 地圖清單：
import: conf/maps_athena.conf

import: conf/import/map_conf.txt
