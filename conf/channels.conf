// 頻道系統設定檔
channel_config: {

	/* 可用的顏色 */
	colors: {
		Default: "0xffffff" /* 自訂頻道若未透過 @channel 指定顏色，將使用清單中的第一個顏色。 */
		Red: "0xff0000"
		Blue: "0x83cfe9"
		Orange: "0xe57c00"
		Cyan: "0x00b89d"
		Yellow: "0xffff90"
		Green: "0x28bf00"
		White: "0xFFFFFF"
		Purple: "0xD67FFF"
		LightGreen: "0xB6FF00"
		Normal: "0x00ff00"
		/* 可依需求新增任意數量的顏色。 */
	}

	/**
	 * 私人頻道設定
	 * - 一律使用 CHAN_TYPE_PUBLIC 類型
	 * - 聊天記錄一律以「#channel_name: <name>: <chat>」格式顯示
	 * - 私人頻道的 ID 從 1000 開始
	 **/
	private_channel: {
		allow: true			  // (bool)	是否允許玩家建立自己的頻道？
		color: "Default"	  // (string)	預設顏色，請參閱 colors。
		delay: 1000			  // (int)	每位成員的聊天間隔。
		max_member: 1000	  // (int)	最大成員數。
		self_notif: true	  // (bool)	玩家進入或離開頻道時是否顯示訊息？
		join_notif: false	  // (bool)	玩家加入頻道時是否顯示訊息？
		leave_notif: false	  // (bool)	玩家離開頻道時是否顯示訊息？
		/* 頻道擁有者可使用以下管理功能： */
		ban: true			  // (bool)	是否允許封鎖玩家？
		kick: true			  // (bool)	是否允許踢除玩家？
		color_override: false // (bool)	是否允許玩家自行變更頻道顏色？
		change_delay: false	  // (bool)	是否允許玩家自行變更私人頻道聊天間隔？
	}

	/**
	 * 預設伺服器頻道
	 **/
	channels: (
	/**
	 * 設定欄位結構
	{
		name: "#channel"		 // (string)	頻道名稱。
		password: ""			 // (string)	頻道密碼。
		alias: "[Channel]"		 // (string)	聊天訊息中取代頻道名稱顯示的別名。
		color: "Default"		 // (string)	頻道顏色。
		type: "CHAN_TYPE_PUBLIC" // (string)	頻道類型：CHAN_TYPE_PUBLIC、CHAN_TYPE_ALLY、CHAN_TYPE_MAP。
		autojoin: false			 // (bool)	玩家是否會自動加入頻道？
		delay: 1000				 // (int)	每位玩家的聊天間隔。
		leave: true				 // (bool)	是否允許玩家離開頻道？
		chat: true				 // (bool)	是否允許玩家在此頻道聊天？
		color_override: false	 // (bool)	是否允許玩家自行變更頻道顏色？
		self_notif: true		 // (bool)	玩家進入或離開頻道時是否顯示訊息？
		join_notif: false		 // (bool)	玩家加入頻道時是否顯示訊息？
		leave_notif: false		 // (bool)	玩家離開頻道時是否顯示訊息？
		groupid: (0,..,99)		 // (list,int)	只有群組 ID 符合清單的玩家可以加入；具有 channel_admin 權限的群組永遠可以進入頻道。
		/// 以上所有設定值皆為預設值。
	},							 // 若後面還有其他頻道，請在此使用逗號。
	 **/
	{
		name: "#global"
		alias: "[全域]"
		color: "White"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
		leave: false
	},
	{
		name: "#support"
		alias: "[支援]"
		color: "Blue"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
	},
	{
		name: "#trade"
		alias: "[交易]"
		color: "LightGreen"
		type: "CHAN_TYPE_PUBLIC"
		delay: 1000
		autojoin: false
	}
	)

	/**
	 * 公會同盟頻道設定
	 * 欄位結構請參閱上方的 channels 設定。
	 **/
	ally: {
		name: "#ally"
		alias: "[同盟]"
		color: "Green"
		type: "CHAN_TYPE_ALLY" // 請勿變更此數值。
		delay: 1000
		autojoin: false
		leave: true
		chat: true
	}

	/**
	 * 地圖頻道設定
	 * 欄位結構請參閱上方的 channels 設定。
	 **/
	map: {
		name: "#map"
		alias: "[地圖]"
		color: "Yellow"
		type: "CHAN_TYPE_MAP" // 請勿變更此數值。
		delay: 1000
		autojoin: false
		leave: true
		chat: true
	}
}
