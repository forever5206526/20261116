// Athena 角色伺服器設定檔。

// 注意：「註解」是指雙斜線「//」右側的所有文字。
// 被註解的文字不會由伺服器解析，僅供
// 資訊參考用途。

// 伺服器間通訊使用的帳號與密碼。
userid: s1
passwd: p1

// 伺服器名稱；若需要空格，請使用替代字元，例如 ASCII 160。
// 注意：不可使用空格或下列 Windows 檔名不允許的字元：
//       \/:*?"<>|
//       否則公會徽章將無法在用戶端正常顯示！
server_name: brHades

// 伺服器密語名稱：伺服器向玩家傳送密語時使用，長度須介於 4 至 23 個字元。
wisp_server_name: Server

// 登入伺服器 IP 位址
// 角色伺服器會使用此 IP 位址連線至登入伺服器。
// 注意：當伺服器位於防火牆後方，或電腦具有
// 多個網路介面時，此設定相當有用。
//login_ip: 127.0.0.1

// 角色伺服器會在此 IP 位址所指定的網路介面上監聽。
// 注意：此設定可讓您在多個網路介面上執行多個伺服器，
// 並讓每個伺服器使用相同的連接埠。
//bind_ip: 127.0.0.1

// 登入伺服器連接埠
login_port: 6900

// 角色伺服器 IP 位址
// 用戶端連線時使用的 IP 位址。
// 請設定為伺服器對外公開的 IP 位址。
//char_ip: 127.0.0.1

// 角色伺服器連接埠
char_port: 6121

// 顯示在所有訊息前方的時間戳記格式。
// 最多可使用 20 個字元。
// 常用格式：
// %I:%M:%S %p（時:分:秒，12 小時制，含 AM／PM）
// %H:%M:%S（時:分:秒，24 小時制）
// %d/%b/%Y（日／月份英文縮寫／年）
// 完整格式說明請參閱 strftime() 手冊。
//timestamp_format: [%d/%b %H:%M]

// 若輸出重新導向時包含跳脫序列（色彩碼），請設定是否保留。
stdout_with_ansisequence: no

// 將指定類型的伺服器訊息記錄至 /log/ 資料夾中的檔案。
// 1：記錄警告訊息
// 2：記錄錯誤與 SQL 錯誤訊息。
// 4：記錄除錯訊息
// 範例：設定「console_msg_log: 7」會記錄上述三種類型的訊息。
// 此設定所記錄的訊息優先於 console_silent 設定。
console_msg_log: 0

// 用來儲存上述主控台訊息的檔案路徑。
console_log_filepath: ./log/char-msg_log.log

// 隱藏指定類型的訊息，減少伺服器輸出內容：
// 1：隱藏資訊訊息
// 2：隱藏狀態訊息
// 4：隱藏通知訊息
// 8：隱藏警告訊息
// 16：隱藏錯誤與 SQL 錯誤訊息。
// 32：隱藏除錯訊息
// 範例：「console_silent: 7」會隱藏資訊、狀態及通知訊息（1+2+4）。
console_silent: 0

// 主控台指令
// 設定是否允許使用主控台指令。
// 關閉後可避免使用 >& log.file 進行輸出重新導向。
console: off

// 伺服器類型。
// 目前不會影響任何功能。
// 顯示在用戶端伺服器名稱旁。
// 0=一般、1=維護中、2=限制 18 歲以上、3=付費、4=P2P。
char_maintenance: 0

// 是否允許建立新角色。
// 此功能目前已正式支援。[Kevin]
char_new: yes

// 是否在伺服器清單中顯示「（新）」標示。
char_new_display: 0

// 允許連線至伺服器的最大使用者數量。
// 設為 0 可禁止使用者登入；設為 -1 表示不限制。
max_connect_user: -1

// 可忽略伺服器人數上限的群組 ID。
// 當角色伺服器處於維護模式時，也可允許此群組連線（groupid >= allow）。
// 預設值：-1 = 無人（不存在 ID 小於 0 的群組）。
// 請參閱：conf/groups.conf。
gm_allow_group: 99

// 伺服器多久儲存一次公會資訊？（秒）
//（角色資料儲存間隔請至地圖伺服器設定檔的 autosave_time 調整。）
autosave_time: 60

// 載入或儲存角色、公會、隊伍及寵物資料時，是否在主控台顯示資訊？
save_log: yes

// 新角色的出生位置。
// 格式：<map_name>,<x>,<y>{:<map_name>,<x>,<y>...}
// 出生位置的最大數量由 char.hpp 中的 MAX_STARTPOINT 決定（預設為 5）。
// 建立角色時會從清單中隨機選擇出生位置。
// 注意：杜蘭族需要使用 20151001 或更新版本的用戶端。
start_point: iz_int,18,26:iz_int01,18,26:iz_int02,18,26:iz_int03,18,26:iz_int04,18,26
start_point_pre: new_1-1,53,111:new_2-1,53,111:new_3-1,53,111:new_4-1,53,111:new_5-1,53,111
start_point_doram: lasa_fild01,48,297

// 新角色的初始物品。
// 初始物品的最大數量由 char.cpp 中的 MAX_STARTITEM 決定（預設為 32）。
// 格式：<id>,<amount>,<position>{:<id>,<amount>,<position>...}
// 若要自動裝備物品，請填入裝備位置；否則請填入 0。
// 注意：杜蘭族需要使用 20151001 或更新版本的用戶端。
start_items: 1201,1,2:2301,1,16:23484,1,0
start_items_pre: 1201,1,2:2301,1,16
start_items_doram: 1681,1,2:2301,1,16

// 新角色的初始 Zeny。
start_zeny: 0

// 名聲排行榜的顯示筆數。
fame_list_alchemist: 10
fame_list_blacksmith: 10
fame_list_taekwon: 10

// 公會取得的經驗值調整倍率。
// 將被徵收的經驗值加入公會經驗值前，先套用此倍率。例如設為
// 200 時，公會取得的經驗值將是玩家被徵收經驗值的兩倍。
guild_exp_rate: 100

// 未知角色所使用的名稱。
unknown_char_name: Unknown

// 是否記錄角色伺服器的日誌？
log_char: yes

// 角色名稱的最短長度。
// 除非用戶端套用了「Remove 4/6 letter Character Name limit」修改補丁，否則必須設為 4。
char_name_min_length: 4

// 是否允許角色名稱僅大小寫不同，但實際字母相同？
// 範例：Test、test、TEST、TesT；0 = 不允許（預設），1 = 允許。
name_ignoring_case: no

// 管理角色名稱可使用的字母與符號。控制字元（0x00-0x1f）一律禁止。可用值如下：
// 注意：此設定同時適用於角色、隊伍及公會名稱。
// 0：不限制（預設）。
// 1：只允許 char_name_letters 設定中的字母／符號。
// 2：禁止使用 char_name_letters 設定中的字母／符號，其餘字元皆可使用。
char_name_option: 1

// 設定 char_name_option 所使用的允許或禁止字母／符號清單。
// 注意：除非您確實要將空格加入清單，否則不要加入空格。
char_name_letters: abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890

// 依 Base Level 限制角色刪除。
// 0：不限制（玩家可刪除任何等級的角色）。
// -X：禁止刪除 BaseLevel 小於或等於 X 的角色。
// Y：禁止刪除 BaseLevel 大於或等於 Y 的角色。
// 範例：char_del_level: 80（玩家無法刪除 BaseLevel 達 80 以上的角色）。
char_del_level: 0

// 刪除角色前要延遲的時間。（秒）
// 預設值：86400（24 小時）。
// 注意：需要使用 2010-08-03aragexeRE 或更新版本的用戶端。
char_del_delay: 86400

// 依電子郵件地址或生日限制角色刪除。
// 此設定會限制玩家變更 langtype 及刪除角色。
// 預設行為依用戶端日期版本而定。
// 1：電子郵件地址。
// 2：出生日期。
// 3：電子郵件地址或出生日期。
// 重要！
// - 此設定僅適用於刪除角色時傳送 0x0068 或 0x01fb 封包的用戶端。
// - 新版用戶端（2013 及更新版本）請使用 langtype 1，以使用 0x01fb。
// - 未使用 0x0068 或 0x01fb 的用戶端，預設只會使用生日（YYMMDD）進行驗證。
char_del_option: 2

// 角色仍在隊伍或公會中時，是否限制刪除角色？
// 0：不限制。
// 1：角色仍在隊伍中時不可刪除。
// 2：角色仍在公會中時不可刪除。
// 3：角色仍在隊伍或公會中時不可刪除（預設）。
char_del_restriction: 3

// 限制可建立的職業。（僅適用於 20151001aRagexe 或更新版本的用戶端。）
// 0：禁止建立任何角色。
// 1：只允許建立初心者（Pre-Renewal 預設值）。
// 2：只允許建立召喚師。
// 3：允許建立初心者與召喚師（Renewal 預設值）。
// 取消註解即可自訂限制。
//allowed_job_flag: 3

// 伺服器啟動時，是否從 party_db 資料表清除沒有任何成員的隊伍？
clear_parties: no

// 存放資料庫檔案的資料夾。
db_path: db

//===================================
// PIN 碼系統
//===================================
// 注意：需要使用 2011-03-09aragexeRE 或更新版本的用戶端。
// 選擇角色前會先開啟 PIN 碼視窗，玩家必須只使用滑鼠輸入 PIN 碼。
// Default: yes
pincode_enabled: yes

// 使用者必須多久更換一次 PIN 碼？
// 0：永不更換（預設）。
// X：每 X 天更換一次。
pincode_changetime: 0

// 使用者最多可以輸入錯誤 PIN 碼幾次？
// 預設值：3（用戶端允許的最大值）。
pincode_maxtry: 3

// 啟用 PIN 碼系統後，是否強制使用者設定 PIN 碼？
// Default: yes
pincode_force: yes

// 是否允許 PIN 碼使用重複數字？
// 預設值：no
pincode_allow_repeated: no

// 是否允許 PIN 碼使用連續數字？
// 預設值：no
pincode_allow_sequential: no

//===================================
// 附加功能系統
//===================================
// 角色欄位移動
// 注意：需要使用 2011-09-28aragexeRE 或更新版本的用戶端。
// 允許使用者在角色欄位之間移動角色。
// Default: yes
char_move_enabled: yes

// 是否允許使用者將角色移動到已使用的欄位？
// 啟用後，兩個欄位中的角色會互相交換。
// Default: yes
char_movetoused: yes

// 是否允許使用者不限次數移動角色？
char_moves_unlimited: no

// 角色改名
// 是否允許角色仍在隊伍中時改名？
// 預設值：no
char_rename_party: no

// 是否允許角色仍在公會中時改名？
// 預設值：no
char_rename_guild: no

// 伺服器啟動時，是否檢查 SQL 資料表是否正確？
char_checkdb: yes

// 角色載入時若所在地圖不存在，應將角色移至哪張預設地圖？
default_map: prontera
default_map_x: 156
default_map_y: 191

// 氏族成員閒置幾天後，應自動將其移出氏族？
// 0：永不移除。
// X：若氏族成員連續 X 天未登入，便將其移除。
// 預設值：14。
clan_remove_inactive_days: 14

//===================================
// RODEX 郵件系統
//===================================
// 郵件寄出後幾天仍未領取時，應退回寄件者？
// 0：永不退回。
// X：X 天後退回。
// 預設值：15。
mail_return_days: 15

// 郵件退回寄件者後幾天，應將其永久刪除？
// 0：永不刪除。
// X：退回後 X 天永久刪除。
// 預設值：15。
mail_delete_days: 15

// 「全部領取」按鈕是否忽略郵件未讀狀態？
// no：只領取已讀郵件中的附件。
// yes：領取所有郵件中的附件。
// Default: yes
mail_retrieve: yes

// 沒有附件的郵件是否也應退回寄件者？
// Default: yes
mail_return_empty: yes

import: conf/import/char_conf.txt
