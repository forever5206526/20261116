//--------------------------------------------------------------
// rAthena Log Configuration File
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in percents (100 means 100%)
// Note 3: Value is a bit field. If no description is given,
//         assume unit types (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// 是否啟用記錄？（注意 3）
// 0x00000000 - 完全不記錄
// 0x00000001 - (T) 記錄交易
// 0x00000002 - (V) 記錄露天商店交易
// 0x00000004 - (P) 記錄玩家掉落／拾取物品
// 0x00000008 - (L) 記錄怪物掉落／撿取物品
// 0x00000010 - (S) 記錄 NPC 交易（購買／販售）
// 0x00000020 - (N) 記錄腳本交易（任務中刪除／取得的物品）
// 0x00000040 - (D) 記錄從怪物身上偷取的物品（Steal／Gank）
// 0x00000080 - (C) 記錄玩家使用的物品（消耗品、寵物／傭兵／生命體飼料，以及技能／攻擊使用物品）
// 0x00000100 - (O) 記錄製作產物／材料
// 0x00000200 - (U) 記錄 MVP 獎勵物品
// 0x00000400 - (A) 記錄玩家透過 @／# 指令建立或刪除的物品
// 0x00000800 - (R) 記錄存入／取出倉庫的物品
// 0x00001000 - (G) 記錄存入／取出公會倉庫的物品
// 0x00002000 - (E) 記錄郵件系統交易
// 0x00004000 - (I) 記錄拍賣系統交易
// 0x00008000 - (B) 記錄收購商店交易
// 0x00010000 - (X) 記錄其他所有交易（租用品到期、插卡、item_check 移除物品、
//           離婚刪除結婚戒指、寵物蛋孵化／收回、寵物裝備穿脫、武器精鍊、Remove Trap 技能及造型師操作）
// 0x00020000 - ($) 記錄商城點數交易
// 0x00040000 - (K) 記錄帳號銀行交易
// 0x00080000 - (F) 記錄公會／隊伍解散時移除的綁定物品
// 0x00100000 - (Y) 記錄輪盤抽獎
// 0x00200000 - (Z) 記錄物品合併程序產生的合併物品。
// 0x00400000 - (Q) 記錄任務指定掉落所發放的物品。
// 0x00800000 - (H) 記錄私人飛空艇系統消耗的物品
// 0x01000000 - (J) 記錄以物易物商店交易
// 0x02000000 - (W) 記錄拉菲內系統交易
// 0x04000000 - (0) 裝備附魔階級介面
// 0x08000000 - (1) 裝備改造介面
// 0x10000000 - (2) 裝備附魔介面
// 範例：記錄交易、露天商店、腳本物品及建立物品：1+2+32+1024 = 1059。
// 請注意：依設計，物品在個人背包與手推車之間移動不會被記錄。
enable_logs: 0xFFFFFFFF

// 是否使用 MySQL 記錄？（注意 1）
sql_logs: yes

// 記錄篩選條件
// =============================================================
// 只要符合任一條件，就會記錄該物品。
// 0 = 完全不記錄
// 1 = 記錄所有物品
// 依物品類型設定的進階位元篩選：||
// 0002 - Healing items (0)
// 0004 - Etc Items(3) + Arrows (10)
// 0008 - Usable Items(2) + Lures,Scrolls(11) + Usable Cash Items(18)
// 0016 - Weapon(4)
// 0032 - Shields,Armor,Headgears,Accessories,etc(5)
// 0064 - Cards(6)
// 0128 - Pet Accessories(8) + Eggs(7) (well, monsters don't drop 'em but we'll use the same system for ALL logs)
// 0256 - Log expensive items ( >= price_items_log)
// 0512 - Log big amount of items ( >= amount_items_log)
// 1024 - Log refined items (if their refine >= refine_items_log )
// 2048 - Log rare items (if their drop chance <= rare_items_log )

// 篩選設定範例：
// log_filter: 1    = logs ANY items
// log_filter: 2    = logs only HEALING items
// log_filter: 4    = logs only Etc Items and Arrows
// log_filter: 64   = logs only Cards
// log_filter: 322  = logs only Healing items, Cards and those items which price is >= price_items_log
// log_filter: 4080 = logs all items (including all rare, big amount) exept healing, etc, arrows and useble ones
log_filter: 1

// 記錄精鍊等級大於或等於 refine_items_log 的物品。
refine_items_log: 5
// 記錄掉落率小於或等於 rare_items_log 的稀有物品。
// 1 = 0.01%，100 = 1% 掉落機率，以此類推。
rare_items_log: 100
// 若物品目前的購買價格小於 price_items_log，則不記錄。
price_items_log: 1000
// 若物品目前數量小於 amount_items_log，則不記錄。
amount_items_log: 100
//=============================================================

// 記錄使用樹枝召喚怪物的操作（注意 1）
log_branch: no

// 追蹤 Zeny 變動
// 篩選設定
// 0 - 不記錄；1 - 記錄所有 Zeny 變動；2～1000000 - 記錄變動絕對值達指定門檻的交易。
log_zeny: 0

// 追蹤商城點數變動（注意 1）
log_cash: yes

// 記錄 MVP 怪物掉落物（注意 1）
// 此功能已過時，請改用 Pick_Log；但此記錄仍可用來追蹤已擊殺的 MVP。
log_mvpdrop: no

// 記錄 AtCommand 與 CharCommand（注意 1）
// 只有玩家群組（「conf/groups.conf」）中
// 將 log_commands 設為 true 的群組，其指令才會被記錄。
log_commands: yes

// 記錄 NPC 的 logmes 指令（注意 1）
log_npc: yes

// 記錄聊天訊息（全域、密語、隊伍、公會、主頻道、氏族）（注意 3）
// 記錄篩選條件
// =============================================================
// 0 = 完全不記錄
// 1 - 記錄全域訊息
// 2 - 記錄密語訊息
// 4 - 記錄隊伍訊息
// 8 - 記錄公會訊息
// 16 - 記錄主頻道訊息
// 32 - 記錄氏族訊息
// 範例：
// log_chat: 5 = 同時記錄密語與隊伍訊息
// log_chat: 8 = 僅記錄公會訊息
// log_chat: 63 = 記錄所有聊天訊息
log_chat: 0

// WoE 進行期間是否停用聊天記錄？（注意 1）
log_chat_woe_disable: no

// 餵食記錄
// 是否記錄寵物或生命體餵食操作？（注意 3）
// 0：停用
// 1：寵物
// 2：生命體
log_feeding: 3

// 記錄檔中顯示的時間戳記格式。
// 最多可使用 20 個字元。
// 常用格式：
// %I:%M:%S %p（時:分:秒，12 小時制，含 AM／PM）
// %H:%M:%S（時:分:秒，24 小時制）
// %d/%b/%Y（日／月份英文縮寫／年）
// 完整格式說明請參閱 strftime() 手冊。
log_timestamp_format: %m/%d/%Y %H:%M:%S

// 記錄檔案／資料表
// 以下設定指定記錄資料的儲存位置。若啟用 sql_logs，
// 則使用 SQL 資料表；否則使用一般文字檔。

// log_gm_db: log/atcommandlog.log
// log_branch_db: log/branchlog.log
// log_chat_db: log/chatlog.log
// log_mvpdrop_db: log/mvplog.log
// log_npc_db: log/npclog.log
// log_pick_db: log/picklog.log
// log_zeny_db: log/zenylog.log
// log_cash_db: log/cashlog.log
// log_feeding_db: log/feedinglog.log

log_gm_db: atcommandlog
log_branch_db: branchlog
log_chat_db: chatlog
log_mvpdrop_db: mvplog
log_npc_db: npclog
log_pick_db: picklog
log_zeny_db: zenylog
log_cash_db: cashlog
log_feeding_db: feedinglog

import: conf/import/log_conf.txt
