// rAthena 網頁伺服器設定檔。

// 注意：「註解」是指雙斜線「//」右側的所有文字。
// 被註解的文字不會由伺服器解析，僅供
// 資訊參考用途。

// 網頁伺服器會在此 IP 位址所指定的網路介面上監聽。
// 注意：此設定可讓您在多個網路介面上執行多個伺服器，
// 並讓每個伺服器使用相同的連接埠。
//bind_ip: 127.0.0.1
 
// 網頁伺服器連接埠
web_port: 8888

// 顯示在所有訊息前方的時間戳記格式。
// 最多可使用 20 個字元。
// 常用格式：
// %I:%M:%S %p（時:分:秒，12 小時制，含 AM／PM）
// %H:%M:%S（時:分:秒，24 小時制）
// %d/%b/%Y（日／月份英文縮寫／年）
// 完整格式說明請參閱 strftime() 手冊。
//timestamp_format: [%d/%b %H:%M]

// 若輸出重新導向時包含跳脫序列（色彩碼），請設定是否保留。
stdout_with_ansisequence: no

// 將指定類型的伺服器訊息記錄至 /log/ 資料夾中的檔案。
// 1：記錄警告訊息
// 2：記錄錯誤與 SQL 錯誤訊息。
// 4：記錄除錯訊息
// 範例：設定「console_msg_log: 7」會記錄上述三種類型的訊息。
// 此設定所記錄的訊息優先於 console_silent 設定。
console_msg_log: 0

// 用來儲存上述主控台訊息的檔案路徑。
console_log_filepath: ./log/web-msg_log.log

// 可隱藏指定類型的訊息，讓伺服器輸出更精簡：
// 1：隱藏資訊訊息
// 2：隱藏狀態訊息
// 4：隱藏通知訊息
// 8：隱藏警告訊息
// 16：隱藏錯誤與 SQL 錯誤訊息。
// 32：隱藏除錯訊息
// 範例：「console_silent: 7」會隱藏資訊、狀態及通知訊息（1+2+4）。
console_silent: 0

// 是否列印請求與回應內容？
// 此功能適合除錯使用，會完整列印每筆交易的
// 請求與回應內容。
print_req_res: off

// 是否允許使用 GIF 圖片作為公會徽章上傳？
allow_gifs: yes

import: conf/import/web_conf.txt
