//--------------------------------------------------------
// rAthena 腳本設定檔
//--------------------------------------------------------


warn_func_mismatch_paramnum: yes

check_cmdcount: 655360

check_gotocount: 2048

// 腳本指令 input 的 min 參數預設值。
// 未提供 min 參數時，會使用此設定值。
// 預設值為 0。
//input_min_value: 0

// 腳本指令 input 的 max 參數預設值。
// 未提供 max 參數時，會使用此設定值。
// 預設值為 INT_MAX。
//input_max_value: 2147483647
input_max_value: 10000000

// 指定是否檢查每個內建函式的引數
// 是否具有正確的型別。若函式收到的引數型別與
// 預期不符，會先顯示警告，但函式仍會繼續執行。
// 預設值：yes
warn_func_mismatch_argtypes: yes

import: conf/import/script_conf.txt
