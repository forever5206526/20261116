// Athena Socket 設定檔
// 翻譯者：davidsiaw


// 是否顯示除錯報告？（報告執行期間發生錯誤時，會將報告儲存。）
debug: no

// Linux／Epoll：每個循環可處理的最大事件數
// 預設值：
//	（最大支援連線數）/2
// 注意：此值控制每個循環最多收集多少個 Socket 事件（呼叫 epoll_wait()）。
//       例如設為 32 時，每個伺服器循環最多可處理 32 個事件（接收資料／建立新連線）。
// 
// 注意：建議設定為最大支援連線數的一半以上。
//       設定過低可能造成延遲或卡頓，
//       實際情況取決於可用的 CPU 時間。
// 注意：只有在 Linux 平台且以 EPoll 作為事件派送器編譯時，此設定才可用！
//
//epoll_maxevents: 1024

// Socket 停滯多久後關閉連線？（秒）
stall_time: 60

//----- IP 規則設定 -----

// 連線時是否檢查 IP 位址？
// 啟用此設定也會啟用 DDoS 防護。
enable_ip_rules: yes

// 檢查順序
//   deny,allow    ：先檢查 deny 規則，再檢查 allow 規則；若沒有符合規則則允許連線。
//   allow,deny    ：先檢查 allow 規則，再檢查 deny 規則；若沒有符合規則則允許連線。
//   mutual-failure：只有符合 allow 規則且不符合任何 deny 規則時才允許連線。
//（預設為 deny,allow）

order: deny,allow
// order: allow,deny
// order: mutual-failure

// IP 規則
//   allow：允許指定 IP 範圍連線（即使被標記為 DDoS 來源也允許）。
//   deny：拒絕指定 IP 範圍的連線。
// 規則會依序處理；allow 與 deny 清單各自採用第一條符合的規則。

// allow: 127.0.0.1
// allow: 192.168.0.0/16
// allow: 10.0.0.0/255.0.0.0
// allow: all

// deny: 127.0.0.1


//---- DDoS 防護設定 ----
// 在 ddos_interval 毫秒內收到 ddos_count 次連線請求時，系統會判定為 DDoS 攻擊。

// 連續嘗試的時間間隔（毫秒）
//（預設為 3000 毫秒，即 3 秒）
ddos_interval: 3000

// 觸發防護所需的連續嘗試次數
//（預設為 5 次）
ddos_count: 5

// 判定 DDoS 威脅已解除所需的時間間隔。（毫秒）
// 經過此時間後，會解除 DDoS 限制。
//（預設為 600000 毫秒，即 10 分鐘）
ddos_autoreset: 600000


import: conf/import/packet_conf.txt
