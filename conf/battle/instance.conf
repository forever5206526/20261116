// rAthena Battle Configuration File
// Originally Translated by Peter Kieser <pfak@telus.net>
// Made in to plainer English by Ancyker
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         assume unit types (1: Pc, 2: Mob, 4: Pet, 8: Homun)
//--------------------------------------------------------------

// 隊伍、公會或氏族有正在進行的副本時，是否禁止成員退出？
// 預設值：yes（官方設定）。
instance_block_leave: yes

// 隊伍或公會有正在進行的副本時，是否禁止更換隊長／會長？
// 預設值：yes（官方設定）。
instance_block_leaderchange: yes

// 隊伍或公會有正在進行的副本時，是否禁止邀請成員？
// 此設定也會禁止加入有正在進行副本的隊伍、公會或氏族。
// 預設值：yes（官方設定）。
instance_block_invite: yes

// 隊伍或公會有正在進行的副本時，是否禁止踢除成員？
// 預設值：yes（官方設定）。
instance_block_expulsion: yes
