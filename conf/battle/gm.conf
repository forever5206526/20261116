//--------------------------------------------------------------
// rAthena Battle Configuration File
// Originally Translated by Peter Kieser <pfak@telus.net>
// Made in to plainer English by Ancyker
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
//--------------------------------------------------------------

// 用來辨識指令的符號。
// 可設定為任意單一字元，但以下字元除外：
// - 控制字元（0x00-0x1f）
// - '%'（隊伍聊天符號）
// - '$'（公會聊天符號）
// - '/'（用戶端指令符號）
// atcommand_symbol 代表在本地使用的 @ 指令。
// charcommand_symbol 代表對其他玩家使用的 # 指令。
atcommand_symbol: @
charcommand_symbol: #

// 每次 GM 指令最多可召喚的怪物數量（0 表示不限制數量）。
atcommand_spawn_quantity_limit: 100

// 使用 @slaveclone 指令可建立的最多從屬複製體數量（0 表示不限制數量）。
atcommand_slave_clone_limit: 25

// If 'no', commands require exact player name. If 'yes', entering a partial 
// name will work, as long as there's only one match from all players in the 
// 
// 部分重要 AtCommand（例如 jail、ban 等）仍要求輸入完整名稱。
// 啟用此設定後，CharCommand 一律支援此功能。
partial_name_scan: yes

// 封鎖嘗試利用交易複製物品的玩家。
// 封鎖時間（分鐘，預設：5）。設為 0 可停用封鎖。
ban_hack_trade: 5

// 需要啟用 RENEWAL_EXP 或 RENEWAL_DROP（src/config/renewal.hpp）。
// 修改 @mobinfo，使其依 renewal_drop 公式顯示玩家實際的掉落率。
// 修改 @iteminfo，不顯示物品最低掉落率（因為無法得知怪物等級）。
// 修改 @whodrops，使其依 renewal_drop 公式顯示玩家實際的掉落率。
atcommand_mobinfo_type: 1

// AtCommand 是否應觸發 NPC 的升級事件？（注意 1）
// 此選項適用於 @baselevelup 與 @joblevelup。
// 預設值：no
atcommand_levelup_events: no

// 玩家附加於 NPC 時，是否停用 AtCommand？（注意 1）
// 可透過腳本指令 enable_command 與 disable_command 變更此設定。
// 在 conf/group.conf 中具有 command_enable 權限者可略過此限制。
// Default: yes
atcommand_disable_npc: yes
