//--------------------------------------------------------------
// rAthena 功能設定檔
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 收購商店（注意 1）
// 需求版本：2010-04-27aRagexeRE 或更新版本。
feature.buying_store: on

// 搜尋商店（注意 1）
// 需求版本：2010-08-03aRagexeRE 或更新版本。
feature.search_stores: on

// AtCommand 指令建議（注意 1）
// 輸入不完整的 AtCommand 時，會顯示可能的完整指令建議。
feature.atcommand_suggestions: off

// 拍賣系統（注意 1）
// 此功能在 2012 年起的用戶端變得不穩定（確切日期不明），
// 但已在 2013-05-15 起的用戶端修正。
// 此功能又在 2014-11-12 及更新版本的用戶端中被移除。
feature.auction: off

// 傳送建議（注意 1）
// 使用 @warp 傳送至不存在的地圖時，是否顯示建議？
feature.warp_suggestions: off

// 銀行系統（注意 1）
// 需求版本：2013-07-24aRagexe 或更新版本。
feature.banking: on

// 存入或提領 Zeny 時，銀行系統是否嚴格檢查介面狀態？（注意 1）
// 注意：預設停用，因為現有官方用戶端不會將銀行介面狀態回報給伺服器。
// 若使用會回報介面狀態的用戶端或自訂用戶端，此設定可能會有幫助。
feature.banking_state_enforce: no

// 自動擺攤持續狀態（注意 1）
// 伺服器重新啟動後，是否還原使用 @autotrade 的商店？
feature.autotrade: on

// 自動擺攤角色重新建立時，應面向哪個方向？
// 可用值為 0～7。
// 預設值：4（南方）。
// -1 = 沿用玩家最後面向的方向
feature.autotrade_direction: 4

// 是否變更玩家頭部朝向？
// -1 = 沿用玩家最後的狀態
//  0 = 正前方
//  1 = 右方
//  2 = 左方
feature.autotrade_head_direction: 0

// 自動擺攤角色是否要坐下？
// -1 = 沿用玩家最後的狀態（坐下或站立）
//  0 = 站立
//  1 = 坐下
feature.autotrade_sit: 1

// 玩家登入後，延遲多少毫秒才開啟露天商店／收購商店。
feature.autotrade_open_delay: 5000

// 競技場佇列介面。啟用後可在任何地點透過戰鬥選單加入競技場佇列。
// 需求版本：2012-04-10aRagexe 或更新版本。
feature.bgqueue: on

// 輪盤系統（注意 1）
// 需求版本：2014-10-22bRagexe 或更新版本。
feature.roulette: on

// 輪盤額外獎勵
// 若獎勵物品 ID 與額外獎勵物品 ID 相同，數量加倍。
feature.roulette_bonus_reward: on

// 成就系統（注意 1）
// 需求版本：2015-05-13aRagexe 或更新版本。
feature.achievement: on

// 精鍊介面（注意 1）
// 需求版本：2016-10-12aRagexeRE 或更新版本。
feature.refineui: on

// 裝備切換介面（注意 1）
// 需求版本：2017-02-08bRagexeRE 或更新版本。
feature.equipswitch: on

// 寵物進化（注意 1）
// 需求版本：2014-10-08aRagexe 或更新版本。
feature.petevolution: on

// 寵物自動餵食（注意 1）
// 需求版本：2014-10-08aRagexe 或更新版本。
feature.petautofeed: on

// 寵物飢餓程度達到多少時觸發自動餵食？（注意 2）
// 預設值：89
feature.pet_autofeed_rate: 89

// 生命體自動餵食（注意 1）
// 需求版本：2017-09-20bRagexeRE 或更新版本。
feature.homunculus_autofeed: on

// 生命體飢餓程度達到多少時觸發自動餵食？（注意 2）
// 預設值：30
//
// 注意：
// 只有用戶端的 LUA 檔案有問題時，才需要使用此設定。
// 預設情況下，用戶端會在飢餓程度達到
// 內建於用戶端的門檻時，自行傳送餵食封包。
feature.homunculus_autofeed_rate: 30

// 簽到系統（注意 1）
// 需求版本：2018-03-07bRagexeRE 或更新版本。
feature.attendance: on

// 私人飛空艇系統（注意 1）
// 需求版本：2018-03-21aRagexeRE 或更新版本。
feature.privateairship: on

// 以物易物商店系統（注意 1）
// 需求版本：2019-01-16RagexeRE 或更新版本。
feature.barter: on

// 擴充以物易物商店系統（注意 1）
// 需求版本：2019-11-06RagexeRE 或更新版本。
feature.barter_extended: on

// 動態 NPC 未被使用時，經過多久（毫秒）後會被移除。
// 預設值：60000（60 秒）。
feature.dynamicnpc_timeout: 60000

// 動態 NPC 相對於玩家生成時，X 軸方向的範圍。
// 預設值：2
feature.dynamicnpc_rangex: 2

// 動態 NPC 相對於玩家生成時，Y 軸方向的範圍。
// 預設值：2
feature.dynamicnpc_rangey: 2

// 動態 NPC 是否應面向玩家？（注意 1）
// 預設值：no
feature.dynamicnpc_direction: no

// 資訊類指令中的物品連結系統（注意 1）
// 為物品產生 itemlink 字串，可用於 npctalk、message、
// dispbottom 與 broadcast 指令。產生的結果會是可點擊的物品名稱，
// 效果如同在玩家背包／手推車／裝備視窗中按住 SHIFT 並點擊物品。
// 需求版本：2015-11-04Ragexe 或更新版本。
feature.itemlink: on

// NPC 訊息中的物品連結系統（注意 1）
// 為物品產生 itemlink 字串，可用於 NPC 的 mes 指令。
// 需求版本：2010-01-01 或更新版本。
feature.mesitemlink: on

// 強制所有 mesitemlinks 使用括號包住。（注意 1）
// 預設值：no
feature.mesitemlink_brackets: no

// 強制所有 mesitemlinks 使用資料庫中的名稱。（注意 1）
// 預設值：no
feature.mesitemlink_dbname: no

// 造型師介面（注意 1）
// 需求版本：2015-11-04 或更新版本。
feature.stylist: on

// 是否允許玩家重新連線並返回副本？（注意 1）
// 此功能在 Renewal 模式中預設啟用，
// 在 Pre-Renewal 模式中預設停用。
// 即使允許此功能，仍會遵守「nosave」mapflag，
// 因此玩家仍可能無法傳送回副本。
//feature.instance_allow_reconnect: yes

// 是否啟用 Gold PC 計時器？（注意 1）
// 預設值：yes
feature.goldpc_active: yes

// 玩家必須在線上多少秒，才能獲得 1 點？
// 預設值：3600（1 小時）
feature.goldpc_time: 3600

// 玩家最多可以累積多少點？
// 預設值：300
feature.goldpc_max_points: 300

// VIP 身分是否讓玩家獲得的點數加倍？（注意 1）
// 預設值：yes
feature.goldpc_vip: yes


