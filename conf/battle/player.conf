//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 玩家最大 HP 倍率？（預設值為 100）
hp_rate: 100

// 玩家最大 SP 倍率？（預設值為 100）
sp_rate: 100

// 左手裝備的卡片與屬性是否套用到右手攻擊？（注意 1）
//（官方伺服器設定為 yes。）
left_cardfix_to_right: yes

// 玩家重生時恢復的 HP 數量；0 為預設值。
//（單位為總 HP 百分比；100 代表 HP 全滿，0 代表重生時只有 1 HP。）
restart_hp_rate: 0

// 玩家重生時恢復的 SP 數量；0 為預設值。
//（單位為總 SP 百分比；100 代表 SP 全滿，0 代表重生時只有 1 SP。）
restart_sp_rate: 0

// 一般玩家是否可以略過技能樹限制？（注意 1）
player_skillfree: no

// 設為 yes 時，第一職業取得的技能點數只能用於第一職業
// 技能；初心者取得的技能點數也只能用於基本技能。（注意 1）
player_skillup_limit: yes

// 是否允許學習任務技能？（注意 1）
// 設為 yes 可能會造成伺服器漏洞！
quest_skill_learn: no

// 重置技能時，是否也一併重置任務技能？（注意 1）
// 設為 yes 可能會造成伺服器漏洞！
// 注意：若 quest_skill_learn 設為 yes，任務技能一律會被重置。
quest_skill_reset: no

// 是否必須學會基本技能，才能坐下、交易、組隊或建立聊天室？（注意 1）
basic_skill_check: yes

// 瞬間移動或生成到地圖後，若玩家不移動，怪物要多久才會發現玩家？（毫秒）
// 也就是進入地圖後保持不動時，怪物經過多久才會注意到玩家。
// 無論此設定為何，只要玩家攻擊怪物，怪物就會反擊。
player_invincible_time: 5000

// HP 自然恢復的時間間隔。（毫秒）
natural_healhp_interval: 6000

// SP 自然恢復的時間間隔。（毫秒）
natural_healsp_interval: 8000

// 自動治療技能的時間間隔。（毫秒）
natural_heal_skill_interval: 10000

// 角色停止自然恢復時所允許的最大負重量。（百分比）
// Renewal 模式：需要 20171025 或更新版本的用戶端才能正確顯示。
natural_heal_weight_rate: 50
natural_heal_weight_rate_renewal: 70

// 最高攻擊速度。（預設 190，允許的最高值為 199）
max_aspd: 190

// 與 max_aspd 相同，但適用於三轉職業。（預設 193，允許的最高值為 199）
max_third_aspd: 193

// 擴充職業（影狼／朧、叛亂者）的最高 ASPD。（預設 193，允許的最高值為 199）
max_extended_aspd: 193

// 召喚師職業（杜蘭族）的最高 ASPD。（預設 193，允許的最高值為 199）
max_summoner_aspd: 193

// 最高移動速度倍率（200 代表上限為一般速度的兩倍）。
max_walk_speed: 300

// 依基礎等級設定的最高 HP。預設值如下：
// 等級 99：330000
// 等級 150：660000
// 等級 175：1100000
max_hp_lv99: 330000
max_hp_lv150: 660000
max_hp: 1100000

// 最高 SP。（預設值為 1000000）
max_sp: 1000000

// 各職業的能力值上限。（STR、AGI、VIT、INT、DEX、LUK）
// max_parameter：初心者、非轉生、非 Baby、非三轉職業
// max_trans_parameter：轉生職業（非三轉轉生職業）
// max_third_parameter：三轉職業（一般／非轉生），Baby 三轉除外
// max_third_trans_parameter：三轉轉生職業
// max_baby_parameter：Baby 職業，Baby 三轉除外
// max_baby_third_parameter：僅適用於 Baby 三轉職業
// max_extended_parameter：擴充二轉職業（影狼／朧、叛亂者）
// 更詳細／進階設定請參閱「db/[pre-]re/job_params_db.txt」。
max_parameter: 99
max_trans_parameter: 99
max_third_parameter: 130
max_third_trans_parameter: 130
max_baby_parameter: 80
max_baby_third_parameter: 117
max_extended_parameter: 125
max_summoner_parameter: 120
max_fourth_parameter: 130

// 轉生職業額外取得的能力點數。
transcendent_status_points: 52

// 裝備 DEF／MDEF 上限
// 注意：伺服器以 Renewal 模式（RENEWAL）執行時，此設定不會生效。
// 注意：不影響技能與 Mental Strength 等狀態效果。
// 若 weapon_defense_type 不為 0，則不會套用至 max def。
// 若 magic_defense_type 不為 0，則不會套用至 max mdef。
max_def: 99

// DEF 轉換為 DEF2 的加成。若裝備 DEF／MDEF 超過 max_def，
// 超出的部分會依此倍率轉換為 VIT DEF／INT MDEF。
//（例如設為 10 時，裝備防禦每超過上限 1 點，就轉換為 10 點 VIT 防禦。）
over_def_bonus: 0

// 手推車可承載的最大重量。
max_cart_weight: 8000

// 玩家受到攻擊後，要禁止登出多久？（毫秒，0 為停用）
prevent_logout: 10000

// 伺服器應在何種情況下禁止玩家登出？若 prevent_logout 已停用，此設定不會生效。（注意 3）
// 官方伺服器會在玩家攻擊、施放技能及受到傷害後禁止登出。
// 0 = 玩家隨時可以登出
// 1 = 登入後禁止登出
// 2 = 攻擊後禁止登出
// 4 = 施放技能後禁止登出
// 8 = 受到攻擊後禁止登出
prevent_logout_trigger: 14

// 是否顯示普通攻擊吸取的 HP／SP 數值？（例如：獵蠅卡片）
show_hp_sp_drain: no

// 是否顯示擊殺怪物時取得的 HP／SP 數值？（例如：天空德古拉卡片）
show_hp_sp_gain: yes

// 啟用時，A 接受 B 為好友後，B 也會自動將 A 加入好友清單。
// 清單；否則只有 A 會出現在 B 的好友清單中。
// 注意：此設定會啟用好友自動新增與自動刪除。
friend_auto_add: yes

// 是否自動拒絕同時收到的交易／隊伍／公會邀請要求？
invite_request_check: yes

// 玩家死亡時是否掉落「Skull（頭骨）」？
// 注意：「Skull」物品（ID 7420）預設禁止交易。若要使用此功能，
// 必須先移除此物品的 NoTrade 標記。
// 0 = 停用
// 1 = 僅在 PvP 地圖掉落
// 2 = 所有情況都會掉落
bone_drop: 0

// 騎乘大嘴鳥的角色是否增加體型？
// 0 = 否
// 1 = 只有一般職業騎乘大嘴鳥時會變成大型
// 2 = 只有 Baby 職業騎乘大嘴鳥時會變成中型
// 3 = 一般職業騎乘大嘴鳥時變成大型，
//    Baby 職業騎乘大嘴鳥時變成中型
character_size: 0

// 閒置中的角色是否可以取得自動拾取物品？
// 設定閒置角色停止取得自動拾取物品前的秒數，
//（0：停用）。
idle_no_autoloot: 0

// 擺設露天商店／聊天室時，與 NPC 之間必須保持的最短距離。
// 預設值：3（0：停用）。
min_npc_vendchat_distance: 3
 
// 租用坐騎應提高玩家多少移動速度？
// 預設值為 25。100 = 增加 100%。
rental_mount_speed_boost: 25

//===================================
// VIP 系統
//===================================
// 增加倉庫欄位數量。設為 0 可停用。
// 在 MIN_STORAGE 基礎上額外增加倉庫欄位。
// 注意：MIN_STORAGE + vip_storage_increase 不可超過 MAX_STORAGE。
// 預設值：300
vip_storage_increase: 300

// Base EXP 額外倍率。設為 0 可停用。（注意 2）
// 預設值：50
vip_base_exp_increase: 50

// Job EXP 額外倍率。設為 0 可停用。（注意 2）
// 預設值：50
vip_job_exp_increase: 50

// VIP 帳號的經驗值懲罰倍率。
// 預設值：100（100 = 1% 懲罰）
vip_exp_penalty_base: 100
vip_exp_penalty_job: 100

// VIP 帳號的 Zeny 懲罰。
// 只有玩家被其他玩家擊殺時才會損失 Zeny。
// 預設值：0（100 = 1% 懲罰）
vip_zeny_penalty: 0

// 戰鬥手冊經驗值加成。設為 0 可停用。
// - 一般／厚重戰鬥手冊：50+(50/X) = 75%
// - 高級戰鬥手冊：100+(100/X) = 150%
// - 三倍戰鬥手冊：200+(200/X) = 300%
// 注意：X 代表此設定值。
// 預設值：2
vip_bm_increase: 2

// 物品掉落率加成。設為 0 可停用。
// 注意：50 = item_drop 增加 50%。
// 例如 item_rate = 200：200 * 50 / 100 = 額外增加 100，與基礎倍率 200 相加後總倍率為 300。
// 預設值：50
vip_drop_increase: 50

// 寶石需求
// VIP 群組是否可以忽略技能的寶石需求？
// 0 = 停用
// 1 = 效果同女王甲蟲卡片
// 2 = 移除所有寶石需求（預設值）
vip_gemstone: 2

// 是否顯示倍率資訊（經驗值、掉落率及死亡懲罰訊息）？（注意 1）
vip_disp_rate: yes

// 傳送時是否復活死亡玩家？（注意 1）
revive_onwarp: yes

// 取得跆拳道排行榜獎勵所需的最低基礎等級。
// - 最高 HP 與 SP 變為 3 倍
// - 可使用所有跆拳道技能
taekwon_ranker_min_lv: 90

// 取得名聲點數
// 完成跆拳道任務
fame_taekwon_mission: 1
// 將自己製作的武器精鍊至 +10
fame_refine_lv1: 1
fame_refine_lv2: 25
fame_refine_lv3: 1000
// 使用 3 種額外材料成功製作 Lv3 武器
fame_forge: 10
// 自製武器精鍊至 +10 時取得點數所需的精鍊門檻
blacksmith_fame_refine_threshold: 10
// 連續成功製作 n 瓶濃縮藥水
fame_pharmacy_3: 1
fame_pharmacy_5: 3
fame_pharmacy_7: 10
fame_pharmacy_10: 50

// 伺服器應如何計算角色的閒置時間？（注意 3）
// 0x0001 - 移動請求
// 0x0002 - UseSkillToID 請求（對目標使用技能）
// 0x0004 - UseSkillToPos 請求（指定位置使用範圍技能）
// 0x0008 - 使用物品請求（包含裝備／卸下裝備）
// 0x0010 - 攻擊請求
// 0x0020 - 聊天請求（密語、隊伍、公會、競技場等）
// 0x0040 - 坐下／站立請求
// 0x0080 - 表情請求
// 0x0100 - 丟棄物品請求
// 0x0200 - @／# 指令請求
// 0x0400 - 關閉 NPC 視窗
// 0x0800 - 向 NPC 輸入資料
// 0x1000 - 選擇 NPC 選單項目
// 0x2000 - 點擊 NPC 的下一步按鈕
// 0x4000 - 完成 NPC 進度條
// 請注意：至少必須啟用一個選項。
// 請留意：啟用的選項越多，越容易有人利用依賴閒置時間的功能作弊（例如 checkidle()）。
// 預設：walk (0x1) + useskilltoid (0x2) + useskilltopos (0x4) + useitem (0x8) + attack (0x10) + 任意 NPC 互動 (0x400,0x800,0x1000,0x2000,0x4000) = 0x7C1F
idletime_option: 0x7C1F

// 調整召喚師職業的特殊特性。
// - 召喚師屬於 Brute 種族分類。其專屬種族代碼為 RC_PLAYER_DORAM (11)，與怪物種族 RC_BRUTE (2) 區分。
// - 召喚師體型為小型（0），而非中型（1）。
summoner_race: 11
summoner_size: 0

//================================
// 四轉職業系統
//================================
// 玩家轉職為四轉職業時可獲得多少特性點數？
// 預設值：7
trait_points_job_change: 7

// 特性能力值上限。
// 特性能力值：POW、STA、WIS、SPL、CON、CRT
// 官方設定為 110。
max_trait_parameter: 110

// 道具加成／技能最多可忽略的 RES／MRES 百分比。
// 預設值：50
max_res_mres_ignored: 50

// AP 上限
// 預設值：1000
max_ap: 1000

// 玩家最大 AP 倍率？（預設值為 100）
ap_rate: 100

// 玩家重生時恢復的 AP 數量；0 為預設值。
//（單位為總 AP 百分比；100 代表 AP 全滿，0 代表重生時沒有 AP。）
restart_ap_rate: 0

// 玩家死亡時是否損失 AP？
// 預設值：yes
loose_ap_on_death: yes

// 玩家進入 PVP／GVG／WoE／競技場地圖時是否損失 AP？
// 預設值：yes
loose_ap_on_map: yes

// 玩家登出時是否保留 AP？
// 預設值：yes
keep_ap_on_logout: yes
