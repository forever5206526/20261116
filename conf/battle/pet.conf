//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 寵物捕捉成功率是否使用舊版計算公式？（注意 1）
// 舊版 Athena 公式：
//		( Base rate + ( player level - monster level ) * 30 + player luk * 20 ) * ( 200 - current monster hp percentage ) / 100
// 官方公式（預設）：
//		Base rate + ( 100 - current monster hp percentage ) * base rate / 100
pet_legacy_formula: no

// 寵物捕捉成功率倍率。（注意 2）
pet_catch_rate: 100

// 玩家與要捕捉的怪物最多可相距幾格？
// 嘗試捕捉怪物時，用戶端會自動讓玩家走近至有效距離。
// 預設值：5
// 設為 0 可停用此檢查。
pet_distance_check: 5

// 官方伺服器中，玩家處於隱匿狀態時無法捕捉怪物。（注意 1）
pet_hide_check: yes

// 是否允許寵物名稱重複使用？（注意 1）
pet_rename: no

// 餵食後寵物親密度增加的倍率。（注意 2）
pet_friendly_rate: 100

// 寵物飢餓值增加的倍率。（注意 2）
pet_hungry_delay_rate: 100

// 寵物使用技能前是否必須裝備寵物裝備？（注意 1）
// 這些加成並非官方設定，資料位於 import/pet_db.yml。
pet_equip_required: yes

// 主人背包空間不足時，是否銷毀寵物裝備？（注意 1）
// 官方行為為 yes；設為 no 時，物品會維持裝備狀態。
pet_unequip_destroy: yes

// 主人攻擊怪物時，寵物是否也會跟著攻擊？（注意 1）
pet_attack_support: no

// 主人受到怪物傷害時，寵物是否會反擊？（注意 1）
pet_damage_support: no

// 寵物支援主人所需的最低親密度。預設值為 900。
//（親密度範圍為 0～1000）。達到此最低值時，支援機率為寵物正常值的 50%。
// 最高親密度（1000）時，支援機率為 150%。
pet_support_min_friendly: 900

// 寵物是否會使用技能？（注意 1）
// Note: Offensive pet skills need at least pet_attack_support or 
// pet_damage_support 才會生效（寵物攻擊時才會觸發）。
pet_status_support: no

// 寵物在戰鬥中支援主人的機率倍率。（注意 2）
// 影響 pet_attack_support 與 pet_damage_support。
pet_support_rate: 100

// 寵物造成傷害時，主人是否取得經驗值？
pet_attack_exp_to_master: no

// 寵物攻擊怪物時取得經驗值的倍率。
pet_attack_exp_rate: 100

// 寵物等級系統。設為 0 可停用（預設值）。
// 啟用後，寵物等級會依主人等級的固定百分比計算。（注意 2）
// 例如 200% 代表寵物等級為主人的兩倍；50% 代表一半。
pet_lv_rate: 0

// 啟用寵物等級系統時，寵物能力值的上限是多少？
pet_max_stats: 99

// 啟用寵物等級系統時，以下設定會限制
// 最小／最大傷害。注意：這些設定只限制 atk1 與 atk2；若您
// 啟用 pet_str，則最大傷害會改為 base_atk + pet_max_atk2。
pet_max_atk1: 500
pet_max_atk2: 1000

// 公會戰期間是否停用寵物？
// 設為 yes 時，WoE 期間進入城堡會自動將寵物收回寵物蛋，
// 並禁止在城堡內孵化寵物。
pet_disable_in_gvg: no

// petskillattack2 的固定傷害是否忽略植物型無限防禦？（注意 1）
pet_ignore_infinite_def: yes

// 主人死亡時，寵物是否繼續攻擊？（注意 1）
pet_master_dead: no

// 即使用戶端設定關閉自動餵食通知，是否仍傳送通知？（注意 1）
// 官方設定：yes
pet_autofeed_always: yes

// 寵物移動速度。
// 1：主人的移動速度（官方設定）
// 2：DEFAULT_WALK_SPEED 數值
// 3：怪物資料庫中的移動速度
pet_walk_speed: 1
