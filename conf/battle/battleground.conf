//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 競技場地圖中的近距離普通攻擊傷害調整（非技能）。（注意 2）
bg_short_attack_damage_rate: 80

// 競技場地圖中的遠距離普通攻擊傷害調整（非技能）。（注意 2）
bg_long_attack_damage_rate: 80

// 競技場地圖中的物理武器技能傷害調整。（注意 2）
bg_weapon_attack_damage_rate: 60

// 競技場地圖中的魔法技能傷害調整。（注意 2）
bg_magic_attack_damage_rate: 60

// 競技場地圖中的其他類型技能傷害調整。（注意 2）
bg_misc_attack_damage_rate: 60

// 競技場地圖中的迴避懲罰。
// 注意：此值為百分比而非固定數值；20 代表總迴避降低 20%。
bg_flee_penalty: 20

// 更新競技場成員地圖小點的間隔（毫秒）。
bg_update_interval: 1000

// 從競技場佇列傳送玩家進入競技場前，
// 先檢查玩家目前所在地圖是否設定 MF_NOWARP。
bgqueue_nowarp_mapflag: no
