//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// PK 伺服器模式。將整個伺服器切換為 PVP（城鎮除外）。被其他玩家擊殺時，經驗值損失加倍。
// 玩家狩獵高於自身 20 級以上的怪物時，可額外獲得 15% 經驗值，並有 25% 機率取得更多物品。
// 此模式可透過 nopvp.txt 指定不啟用 PK 的地圖。初心者不會被攻擊，也不能攻擊他人。
// 一般 PVP 計數器與排名顯示也會停用。
// 注意：若 pk_mode 設為 2 而非 1（yes），玩家每次擊殺其他玩家時，
//   都會受到 5 點禮貌值懲罰（請參閱 manner_system 設定）。
//   設定以調整此懲罰對玩家造成的影響）。
pk_mode: 0

// 玩家進入 PK 區域時是否顯示訊息？
// 僅在 pk_mode 啟用時生效。（注意 1）
pk_mode_mes: yes

// 禮貌值／業力系統設定。指定負禮貌值
//（紅色且無聊天泡泡）對玩家造成哪些影響（可依需求組合）：
//  0：不施加懲罰。
//  1：禁止聊天（包含密語、隊伍／公會訊息等）。
//  2：禁止使用技能。
//  4：禁止使用指令。
//  8：禁止使用／拾取／丟棄物品。
// 16：禁止建立房間（聊天室與露天商店）。
manner_system: 15

// PK 伺服器模式下，設定玩家開始 PK 所需的最低等級。
pk_min_level: 55

// PK 伺服器模式下，指定允許玩家互相攻擊的最高等級差距。
// 超過此差距便無法互相攻擊。設為 0 可取消限制。
pk_level_range: 0

// PK 伺服器的傷害調整設定，其計算方式與 WoE 相同，
// 與 WoE 對應設定相同（請參閱 guild.conf）。
pk_short_attack_damage_rate: 80
pk_long_attack_damage_rate: 70
pk_weapon_attack_damage_rate: 60
pk_magic_attack_damage_rate: 60
pk_misc_attack_damage_rate: 60

// 是否在主控台顯示技能使用情況？（僅供除錯，預設：off）（注意 3）
skill_log: off

// 是否顯示戰鬥記錄？（僅供除錯，預設：off）（注意 1）
battle_log: off

// 是否顯示其他資訊？（僅供除錯，預設：off）（注意 1）
etc_log: off

// 是否除錯傳送點？設為 yes 時，傳送點會以旗幟顯示。（注意 1）
// 伺服器啟動時也會執行傳送點檢查，並列出哪些傳送點會直接通往
// 觸碰型 NPC 上方（這可能造成無限循環傳送）。
warp_point_debug: no

// 設定伺服器啟動時為夜晚（yes）或白天（no）。
night_at_start: no

// 設定白天持續時間（毫秒，預設：7200000 = 2 小時）。
// 設為 0 可停用日夜循環（但不影響 @day GM 指令）。
// 除 0 外，最小值為 60000（1 分鐘）。
day_duration: 0

// 設定夜晚持續時間（毫秒，預設：1800000 = 30 分鐘）。
// 設為 0 可停用夜晚循環（但不影響 @night GM 指令）。
// 除 0 外，最小值為 60000（1 分鐘）。
night_duration: 0

// 是否允許在 PVP 地圖使用決鬥？
duel_allow_pvp: no

// 是否允許在 GvG 地圖使用決鬥？
duel_allow_gvg: no

// 決鬥期間是否允許使用瞬間移動／傳送？
duel_allow_teleport: no

// 死亡時是否自動退出決鬥？
duel_autoleave_when_die: yes

// 兩次使用 @duel 指令之間的間隔（分鐘）。
duel_time_interval: 60

// 是否限制只能與同一張地圖上的玩家決鬥？
duel_only_on_same_map: no

// 設定同一格地圖座標最多可疊加的角色數量。
// 官方模式：只影響角色（包含怪物）的移動流程。
// 若單位停止移動時所在格子的角色數量超過 stack limit，
// 就會移動到最近的空格。
// 設為 0 時不檢查格子重疊數量，允許自由移動。
// 自訂模式：此模式會將已滿載的格子視為牆壁。
// 注意：若要讓自訂設定生效，伺服器必須使用支援 Cell Stack Limit 的版本編譯，
// 詳情請參閱 src/map/map.hpp。
official_cell_stack_limit: 1
custom_cell_stack_limit: 1

// 是否只允許在具有 autotrade mapflag 的地圖使用自動擺攤？
// 設為 no 時，即使地圖未設定 autotrade mapflag 也允許自動擺攤。
// 設為 yes 時，只允許在具有 autotrade mapflag 的地圖自動擺攤。
at_mapflag: no

// 設定自動擺攤角色經過多少分鐘後會被伺服器踢除。
at_timeout: 0

// 自動擺攤時是否讓玩家不會受到攻擊？（會啟用玩家的 state.monster_ignore）（注意 1）
at_monsterignore: no

// 自動擺攤時是否觸發 OnPCLogout 腳本事件？（注意 1）
at_logout_event: yes

// 拍賣系統每小時的費用。預設值為 12000。
auction_feeperhour: 12000

// 拍賣物品的最高出售價格。
auction_maximumprice: 500000000

// 每次商店搜尋請求之間的最短間隔（秒）。
searchstore_querydelay: 10

// 商店搜尋結果達到多少筆時，
// 便取消此次搜尋。
searchstore_maxresults: 30

// 是否顯示商城點數的增加與扣除訊息？（注意 1）
// 預設值：no
cashshop_show_points: no

// 登入時是否顯示信箱狀態？
// 預設值：0
// 0 = 否
// 1 = 是
// 2 = 有未讀郵件時才顯示
mail_show_status: 0

// 每位使用者每天可寄送的郵件數量。
// 預設值：100
// 0 = 不限數量
mail_daily_count: 100

// 透過郵件轉帳 Zeny 的手續費。（注意 2）
// 注意：此倍率寫死在用戶端中；若變更此值，必須同步修改用戶端。
// 預設值：2（2%）
// 0 = 不收取費用
mail_zeny_fee: 2

// 每件郵件附件需支付的 Zeny 費用。
// 注意：此費用寫死在用戶端程式中；若要變更此值，必須同步修改用戶端。
// 預設值：2500
// 0 = 不收取費用
mail_attachment_price: 2500

// 單封郵件所有附件的總重量上限。
// 注意：此上限寫死在用戶端中；若變更此值，必須同步修改用戶端。
// 預設值：2000
// 0 = 不限制重量
mail_attachment_weight: 2000

// 公會戰期間是否停用怪物變身？
// 設為 yes 時，WoE 期間進入城堡會自動解除／停用怪物變身。
mon_trans_disable_in_gvg: no

// 道具商店／點數商店中的物品價格是否允許折扣？
// 0 = 否（預設值）
// 1 = 道具商店
// 2 = 點數商店
// 3 = 道具商店與點數商店
discount_item_point_shop: 0

// 是否不顯示「登入伺服器已收到要求，將對玩家 '%.*s' 執行 %s。」訊息？（注意 1）
disp_servervip_msg: no

// 允許使用者重新寄送郵件的等待時間（預設值與最小值皆為 1000）。
mail_delay: 1000

// 是否禁止將玩家收藏分頁中的物品賣給 NPC？（注意 1）
hide_fav_sell: no

// 在地圖上搜尋隨機位置時，地圖邊界有多少範圍不列入搜尋？
// 官方設定中，地圖四周各 15 格不會被列為目標格。
// 在金字塔等部分地圖中，這會使外圍區域的怪物數量大幅減少；此設定也
// 會影響瞬間移動。若要接近舊版模擬器行為，請設為 1。
// 有效值：1～40
map_edge_size: 15

// 玩家丟棄物品時，是否允許多件物品堆疊在同一格？（注意 1）
// 官方設定不限制同一格可堆疊的物品數量。
// 設為 no 時，丟棄物品只會放在尚未有其他物品的格子上。
// 系統會朝八個方向尋找空格；若八次搜尋都找不到空格，
// 丟棄物品就會失敗（物品會留在玩家背包中）。
item_stacking: yes
