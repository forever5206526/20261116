//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 受到詛咒／暈眩／睡眠等狀態（包含沉默）影響時，是否取消技能詠唱？（注意 3）
status_cast_cancel: 0

// 登出時是否移除特定技能狀態？
// 0 =（預設）只移除具有 SCF_NO_SAVE 標記的狀態。
// 1 = 移除負面狀態（標記為 debuff 的狀態）
// 2 = 移除正面狀態。
// 3 = 全部移除。
debuff_on_logout: 0

// 狀態異常自然抗性的倍率調整。
// 設為 50 時，狀態抗性減半；若要完全抵抗該狀態，所需能力值將變成兩倍，
//（例如需要 200 VIT 才能完全抵抗暈眩）。
pc_status_def_rate: 100
mob_status_def_rate: 100

// 狀態異常的最高抗性。（100 = 100%）
// 注意：卡片與裝備效果可以超過此上限，因此此限制只適用於自然抗性。
pc_max_status_def: 100
mob_max_status_def: 100
