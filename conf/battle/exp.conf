//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：各職業的最高等級儲存在經驗值資料表中。
//         請修改 db/exp.txt 與 db/exp2.txt 中的資料。
//--------------------------------------------------------------

// 經驗值發放倍率。（注意 2）
base_exp_rate: 100

// 職業經驗值發放倍率。（注意 2）
job_exp_rate: 100

// 啟用後，玩家擊殺怪物時可因單次擊殺連續提升多個等級。（注意 1）
multi_level_up: no

// 是否允許玩家連續升級，直到指定等級？
// 只有啟用 multi_level_up 時才會生效。
// 預設值：0（不限制）
multi_level_up_base: 0
multi_level_up_job: 0

// 此設定可限制單次擊殺最多取得多少經驗值，限制值以目前經驗值進度條的
// 百分比表示。（每 10 = 1.0%）
// For example, set it to 500 and no matter how much exp the mob gives, 
// 單次取得的經驗值都不會超過目前經驗值進度條的一半。
max_exp_gain_rate: 0

// 擊敗怪物時，計算取得經驗值的方式：
// 0 = 以造成傷害／怪物受到的總傷害作為傷害比例
// 1 = 以造成傷害／怪物最大 HP 作為傷害比例
// 2 = 與 0 相同，但第一位攻擊者的貢獻計算兩次
exp_calc_type: 0

// 每增加一名攻擊者，怪物提供的經驗值就會額外增加此百分比。
// 此設定決定每位額外攻擊者所增加的經驗值比例。
//（例如 5 人攻擊且此值為 25，則增加 25*4% = 100% 經驗值。）
exp_bonus_attacker: 25

// 經驗值加成計算時採用的攻擊者人數上限。
//（例如設為 5，無論實際攻擊者有多少人，最多只計算 4 人的額外加成。）
exp_bonus_max_attacker: 12

// MVP 額外經驗值倍率。（注意 2）
mvp_exp_rate: 100

// NPC 發放的 Base／Job 經驗值倍率。（注意 2）
quest_exp_rate: 100

// 使用 Heal 技能取得職業經驗值的倍率。（100 等於治療量，200 則為兩倍。
// 建議將經驗值倍率設定在 5 到 10 之間，以取得較佳平衡。）
heal_exp: 0

// 透過復活流程取得經驗值的倍率，單位為 0.01%。
// 計算方式：經驗值 × 被復活者的等級差／100 × resurrection_exp／10000。
resurrection_exp: 0

// 對 NPC 使用 Discount 與 Overcharge 技能時取得的 Job 經驗值倍率。
//（以 0.01% 為單位：100 = 1%、10000 = 正常、20000 = 兩倍。）
// 計算方式為：（取得金額 × 技能等級）× shop_exp／10000。
shop_exp: 0

// PvP 地圖中的經驗值設定：玩家是否能在 PvP 地圖取得經驗值？
//（注意：不是擊殺玩家取得經驗值，而是一般練功取得的經驗值。）
pvp_exp: yes

// 玩家死亡時，應如何施加經驗值懲罰？
// 0 = 不施加懲罰。
// 1 = 死亡時扣除目前等級經驗值的指定百分比。
// 2 = 死亡時扣除總經驗值的指定百分比。
death_penalty_type: 1

// Base 經驗值懲罰倍率（每 100 代表扣除 1% 經驗值）。
death_penalty_base: 100

// Job 經驗值懲罰倍率（每 100 代表扣除 1% 經驗值）。
death_penalty_job: 100

// 玩家被其他玩家擊殺時，應扣除多少 Zeny？
// 注意：此值為 Zeny 的百分比，因此 100 = 1%。
zeny_penalty: 0

// Base／Job 等級已達上限的玩家，死亡時是否仍會失去經驗值？
// 0：永不扣除（官方預設行為）。
// 1：扣除 Base 經驗值。
// 2：扣除 Job 經驗值。
death_penalty_maxlv: 0

// 是否顯示擊殺怪物所獲得的經驗值？（注意 1）
disp_experience: no

// 是否顯示取得的 Zeny（例如怪物掉落、交易等）？（注意 1）
disp_zeny: no

// 重置能力值或升級時，是否使用 db/statpoint.txt 中的資料？（注意 1）
// If no, an equation will be used which preserves statpoints earned/lost 
// 例如能力點數買賣功能。
use_statpoint_table: yes

// 重置能力值或升級時，是否使用 db/statpoint.yml 中的資料？（注意 1）
// If no, an equation will be used which preserves trait points earned/lost 
// 例如特性點數買賣功能。
use_traitpoint_table: yes

// 施放 PR_REDEMPTIO 所需的經驗值。（注意 2）
exp_cost_redemptio: 1

// 需要復活多少名玩家，PR_REDEMPTIO 的經驗值懲罰才會降為 0？
// 例如 exp_cost_redemptio 預設為 1（1%），每復活一名玩家，懲罰減少 0.2%，
// 則 exp_cost_redemptio_limit 應設為 5。
exp_cost_redemptio_limit: 5
