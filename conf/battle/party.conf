//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
//--------------------------------------------------------------

// 有人使用偷竊技能（Gank／Steal）時，是否在隊伍中顯示其名稱？（注意 1）
show_steal_in_same_party: no

// 更新隊伍成員地圖小點的間隔（毫秒）。
party_update_interval: 1000

// 更新隊伍成員 HP 條的方式：
// 0：Aegis - 每次 HP 變更時更新（較耗頻寬）
// 1：rAthena - 隨隊伍地圖小點一起更新（最多延遲 1 秒）
party_hp_mode: 0

// 注意：
// 隊伍內經驗值分享的等級差距設定位於 conf/inter_athena.conf，
// 對應設定鍵為「party_share_level」。

// 隊伍啟用「物品共享」時，
// 是否在隊伍頻道公告哪位成員取得物品，以及取得了什麼物品？（注意 1）
show_party_share_picker: yes

// 啟用 show_party_share_picker 時，要公告哪些類型的物品？
// 1：IT_HEALING、2：IT_UNKNOWN、4：IT_USABLE、8：IT_ETC，
// 16：IT_WEAPON、32：IT_ARMOR、64：IT_CARD、128：IT_PETEGG，
// 256：IT_PETARMOR、512：IT_UNKNOWN2、1024：IT_AMMO、2048：IT_DELAYCONSUME
// 262144：IT_CASH
show_picker.item_type: 112

// 隊伍啟用物品分配時，物品的分配方式：
// 
// 0：一般模式（物品隨機分配給一名隊伍成員）
// 1：非怪物掉落物（玩家／寵物掉落）不套用物品分配
// 2：輪流分配（依序平均分配給隊伍成員）
// 3：1 + 2
party_item_share_type: 0

// 是否禁止閒置隊伍成員分享經驗值／物品？
// 可設為 no，或指定需要經過多少秒（不是毫秒）後，才將
// 角色判定為閒置。
// 正在聊天或擺設露天商店的角色，一律視為閒置。
// 角色使用物品、使用技能、攻擊（包含自動攻擊）或移動時，閒置狀態會重設。
idle_no_share: no

// 平均分配經驗值的隊伍中，每增加一名參與成員（不含自己）是否額外增加經驗值？
// 範例：設為 10 時，5 人平均分配隊伍會額外獲得 40% 經驗值（4 名其他成員 * 每人 10%）：
//     隊伍總經驗值為 140%，每位成員取得 140%/5 = 28%（原本為 20%）。
party_even_share_bonus: 0

// 無論玩家是否加入公會，是否都顯示隊伍名稱？
// 官方伺服器即使玩家沒有加入公會，也會顯示隊伍名稱。（注意 1）
display_party_name: yes

// 是否禁止同一帳號的多個角色加入同一個隊伍？（注意 1）
block_account_in_same_party: yes

// 若指定玩家不在同一張地圖，是否禁止將隊長轉交給該玩家？（注意 1）
change_party_leader_samemap: yes
