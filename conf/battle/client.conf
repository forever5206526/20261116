//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         單位類型：1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵。
//--------------------------------------------------------------

// 密語／全域／隊伍／公會訊息之間的最短間隔（毫秒）。
// 未達此間隔的訊息會直接略過，不會顯示提示。
min_chat_delay: 0

// 用戶端支援的染色與造型編號範圍。
min_hair_style: 0
max_hair_style: 42
min_hair_color: 0
max_hair_color: 8
min_cloth_color: 0 
max_cloth_color: 7

// 設為 yes 時，從 WoE 地圖送出的封包，其傷害欄位會設為
// -1，使 GM、機器人及修改過的用戶端無法得知
// 攻擊實際造成的傷害。（注意 1）
hide_woe_damage: no

// 用來識別寵物的「髮型」編號。
// 注意：用戶端會使用怪物封包中的「髮型」欄位，將寵物與一般怪物區分。
// 此值必須高於該用戶端支援的最大髮型編號。
// 已知可用的數值（適用於所有 2005 年用戶端）：
// 舊版 Sakexe：20
// Sakexe 0614：24
// Sakexe 0628（及更新版本）：100
pet_hair_style: 100

// 可視範圍大小（玩家可看見周圍幾格內的單位）。
area_size: 14

// 最大移動路徑長度（玩家點擊游標位置時最多可移動幾格）。
max_walk_path: 17

// 單位封包中允許傳送的最高 level 值。
// 請搭配 aura_lv 設定，決定何時顯示光環。
// 注意：若要使用此功能，也必須調整用戶端。
// 注意：預設值為 99。高於 127 的數值可能會造成異常。
// 注意：若不清楚此設定的用途，請勿修改！
max_lv: 99

// 顯示光環所需的等級。
// 注意：此設定假設傳送 max_lv 給用戶端即可顯示光環。
// 注意：aura_lv 不可小於 max_lv。
// 範例：若 max_lv 為 99、aura_lv 為 150，等級 99～149 的角色
//          將以等級 98 傳送；只有等級
//          150 以上的角色才會以等級 99 傳送並顯示光環。
aura_lv: 99

// 會受到 max_lv 與 aura_lv 設定影響的單位類型。（注意 3）
// 注意：若將原本不會顯示光環的單位類型
//       納入設定，達到等級需求時便會顯示光環。
// 預設值：0（無）
client_limit_unit_lv: 0

// 穿著燕尾服與婚紗時，是否顯示相應服裝外觀？（注意 1）
wedding_modifydisplay: no

// 是否儲存服裝顏色？（會降低效能）（注意 1）
save_clothcolor: yes

// 是否儲存體型造型？（注意 1）
save_body_style: yes

// 婚禮服裝是否不顯示服裝顏色？
// 注意：必須同時啟用 save_clothcolor 與 wedding_modifydisplay，
// 才會使此設定生效。若您的服裝調色盤
// 檔案沒有婚禮調色盤（或數量少於其他職業），請設為 yes。
wedding_ignorepalette: no

// 聖誕服裝是否不顯示服裝顏色？
// 若服裝調色盤檔案沒有聖誕調色盤（或數量少於其他職業），請設為 yes。
xmas_ignorepalette: no

// 夏季服裝是否不顯示服裝顏色？
// 若服裝調色盤檔案沒有夏季調色盤（或數量少於其他職業），請設為 yes。
summer_ignorepalette: no

// 韓服是否不顯示服裝顏色？
// 若服裝調色盤檔案沒有韓服調色盤（或數量少於其他職業），請設為 yes。
hanbok_ignorepalette: no

// 啤酒節服裝是否不顯示服裝顏色？
// 若服裝調色盤檔案沒有啤酒節調色盤（或數量少於其他職業），請設為 yes。
oktoberfest_ignorepalette: no

// 若用戶端因 langtype 問題而無法正確顯示每日訊息（MOTD），請設為 1。
motd_type: 0

// 玩家登入時是否顯示 brHades 版本？
display_version: yes

// 受到「Hallucination（幻覺）」狀態影響時，是否將效果傳送給用戶端？（注意 1）
// 注意：若用戶端因「Wavy」畫面效果而卡頓，請設為 no。
display_hallucination: yes

// 若用戶端支援狀態變更計時器且您想使用此功能，請設為 1。
// 2009 年及之後的用戶端支援此功能。
display_status_timers: yes

// 在伺服器端隨機化骰子表情符號，以防止用戶端偽造
// 指定點數的封包。（注意 1）
client_reshuffle_dice: yes

// 將角色倉庫與公會倉庫排序後，再傳送給用戶端。
// 官方伺服器不會排序倉庫。（注意 1）
// 注意：啟用此選項會降低效能。
client_sort_storage: no

// 隱形狀態下，是否仍更新敵人的位置？（注意 1）
// 注意：設為 no 時，除非玩家具有「Intravision」效果，否則用戶端不會更新敵人位置。
//       這有助於用戶端處理 WPE／Maya Purple 等相關漏洞。
//       但玩家隱形時，遊戲動畫顯示可能會異常。
update_enemy_position: yes

// 玩家瞬間移動、切換地圖或登入時，是否維持傳送前面向的方向？
// 官方設定：停用；玩家一律面向北方。
spawn_direction: no

// 是否對 2013-12-23cRagexe 及更新版本的用戶端顯示 MVP 經驗值獎勵訊息？（注意 1）
// kRO 已移除此封包；啟用此設定可重新顯示訊息。
// 官方設定：停用。
mvp_exp_reward_message: no

// 傳送 Ping 計時器
// 每次觸發計時器的間隔（秒）。
ping_timer_inverval: 30

// 傳送 Ping 封包前等待的逾時時間（秒）。
ping_time: 20

// 是否對 2015-12-23 及更新版本的用戶端顯示技能縮放？（注意 1）
// 官方設定：yes
show_skill_scale: yes

// 收到玩家的斷線要求後，伺服器端是否立即中斷連線？（注意 1）
// 注意：已知啟用此功能可能會造成使用 REST API 呼叫的用戶端發生問題。
// 官方設定：no
drop_connection_on_quit: no

// 巨集偵測重試次數
// 使用者在遭到封鎖前，可以通過巨集偵測失敗的次數。
// 官方設定：3（最小值：1）
macro_detection_retry: 3

// 巨集偵測逾時
// 巨集偵測等待多久（毫秒）後判定失敗並封鎖使用者。
// 官方設定：60000
macro_detection_timeout: 60000

// 巨集偵測懲處類型
// 0 - 封鎖
// 1 - 監禁
// 官方設定：0
macro_detection_punishment: 0

// 巨集偵測懲處持續時間
// 懲處生效的時間（分鐘）。設為 0 表示永久。
// 官方設定：0
macro_detection_punishment_time: 0
