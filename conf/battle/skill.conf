//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         單位類型：1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵。
//--------------------------------------------------------------

// 技能詠唱時間倍率。（注意 2，0 = 無詠唱時間）
casting_rate: 100

// 詠唱後延遲倍率。（注意 2）
delay_rate: 100

// 延遲時間是否受到施法者 DEX／AGI 影響？（注意 1）
// 注意：官方伺服器中，DEX 與 AGI 都不會影響延遲時間。
delay_dependon_dex: no
delay_dependon_agi: no

// 所有技能在 castbegin 之後允許的最短延遲（毫秒）。（注意 1）
// 注意：設定為大於 0 的值可防止加速外掛。
min_skill_delay_limit: 100

// 此延遲是所有技能最短的「無法移動延遲」。
// 注意：請勿將此值設得過低，否則角色在技能施放後可能過早開始移動。
// 使用技能後太快開始移動，用戶端可能不會更新位置，玩家看起來會像
// 是瞬間傳送。怪物則使用 AttackMotion。
default_walk_delay: 300

// 完全停用下列類型的技能延遲。（注意 3）
// 注意：預設情況下，怪物不會使用 skill_db 中設定的技能延遲，
//  而是遵守 mob_skill_db 中指定的「reuse」技能延遲。
//  啟用此設定後，所有技能的延遲都會變成
// min_skill_delay_limit。
no_skill_delay: 2

// DEX 達到多少時，詠唱時間會變成 0（瞬發）？
castrate_dex_scale: 150

// (DEX * 2 + INT) 達到多少時，變動詠唱時間會歸零？
vcast_stat_scale: 530

// 官方伺服器在 castbegin 時套用 amotion 延遲，castend 時不會套用。
// 設定為大於 0 時，castend 也會套用 amotion 延遲。（注意 2）
// 注意：此設定會破壞具有詠唱時間但沒有施法後延遲的技能連續施放。
// 用戶端端的延遲因技能而異，通常介於 140～180。
// 若要確保安全，建議設定在 90～140 之間。
skill_amotion_leniency: 0

// 普通攻擊是否可以忽略技能施放後的延遲？（注意 1）
skill_delay_attack_enable: yes

// 技能詠唱完成後額外套用的射程。
// 決定技能開始詠唱後，目標最多可移動多遠才會使技能失敗。
// 0 = 停用此距離檢查（預設值）
skill_add_range: 0

// 詠唱期間目標移出射程時，是否仍扣除該技能所需物品與 SP？（注意 1）
skill_out_range_consume: no

// 是否依施法者與目標的距離判定技能為遠距離技能？（注意 3）
// 啟用後，施法者與目標距離大於 3 格時視為遠距離技能，否則視為近距離技能。
// 未啟用時，會依技能本身的射程判定（射程大於 5 即視為遠距離）。
// 預設值 14（怪物 + 寵物 + 生命體）
skillrange_by_distance: 14

// 大多數武器類技能是否應以目前裝備武器的射程覆蓋 skill_db 中定義的技能射程？（注意 3）
// 注意：此選項只影響 skill_db 中射程為負值的技能。預設一律使用技能本身的射程。
// 若要讓所有怪物技能的射程都為 9，請設定 monster_ai&0x400。
skillrange_from_weapon: 0

// 所有技能攻擊是否都應檢查施法者的狀態？
// 設為 yes 時，Meteor Storm、Storm Gust 等地面技能將會
// 無法戰鬥時（例如暈眩）都不會產生效果。
skill_caster_check: yes

// 施法者死亡時，是否立即移除已放置的地面技能？（注意 3）
clear_skills_on_death: 0

// 施法者切換地圖時，是否移除已放置的地面技能？（注意 3）
clear_skills_on_warp: 15

// 設為 YES 時，會將具有 0x01 旗標的地面技能目標模式覆蓋為「No Enemies」。
// 預設受影響的兩個技能為 Pneuma 與 Safety Wall（設為 yes 時，這兩個技能只保護友方，不再保護所有單位）。
// 詳細資訊請參閱 db/(pre-)re/skill_db.yml。
defunit_not_enemy: no

// 技能未命中或未被格擋時，是否至少造成 hits 設定的傷害？
// 許多技能會依命中次數倍增傷害（參閱 skill_db），這些技能每次命中至少會造成 1 HP
// 傷害，即使目標是植物型怪物也一樣。但有些技能實際上只命中一次，只是畫面上顯示為多段
// 攻擊。這些技能的傷害會除以命中次數並無條件捨去，因此植物型怪物可能不會受到
// 任何傷害。範例：Sonic Blow、Lord of Vermillion。
// 啟用此設定可變更官方行為，讓這些技能每次命中至少造成 1 HP 傷害。
// 數值：1 = 武器攻擊，2 = 魔法攻擊，4 = 其他攻擊。
skill_min_damage: 0

// 武僧連技延遲倍率。（注意 2）
combo_delay_rate: 100

// 是否使用替代的自動反擊技能類型？（注意 3）
// 對啟用此設定的角色，攻擊必定造成 100% 暴擊；
// 否則會忽略 DEF，並套用 HIT +20、CRI *2。
auto_counter_type: 15

// 地面技能是否可以重疊放置？（注意 3）
// 預設情況下，具有 UF_NOREITERATION 旗標的技能無法重疊施放於
// 重疊；此設定可覆蓋此限制。
skill_reiteration: 0

// 地面技能是否禁止放置在玩家／怪物下方或附近？（注意 3）
// 啟用後，只有設定 UF_NOFOOTSET 的技能會受到影響。
skill_nofootset: 1

// 在 GvG／PVP 地圖中，陷阱（獵人陷阱 + 泥沼地）是否應將目標類型改為「all」？（注意 3）
// 官方伺服器預設值：1（玩家）。
gvg_traps_target_all: 1

// 陷阱顯示設定（具有 UF_HIDDEN_TRAP 旗標的陷阱）：
// 0 = 永遠可見
// 1 = 在對戰地圖（GVG／PVP／競技場）中隱形
// 2 = 在所有地圖中隱形
// 官方伺服器預設：Pre-Renewal 為 0，Renewal 為 2。
//traps_setting: 0

// 化學家的 Summon Flora 技能限制（可依需求組合）：
// 1：允許玩家在對戰地圖以外的區域攻擊植物。
// 2：禁止同時存在不同種類的植物
//    （例如已有指定怪物時，禁止召喚九尾狐以外的怪物。）
//     的植物）。
summon_flora_setting: 3

// 已放置的地面技能是否檢查牆壁？（注意 1）
//（例如 Storm Gust 對著牆壁施放時，不會擊中牆壁另一側的單位。）
skill_wall_check: yes

// 隱匿時是否檢查牆壁？（注意 1）
// 注意：技能不檢查牆壁時，系統會將角色視為
//  效果等同於角色旁邊有牆壁（移動速度一律依牆壁限制計算）。
//  可依需求組合設定；受到攻擊時仍會解除隱匿。
// 
// 0 = 不檢查牆壁
// 1 = 檢查牆壁
// 2 = 攻擊時不會解除隱匿
// 4 = 使用技能時不會解除隱匿
player_cloak_check_type: 1
monster_cloak_check_type: 4

// 是否限制同時放置的地面技能數量？（注意 3）
land_skill_limit: 9

// 決定要傳送哪些類型的技能失敗訊息：
// 1 - 停用所有技能失敗訊息。
// 2 - 停用因 can-act 動作延遲造成的技能失敗訊息。
// 4 - 停用 Snatcher 的失敗訊息
// 8 - 停用 Envenom 的失敗訊息
display_skill_fail: 2

// 玩家在遊戲內聊天室中時，是否可以被傳送門傳送？（注意 1）
chat_warpportal: no

// 巫師的「Sense」技能應如何顯示防禦數值？
// 0：不顯示防禦力
// 1：基本防禦 [RE 預設]
// 2：VIT／INT 防禦
// 3：兩者皆計算（將兩種數值相加）。
sense_type: 1

// 使用哪一種指彈攻擊方式？
// 0 = Aegis 方式（單次多段攻擊）
// 1 = Athena 方式（多次連續攻擊）
finger_offensive_type: 0

// Grand Cross 設定（請勿隨意修改）
// 官方行為中，Grand Cross 會有四波傷害；但每個格子在
// 已經受到至少 3 次命中後，就不會再受到下一波傷害。
// 移動中的怪物最多會受到 4 次命中；但重疊在一起的怪物
// 可能只會受到 1～3 次命中。
// 若希望所有波次都能對所有目標造成傷害，請設為 yes。
// 提示：若要減少傷害波數，必須縮短
// 技能持續時間（例如設為 800 毫秒可產生三波傷害）。
gx_allhit: no

// Grand Cross 顯示類型（預設值 1）
// 0：黃色字元
// 1：白色字元
gx_disptype: 1

// Devotion 可作用的最高等級差距。
devotion_level_difference: 10

// Devotion 遇到反射傷害時是否使用「舊版」行為？（注意 2）
// 預設值為 0（官方行為）。若 devotion_rdamage 大於 0（將反射傷害轉移給保護者的機率），
// 受到 Devotion 保護的玩家攻擊具有反射傷害能力（道具加成或技能）的玩家時，
// 反射傷害會由提供 Devotion 的玩家承受，而不是由攻擊者承受。
devotion_rdamage: 0

// 官方行為中，反射之盾（SC_REFLECTDAMAGE）會反射技能或普通攻擊造成的物理傷害。
// 但若目標受到 Devotion 保護，就只會反射近距離技能造成的傷害。（注意 1）
devotion_rdamage_skill_only: yes

// AEGIS 存在一個錯誤：受到 Devotion 保護的玩家坐下並遭受攻擊時，
// 用戶端會顯示玩家站起來，但伺服器端仍認定玩家坐著。
// 因此玩家會無法移動，直到再次坐下／站起，或使用 @refresh。
// 詳細資訊請參閱 https://github.com/rathena/rathena/issues/1927。
// 預設值：yes（這是建議採用的錯誤修正）。
// 官方設定：no
devotion_standup_fix: yes

// 設為 no 時，可以單獨使用合奏技能。（注意 1）
player_skill_partner_check: yes

// 陷阱移除類型
// 0 = Aegis 系統：返還 1 個「Trap」物品
// 1 = Athena 系統：返還設置陷阱所使用的所有物品
skill_removetrap_type: 0

// 使用弓施展 Backstab 時，是否套用 50% 傷害懲罰？（注意 1）
backstab_bow_penalty: yes

// 每隻怪物最多可以嘗試偷竊幾次？
// 注意：此設定可避免玩家對稀有物品數量很少的怪物反覆偷竊。
// 設為 0 可停用（允許的最大值為 255）。
skill_steal_max_tries: 0

// 偷竊取得的物品是否套用隨機附加屬性？（注意 1）
// 官方設定：no
skill_steal_random_options: no

// 「MVP heal」的等級與效果強度。當有人施放此等級
// 或更高等級的治療技能時，會略過治療公式並直接使用此數值。
max_heal: 9999
max_heal_lv: 11

// 公會技能 Emergency Recall 設定（可依需求組合）。
// 注意：若要讓技能能夠使用，
// 1／2 與 4／8 兩組中都必須至少啟用一個選項。
// 1：WoE 以外可使用技能。
// 2：WoE 期間可使用技能。
// 4：GvG 地圖以外可使用技能
// 8：GvG 地圖中可使用技能
// 16：在設定 nowarpto 的地圖中停用技能
//    （即使 GVG 城堡設定 nowarpto，此技能仍可在其中使用。）
emergency_call: 11

// 公會光環技能設定（可依需求組合）。
//（影響 GD_LEADERSHIP、GD_GLORYWOUNDS、GD_SOULCOLD 及 GD_HAWKEYES。）
// 注意：若要讓技能能夠使用，
// 1／2 與 4／8 兩組中都必須至少啟用一個選項。
// 1：WoE 以外技能生效。
// 2：WoE 期間技能生效。
// 4：GvG 地圖以外技能生效
// 8：GvG 地圖中技能生效
// 16：技能不會影響公會會長
guild_aura: 31

// 怪物技能可使用的最高等級。
// 注意：若 MVP 太難對付，可將此值降低至 10。
mob_max_skilllvl: 100

// 允許玩家施放 Teleport 1 級時略過選單。
// 選單包含兩個選項：「Random」與「Cancel」。
skip_teleport_lv1_menu: no

// 是否允許在不符合日／月／星條件時使用 SG 技能？
allow_skill_without_day: no

// 是否允許對玩家使用 ES 類型魔法？
allow_es_magic_player: no

// 太陽、月亮與星星的奇蹟技能倍率。
// 有效值範圍為 1（每次命中 0.005%）至 20000（每次命中 100%）。
// AGI 高於 46 時，此機率會進一步降低（92 = 機率減半）。
sg_miracle_skill_ratio: 1

// 太陽、月亮與星星的奇蹟技能持續時間（毫秒）。
sg_miracle_skill_duration: 3600000

// 太陽、月亮與星星的天使技能倍率（100% = 10000）。
sg_angel_skill_ratio: 10

// 會受到 bHealPower 影響的技能
// 1：Heal、2：Sanctuary、4：Potion Pitcher、8：Slim Pitcher、16：Apple of Idun，
// 32：Coluceo Heal、64：Highness Heal、128：Mediale Votum、256：Dilectio Heal
skill_add_heal_rate: 487

// 畫面上只有一個目標時，EarthQuake 造成的傷害是否可以被反射？
// 注意：官方伺服器中，畫面上只有一個目標時，EarthQuake（EQ）可以被反射，
//    這可能被用來利用漏洞狩獵 MVP。
eq_single_target_reflectable: yes

// 官方伺服器中，即使處於無敵狀態，仍會受到反射傷害及部分塔羅牌傷害。
// 啟用此設定後，玩家可免疫所有類型的傷害，包括上述傷害。
//（畫面仍會顯示數字，但不會實際扣除傷害。）
invincible.nodamage: no

// 舞蹈期間武器切換
// 官方伺服器已修正此問題，禁止透過切換武器來取消歌曲效果。
// 預設值：yes
dancing_weaponswitch_fix: yes

// 技能陷阱類型
// 官方伺服器中，完全免疫擊退的單位仍會移動到最後的目標格，
// 然後才因停止類狀態（包含 Ankle Snare、Spiderweb 等陷阱）而停下。路徑上的
// 所有陷阱都會被觸發。
// 此設定不包含裝備提供的擊退免疫；此加成只對擊退技能有效。
// 0：（官方行為）
// 1：GvG／WoE 中的停止效果會使單位立即停下。
// 2：停止效果使怪物免疫擊退／Boss 立即停下。
// 3：1 + 2
skill_trap_type: 0

// Bowling Bash 連鎖反應範圍（僅適用於 Pre-Renewal）。
// 0：使用官方的溝線系統
// 1：使用不含 demi gutter 錯誤的溝線系統
// 2～20：施法者周圍範圍（2 = 5x5、3 = 7x7、4 = 9x9……20 = 41x41）
// 注意：若將目標擊退至範圍外，目標只會受到一次命中，不會受到範圍傷害。
bowling_bash_area: 0

// 擊退行為。（注意 1）
// 官方伺服器中，單位碰到牆壁時一定會停止移動。
// 設為 no 時，單位斜向接近牆壁時仍會繼續移動（舊版 Athena 行為）。
path_blown_halt: yes

// 跆拳道任務的怪物名稱檢查
// iRO Wiki 說明：若任務目標是 Goblin，任何名稱為「Goblin」的怪物都會計入任務進度。
// 0：停用（預設值）
// 1：五種 Goblin 怪物都會計入，不論 Mob ID（Mob ID：1122～1126）- iRO 預設
// 2：任何名稱完全相同的怪物都會計入，不論 Mob ID；依據 jName 比對
taekwon_mission_mobname: 0

// 玩家是否可以瞬間移動到地圖傳送點上方？（注意 1）
// 官方伺服器不允許此行為。
teleport_on_portal: no

// Cart Revolution 的擊退方向是否固定為西方？（注意 1）
// 官方伺服器一律將目標往西方擊退；停用時則會將目標往後擊退。
cart_revo_knockback: yes

// 官方伺服器中，Arrow Shower 的擊退方向會依技能放置位置到目標的方向計算，而不是施法者到目標的方向。
arrow_shower_knockback: yes

// 官方伺服器中，Storm Gust 由 81 個單位組成，每個單位都會造成 3x3「由中心向外」的範圍傷害。由於
// 西南方格子會先被處理，因此通常會將目標往東北方擊退。邊緣位置的擊退方向
// 會遠離 Storm Gust。Ganbantein 與 Land Protector 也會影響擊退方向。若
// 在 Storm Gust 中打出缺口，就可能產生「吸入」效果。
// 停用此設定時，擊退方向將完全隨機（eAthena 行為）。
stormgust_knockback: yes

// RENEWAL_CAST 專用。（注意 2）
// 預設情況下，Fixed Casting Time 為 -1 的技能會將詠唱時間的 20%
// 作為固定詠唱時間，其餘 80% 則作為變動詠唱時間。
// 設為 0 可停用預設固定詠唱時間（效果與 skill_db.yml 中設為 0 相同）。
default_fixed_castrate: 20

// 官方伺服器中，會攻擊路徑上所有目標的技能（例如 Focused Arrow Strike、First Wind）會先
// 計算八個方向之一，再依該方向套用範圍攻擊。因此某些區域可能
// 無法被這些技能命中。若指定該區域中的怪物為目標，就只有該怪物會受到攻擊。
// 三轉技能 Flame Launcher 與 Cannon Spear 可能會完全落空。
// 設為 no 時，改以施法者到目標之間計算路徑，並命中路徑附近的所有目標。
// 可在 skill_db 中調整 splash 與 maxcount，以控制這些技能的寬度與長度。
// 注意：由於 Brandish Spear 具有特殊傷害行為，因此一律使用此演算法。
skill_eightpath_algorithm: yes

// 使用 skill_eightpath_algorithm 的技能是否應包含施法者所在格的目標？
// 官方設定：yes
skill_eightpath_same_cell: yes

// 是否可以傷害冰牆、陷阱等技能單位？（注意 3）
// 官方伺服器中，玩家可以使用技能傷害冰牆及部分陷阱。怪物使用技能時，
// 冰牆與陷阱會顯示傷害數字，但耐久度實際上不會減少。
// 官方設定相當容易將 MVP 困住；若要讓所有單位都能
// 傷害技能單位，請設為 31（舊版行為）。
can_damage_skill: 1

// Land Protector 行為。（注意 1）
// 官方伺服器中，站在 Land Protector 邊界（外圍格）的玩家仍可能受到
// 範圍技能影響／命中（例如 Storm Gust）。Athena 行為則會忽略站在
// 邊界格的玩家，不讓範圍技能影響或命中。
// 官方設定：0
// 舊版 Athena：1
land_protector_behavior: 0

// NPC EMOTION 行為。（注意 1）
// 官方伺服器中，部分怪物會施放 NPC EMOTION 技能，顯示表情符號並將模式從
// 主動攻擊暫時改為被動。Athena 行為則不會將其模式切換為被動。
// 官方設定：0
// 舊版 Athena：1
npc_emotion_behavior: 0

// Tarot Card of Fate 每張牌是否應具有相同出現機率？（注意 1）
// 官方機率：15%：LOVERS | 10%：FOOL、MAGICIAN、HIGH PRIESTESS、STRENGTH、SUN | 8%：TEMPERANCE
// 7%：戰車 | 6%：倒吊人 | 5%：死神、星星 | 2%：高塔 | 1%：命運之輪、惡魔
// 設為 yes 時，每張牌的出現機率都會變成 1/14。
tarotcard_equal_chance: no

// 目標不在歌曲範圍內時，Dispel 是否仍能解除歌曲效果？（注意 1）
// 官方伺服器無法解除歌曲效果。
// 提示：此設定也會影響叛亂者技能「Vanishing Buster」。
dispel_song: no

// 基因學者 Make Bomb 技能的 Banana Bomb 坐下持續時間。
// 官方持續時間為 1000 毫秒 * 投擲者 Job Level / 4。
// 0：使用官方持續時間
// X：輸入自訂持續時間（毫秒）。
banana_bomb_duration: 0

// 背包沒有空間時，嘗試製作的物品是否應直接掉落地面？（注意 1）
// 官方設定：no
// 舊版 rAthena 行為：yes
skill_drop_items_full: no

// EDP 設定：（注意 3）
// 切換／卸下右手武器時，是否移除 EDP？赤手空拳時無法使用 EDP。
// 0：停用（舊版 rAthena 與 Pre-Renewal 行為）。
// 1：在 Pre-Renewal 啟用。
// 2：在 Renewal 啟用。
// 3：1 + 2
switch_remove_edp: 2

// 對其他隊伍成員施放 Meister's Attack Machine 時允許的最高等級差距。
// 預設值：15
attack_machine_level_difference: 15
