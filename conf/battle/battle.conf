//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 哪些單位應具有 baseatk 數值（使 STR 影響傷害）？（注意 3）
enable_baseatk: 0x9
enable_baseatk_renewal: 0x29F

// 哪些單位可以擁有完全迴避？（注意 3）
enable_perfect_flee: 1

// 哪些單位可以發動暴擊？（注意 3）
// 注意：部分技能不受此設定影響，永遠會造成暴擊。
enable_critical: 17

// 非玩家單位的暴擊調整倍率。（注意 2）
mob_critical_rate: 100
critical_rate: 100

// 普通攻擊是否應產生移動延遲？（注意 3）
// 若設定為 no，角色一開始攻擊便可移動（攻擊動畫
// 或移動動畫可能會在用戶端被省略，造成攻擊動畫截斷，或
// 怪物看起來像是瞬間傳送到玩家身邊）。
// 否則延遲時間會等於攻擊動畫時間（amotion）。
attack_walk_delay: 15

// 受到攻擊後的移動延遲調整。（注意 2）
// 受擊後無法移動的延遲，會依受傷動畫持續時間的百分比計算。
// 注意：只影響單次攻擊產生的一般延遲，不影響下方 multihit_delay 選項額外增加的延遲。
pc_damage_walk_delay_rate: 20
damage_walk_delay_rate: 100

// 多段攻擊的移動延遲調整。
// 當角色受到 Lord of Vermillion 或 Jupitel Thunder 等多段攻擊技能命中時，
// 將額外無法移動「（命中次數 - 1）* multihit_delay」毫秒。
// 設為 80 時，效果接近 Aegis（例如 Sonic Blow）。
// 設為 230 時，移動延遲會持續到最後一段命中（例如 Jupitel Thunder）。
multihit_delay: 80

// 玩家受擊延遲倍率。（注意 2）
// 設為 no／0 時，效果等同於永久處於霸體狀態。
player_damage_delay_rate: 100

// 判定不死屬性時，應使用種族或屬性？
// 0 = 依屬性判定不死
// 1 = 依種族判定不死
// 2 = 兩者皆採用（符合其中一項即可）
undead_detect_type: 0

// 受到與自身相同屬性的攻擊時，是否恢復 HP？（注意 1）
attribute_recover: no

// 普通攻擊的最低與最高命中率是多少？
min_hitrate: 5
max_hitrate: 100

// 當攻擊玩家的怪物數量超過 agi_penalty_count 時，FLEE 要套用哪種懲罰？
// 0 = 不套用懲罰
// 1 = 依百分比從 FLEE 扣除 agi_penalty_num
// 2 = 從 FLEE 直接扣除 agi_penalty_num 的固定數值
agi_penalty_type: 1

// 啟用 AGI 懲罰時，應套用於哪些單位？（注意 3）
// 預設只有玩家會受到此懲罰。
agi_penalty_target: 1

// 攻擊玩家的敵人數量達到多少時，才開始懲罰 FLEE。
agi_penalty_count: 3

// 每多一隻超過 agi_penalty_count 的攻擊怪物，FLEE 要扣除的數值。
agi_penalty_num: 10

// 當攻擊玩家的怪物數量超過 vit_penalty_count 時，裝備 DEF 與 VIT DEF 要套用哪種懲罰？
// 0 = 不套用懲罰
// 1 = 依百分比從 DEF 扣除 vit_penalty_num
// 2 = 從 DEF 直接扣除 vit_penalty_num 的固定數值
vit_penalty_type: 1

// 啟用 VIT 懲罰時，應套用於哪些單位？（注意 3）
// 預設只有玩家會受到此懲罰。
vit_penalty_target: 1

// 攻擊玩家的敵人數量達到多少時，才開始懲罰防禦力。
vit_penalty_count: 3

// 每多一隻超過 vit_penalty_count 的攻擊怪物，VIT 防禦要扣除的數值。
vit_penalty_num: 5

// 物理攻擊是否使用替代的 DEF 計算方式？
// 設為 0 時停用（使用一般 DEF 百分比減傷，再進一步套用 def2 減傷）。
// 設為 1 或更大時，防禦力會扣除（DEF * 此設定值）。
// 例如：10 + 50 DEF 會變成 0 +（10 * 類型 + 50）。
weapon_defense_type: 0

// MDEF 的計算方式相同（MDEF * 設定值）。
magic_defense_type: 0

// 每次攻擊時，是否讓攻擊者轉向面對目標？（注意 3）
// 注意：在官方伺服器中，Firewall 等部分技能的擊退方向，永遠依據
// 玩家最後一次移動的方向。即使攻擊方向完全不同，
// 擊退方向仍不會改變。例如，若先向北移動，再攻擊南方的敵人，
// 仍會被 Firewall 向南擊退。無法移動的怪物
// 預設面向北方，因此永遠會被向南擊退。
attack_direction_change: 0

// 對啟用此設定的單位，其天生攻擊屬性會視為「無屬性」
//（對所有防禦屬性皆造成 100% 傷害）。（注意 3）
// 注意：此設定可讓非玩家單位使用普通攻擊時，
// 對 Ghost 屬性目標造成完整傷害（例如 Ghostring）。
attack_attr_none: 14

// 裝備損壞機率（尚未經任何技能調整前的基礎機率）。
// 1 = 0.01% 機率。官方伺服器預設值：0。
equip_natural_break_rate: 0

// 自身裝備整體損壞倍率。（注意 2）
// 此倍率會影響 Power-Thrust 等技能的破壞機率，以及角色自然破壞機率
//（由 equip_natural_break_rate 設定）。若此值大於 0，且賢者的屬性附加技能失敗，
// 被選取角色的武器就可能損壞。
equip_self_break_rate: 100

// 使目標裝備損壞的整體倍率。（注意 2）
// 此倍率會影響 Acid Terror、Meltdown 等技能的效果。
equip_skill_break_rate: 100

// 傷害套用前是否應加入延遲？（注意 1）
// 部分技能預設不會有延遲，且不受此設定影響。
// 官方設定為 yes，但會稍微降低效能。
delay_battle_damage: yes

// 用戶端與伺服器的傷害時間是否應同步？（注意 1）
// 這不是官方行為，但應可消除受到怪物攻擊後的位置延遲。
// 此設定只影響怪物普通攻擊，且優先於「delay_battle_damage」。
// 許多技能會立即顯示傷害，因此同時將「delay_battle_damage」設為 no，
// 可能會進一步改善體驗，但並非所有技能都適用。
// 不想再遇到 Dark Illusion 延遲 5 秒才命中的情況？請啟用此設定。
synchronize_damage: no

// 使用弓／槍時，是否消耗箭矢／彈藥？
// 0 = 否
// 1 = 是
// 2 = 即使技能未明確指定消耗箭矢，也啟用此行為；若該技能
//     以武器為基礎且使用遠距離武器時，系統會自動判斷是否需要箭矢。
//     透過卡片或技能複製取得的技能是否應消耗彈藥）。
arrow_decrement: 1

// 卸下武器時，是否一併卸下彈藥？
// 官方行為為 yes。
ammo_unequip: yes

// 裝備彈藥時，是否自動裝備相容的武器？
// 官方行為為 yes。
ammo_check_weapon: yes

// 道具腳本加成「Autospell」施放前，是否檢查距離與障礙物？
// 官方行為為 no；若設為 yes，技能會使用其定義的
// 射程。例如 Sonic Blow 必須與目標相距 2 格，才允許自動施放。
// 此設定也會影響 autospellwhenhit。
autospell_check_range: no

// 若攻擊者與目標位於同一格，是否將目標向左擊退？
// 官方行為為 yes；若設為 no，目標會被擊退到攻擊者身後。
knockback_left: yes

// 玩家是否能同時使用獵鷹與狼？（注意 1）
// 官方伺服器不允許此行為。
warg_can_falcon: no

// 目標是否能透過瞬間移動到畫面邊緣來閃避傷害？
// 官方行為為 no。
snap_dodge: no

// 是否允許玩家技能／道具破壞非玩家單位的裝備？（注意 1）
// 此功能實際上會對非玩家目標套用卸除裝備效果。
// 注意：停用時，WS_MELTDOWN 不受此檢查限制。
// 官方設定：no
break_mob_equip: no

// OnPCIdentifyEvent 鑑定事件的觸發模式：
// 0: Pandas 1.2.4 標準，成功或失敗的鑑定結果都會觸發
// 1: rAthena 標準，僅鑑定成功時觸發
// 取消鑑定、無效道具或 OnPCIdentifyFilter 使用 processhalt 中斷時不觸發。
// 預設值：0
identify_event_mode: 0
