//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
//--------------------------------------------------------------

// 物品掉落時，是否直接放入玩家背包？（注意 1）
item_auto_get: no

// 物品掉落在地面後，多久會消失？（毫秒）
flooritem_lifetime: 60000

// 保留時間內，是否只有對怪物造成最高傷害的玩家能拾取物品？（毫秒）
item_first_get_time: 3000

// 保留時間內，是否只有對怪物造成傷害最高的第一、第二名玩家能拾取物品？（毫秒）
//（在 item_first_get_time 結束後生效。）
item_second_get_time: 1000

// 保留時間內，是否只有對怪物造成傷害最高的前三名玩家能拾取物品？（毫秒）
//（在 item_second_get_time 結束後生效。）
item_third_get_time: 1000

// MVP 無法取得獎勵物品、導致物品掉落地面時，獎勵物品的保留時間。（毫秒）
mvp_item_first_get_time: 10000

// MVP 傷害排名第一、第二名玩家可拾取物品的保留時間。（毫秒）
//（在 mvp_item_first_get_time 結束後生效。）
mvp_item_second_get_time: 10000

// MVP 傷害排名前三名玩家可拾取物品的保留時間。（毫秒）
//（在 mvp_item_second_get_time 結束後生效。）
mvp_item_third_get_time: 2000

// 物品掉落倍率。（注意 2）

// 一般物品的掉落倍率（ETC 分頁中的物品，卡片除外）。
item_rate_common: 100
item_rate_common_boss: 100
item_rate_common_mvp: 100
item_drop_common_min: 1
item_drop_common_max: 10000

// 治療物品的掉落倍率（可恢復 HP 或 SP 的物品）。
item_rate_heal: 100
item_rate_heal_boss: 100
item_rate_heal_mvp: 100
item_drop_heal_min: 1
item_drop_heal_max: 10000

// 可使用物品的掉落倍率（物品分頁中除治療物品以外的項目）。
item_rate_use: 100
item_rate_use_boss: 100
item_rate_use_mvp: 100
item_drop_use_min: 1
item_drop_use_max: 10000

// 裝備掉落倍率。
item_rate_equip: 100
item_rate_equip_boss: 100
item_rate_equip_mvp: 100
item_drop_equip_min: 1
item_drop_equip_max: 10000

// 卡片掉落倍率。
item_rate_card: 100
item_rate_card_boss: 100
item_rate_card_mvp: 100
item_drop_card_min: 1
item_drop_card_max: 10000

// MVP 直接取得並放入背包的 MVP 物品掉落倍率調整。
// 模式：0 - 官方順序；1 - 隨機順序；2 - 所有物品。
item_rate_mvp: 100
item_drop_mvp_min: 1
item_drop_mvp_max: 10000
item_drop_mvp_mode: 0

// 裝備附帶物品掉落的倍率調整。
item_rate_adddrop: 100
item_drop_add_min: 1
item_drop_add_max: 10000

// 裝備附帶物品群組中，各項物品掉落倍率的調整。
// 此設定適用於 Ore Discovery，以及 Gaia Sword、Jewel Sword、Blazzer Card、Tengu Card、Dokkaebi Horn 等物品。
item_group_rate: 100
item_group_drop_min: 1
item_group_drop_max: 10000

// 寶箱掉落倍率調整（此設定會覆蓋其他所有倍率修正）。
item_rate_treasure: 100
item_drop_treasure_min: 1
item_drop_treasure_max: 10000

// 是否使用對數掉落計算？（注意 1）
// 對數掉落倍率會使用下列公式，以非線性方式調整物品掉落率：
// Droprate(x,y) = x * (5 - log(x)) ^ (ln(y) / ln(5))
// 其中 x 是原始掉落率，y 是掉落率倍率（前述 item_rate* 設定值）。
// 使用對數掉落時，可參考下表了解倍率對實際掉落率的影響：
// Y：原始掉落率
// X：掉落率倍率設定（例如 item_rate_equip）
//  X\Y | 0.01 0.02  0.05  0.10  0.20  0.50  1.00  2.00  5.00 10.00 20.00
// -----+---------------------------------------------------------------
//   50 | 0.01 0.01  0.03  0.06  0.11  0.30  0.62  1.30  3.49  7.42 15.92
//  100 | 0.01 0.02  0.05  0.10  0.20  0.50  1.00  2.00  5.00 10.00 20.00
//  200 | 0.02 0.04  0.09  0.18  0.35  0.84  1.61  3.07  7.16 13.48 25.13
//  500 | 0.05 0.09  0.22  0.40  0.74  1.65  3.00  5.40 11.51 20.00 33.98
// 1000 | 0.10 0.18  0.40  0.73  1.30  2.76  4.82  8.28 16.47 26.96 42.69
// 2000 | 0.20 0.36  0.76  1.32  2.28  4.62  7.73 12.70 23.58 36.33 53.64
// 5000 | 0.50 0.86  1.73  2.91  4.81  9.11 14.45 22.34 37.90 53.91 72.53
//10000 | 1.00 1.67  3.25  5.28  8.44 15.24 23.19 34.26 54.57 72.67 91.13
//20000 | 2.00 3.26  6.09  9.59 14.83 25.49 37.21 52.55 77.70 97.95  100%
//50000 | 5.00 7.87 13.98 21.12 31.23 50.31 69.56 92.48  100%  100%  100%
item_logarithmic_drops: no

// 怪物掉落率是否允許變成 0？（注意 1）
// 預設值：no（與官方伺服器相同）。
drop_rate0item: no

// 是否將物品掉落率額外提高 0.01%？（注意 1）
// 官方伺服器可能出現 0.00% 的掉落機率，因此所有物品都會額外增加 0.01%。
// 注意：rAthena 將此行為視為錯誤。
// 預設值：no
drop_rateincrease: no

// 讓角色的 LUK 以固定數值方式影響掉落率。
// 設為 100 時，每 1 點 LUK 會增加 0.01% 的物品掉落機率
//（不受物品原始掉落率影響）。
drops_by_luk: 0

// 讓角色的 LUK 以相對比例方式影響掉落率。
// 設為 100 時，每 1 點 LUK 會增加 1% 的掉落機率
//（因此 LUK 為 100 時，所有物品的掉落機率都會加倍）。
drops_by_luk2: 0

// 化學家召喚的海葵球與植物是否會掉落物品？
// 此設定有三種可用值：
// 0：不會掉落任何物品。
// 1：只有海葵球會掉落物品。
// 2：所有化學家召喚物都會掉落物品。
alchemist_summon_reward: 1

// 是否廣播類似「** 玩家1 獲得波利幼蟲卡片（機率 0.01%）***」的稀有掉落訊息？
// 可設定為 0～10000 之間的任意數值。
// 注意：使用 STEAL 技能取得稀有物品時，也會發出公告。
// 0 = 完全不顯示公告
// 1 = 公告掉落率為 0.01% 的物品
// 333 = 公告掉落率為 3.33% 或更低的物品
// 10000 = 公告所有物品
rare_drop_announce: 0

// 自動拾取是否計入玩家的加成與懲罰？（注意 1）
// 若啟用了 RENEWAL_DROP、口香糖或其他倍率修正，自動拾取
// 也會將這些修正計算在內。
autoloot_adjust: 0

// 怪物只由傭兵擊殺時，自動拾取是否仍會生效？
mercenary_autoloot: no

// 傭兵主人處於閒置狀態時，是否禁止取得傭兵撿取的物品？
// 可設為 no，或指定需要經過多少秒（不是毫秒）後，才將
// 角色判定為閒置。
// 正在聊天或擺設露天商店的角色，一律視為閒置。
// 角色使用物品、使用技能、攻擊（包含自動攻擊）或移動時，閒置狀態會重設。
// 只有啟用 mercenary_autoloot 時，傭兵主人才能取得物品，
// 否則物品會像平常一樣掉落在地面。
// 注意：此選項使用獨立的特殊計時器追蹤閒置時間，不與一般閒置計時器共用。
mer_idle_no_share: no

// 伺服器應如何計算傭兵主人的閒置時間？（注意 3）
//（只有啟用 mer_idle_no_share 時，此功能才會生效。）
// 0x001 - 移動請求
// 0x002 - UseSkillToID 請求（嘗試對指定目標使用技能）
// 0x004 - UseSkillToPos 請求（嘗試在指定位置使用範圍技能）
// 0x008 - 使用物品請求（包含裝備／卸下裝備）
// 0x010 - 攻擊請求
// 0x020 - 聊天請求（密語、隊伍、公會、戰場等）
// 0x040 - 坐下／起立請求
// 0x080 - 表情動作請求
// 0x100 - 丟棄物品請求
// 0x200 - @／# 指令請求
// 請注意：至少必須啟用一個選項。
// 請留意：啟用的選項越多，越容易有人利用此功能進行作弊。
// 預設：walk (0x1) + useskilltoid (0x2) + useskilltopos (0x4) + useitem (0x8) + attack (0x10) = 0x1F
// 注意：此設定可為傭兵設定獨立規則，與一般閒置計時器及 idletime_option 分開。
// 此設定只適用於傭兵單獨擊殺的情況，不會影響一般自動拾取及隊伍分配設定。
idletime_mer_option: 0x1F

// 若原始掉落率低於此數值，套用加成後的掉落率也不會超過此上限。
drop_rate_cap: 9000
drop_rate_cap_vip: 9000

// 怪物掉落含有隨機屬性的物品時，是否顯示彩色光柱效果。
rndopt_drop_pillar: on
