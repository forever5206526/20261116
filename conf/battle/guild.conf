//--------------------------------------------------------------
// rAthena Battle Configuration File
// Originally Translated by Peter Kieser <pfak@telus.net>
// Made in to plainer English by Ancyker
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
//--------------------------------------------------------------

// 建立公會時是否消耗一個 Emperium？（注意 1）
guild_emperium_check: yes

// 公會成員的最高稅率上限。
guild_exp_limit: 50

// 單一公會可擁有的城堡數量上限（0 = 不限）。
guild_max_castles: 0

// 重新登入後，公會技能的延遲是否仍需生效？
// 0 - 儲存冷卻時間，重新登入後接續計時。
// 1 - 不儲存冷卻時間，重新登入後重新計時。
// 官方伺服器預設：Pre-Renewal 為 1，Renewal 為 0。
//guild_skill_relog_type: 0

// 公會技能套用的延遲時間（毫秒）。
// 官方設定為 5 分鐘（300000 毫秒）。
// 注意：Renewal 模式改為使用各技能獨立的冷卻時間。
guild_skill_relog_delay: 300000

// WoE（公會對公會）戰鬥中的近距離普通攻擊傷害調整（非技能）。（注意 2）
gvg_short_attack_damage_rate: 80

// WoE（公會對公會）戰鬥中的遠距離普通攻擊傷害調整（非技能）。（注意 2）
gvg_long_attack_damage_rate: 80

// WoE（公會對公會）戰鬥中的物理武器技能傷害調整。（注意 2）
gvg_weapon_attack_damage_rate: 60

// WoE（公會對公會）戰鬥中的魔法技能傷害調整。（注意 2）
gvg_magic_attack_damage_rate: 60

// WoE（公會對公會）戰鬥中的其他類型技能傷害調整。（注意 2）
gvg_misc_attack_damage_rate: 60

// GvG 地圖中的迴避懲罰。官方數值為 20。（注意 2）
// 注意：此值為百分比而非固定數值；20 代表總迴避降低 20%。
gvg_flee_penalty: 20

// 是否可在公會視窗中學習「Glory of Guild」技能，
// 且變更公會徽章時是否需要此技能？（注意 1）
// 附註：官方伺服器尚未實作此技能。
require_glory_guild: no

// 公會同盟數量上限。可設定 0～3。
// 若要變更此值，請先清空公會同盟資料表。
// 預設值：3
max_guild_alliance: 3

// 何時重新顯示公會公告
// 傳送時（無論是否切換地圖）：2（官方設定）
// 切換地圖時：1
// 不重新顯示：0（停用）
guild_notice_changemap: 2

// maprespawnguildid 是否也應清除複製體？
// 預設值：no
guild_maprespawn_clones: no

// 公會兩次更換會長之間必須等待多久（分鐘）？
// 預設值：1440（1 天）
// 設為 0 分鐘可停用延遲。
guild_leaderchange_delay: 1440

// WoE 期間是否允許更換公會會長？
// 預設值：no
guild_leaderchange_woe: no

// 是否只有公會會長可以接受同盟邀請？
// 預設值：no
guild_alliance_onlygm: no
