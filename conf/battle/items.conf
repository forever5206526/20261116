//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 使用商人露天商店技能時，物品可出售的最高價格（Zeny）。
vending_max_value: 1000000000

// 當玩家持有的 Zeny 加上商店內所有物品的總價超過允許的 Zeny 上限時，
// 是否仍允許將物品放入露天商店？（注意 1）
// 設為 yes 時，物品仍會上架，但其他玩家無法購買。
// 官方行為為 yes，但部分官方伺服器的用戶端不允許此操作。
vending_over_max: yes

// 所有露天商店交易套用的稅率（例如：10000 = 100%，50 = 0.50%）。
// 套用稅率時，買家仍須支付物品完整價格，
// 但賣家不會收到全部金額（實際收到 100% 減去稅率後的金額）。
vending_tax: 500

// 開始計算稅金所需的最低交易總額。
// 官方設定中，低於 1 億 Zeny 的交易不收取稅金。
// 設為 0 時，所有交易都會套用稅金。
vending_tax_min: 100000000

// 成功售出物品時，是否顯示買家的名稱？
buyer_name: yes

// 武器製作成功率。（注意 2）
weapon_produce_rate: 100

// 製作藥水成功率。（注意 2）
potion_produce_rate: 100

// 製作出的物品是否附帶製作者名稱？（注意 3）
// 0x01：製作出的武器
// 0x02：製作出的藥水
// 0x04：製作出的箭矢
// 0x08：製作出的聖水／Ancilla
// 0x10：製作出的致命藥水
// 0x80：其他製作物品。
produce_item_name_input: 0x03

// 使用枯樹枝召喚出的怪物是否具有主動攻擊性？（注意 1）
dead_branch_active: yes

// 召喚怪物（枯樹枝）時，是否檢查玩家的 Base Level？（注意 1）
// 官方設定為 no；枯樹枝／血跡樹枝召喚出的怪物可以是任何等級。
// 改為 yes 時，只會召喚等級小於或等於玩家 Base Level 的怪物。
random_monster_checklv: no

// 切換地圖時，會檢查未標記為「available」的物品，
// 並自動從背包／手推車／倉庫中刪除。
// 注意：若物品未從 item_db 載入，就會被視為不可用。
// 0x1：背包
// 0x2：手推車
// 0x4：倉庫
item_check: 0x0

// 兩次使用物品之間必須間隔多久？
// 僅影響物品使用間隔，可防止濫用恢復道具。建議約 500 毫秒。
// 官方設定為 0；此處設為 100 毫秒可用來防止機器人／巨集。
item_use_interval: 100

// 兩次使用商城食物之間的間隔。預設：60000（1 分鐘）。
cashfood_use_interval: 60000

// 需要達到多少 bNoMagicDamage，才會阻擋狀態變更（黃金盜蟲卡片）。
// 例如設定為 50 時，物品可提供 bNoMagicDamage,40；
// 使魔法傷害降低 40%，但不會阻擋狀態變更。
gtb_sc_immunity: 50

// 是否允許自動念咒卡片效果疊加？
// 注意：不同卡片即使賦予相同技能，效果也會各自獨立生效。
autospell_stacking: no

// 是否允許消耗 item_noequip.txt 中禁止裝備的可使用物品？（注意 1）
// no = 不可使用／消耗
// yes = 可以消耗，但不會產生效果
allow_consume_restricted_item: no

// 是否允許裝備 item_noequip.txt 中禁止裝備的物品？（注意 1）
// no = 不可裝備，進入地圖時會自動卸下
// yes = 可以裝備，但不會產生效果
// 若裝備插有受限制的卡片，仍會略過此檢查，但不會產生效果。
allow_equip_restricted_item: yes

// 與 NPC 互動時是否允許更換裝備？（注意 1）
// 官方伺服器預設：Pre-Renewal 為 yes，Renewal 為 no。
//item_enabled_npc: yes

// 是否允許 map_addflooritem 檢查物品能否掉落？（注意 1）
// 設為 yes 時，玩家背包已滿且物品不可掉落時，物品會被銷毀，而不會出現在地圖上。
// 預設值：yes
item_flooritem_check: yes

// 裝備具有 BindOnEquip 標記的物品時，預設使用哪種綁定類型（參閱 db/[pre-]re/item_db.yml）。
// 0 - 不綁定
// 1 - 帳號綁定
// 2 - 公會綁定
// 3 - 隊伍綁定
// 4 - 角色綁定
default_bind_on_equip: 4

// 是否允許將綁定／限制販售的物品賣給道具商店以兌換貨幣？（注意 3）
// 0x0 = 綁定／限制販售的物品不可賣給道具商店／一般商店
// 0x1 = 綁定物品可賣給道具商店
// 0x2 = 限制販售的物品可賣給道具商店
// 0x4 = 綁定物品可賣給一般商店，
//       因為大多數交易受限物品仍可賣給一般商店
// 0x8 = 只有公會會長能將 BOUND_GUILD 物品賣給一般商店或道具商店（需同時啟用 0x1 或 0x4）
allow_bound_sell: 0x0

// 玩家取得帶有特殊公告標記的物品，或精鍊到會觸發公告的等級時，
// 是否以星號（*）隱藏玩家名稱最後 n 個字元？
// 注意：若此設定值過高，名稱較短的玩家可能會
// 整個名稱都被星號取代。
broadcast_hide_name: 2

// 是否允許將租用物品賣給 NPC 商店？（注意 1）
rental_transaction: yes

// 無論 item_db 中的物品價格為何，租用物品是否一律以 0 Zeny 賣給 NPC 商店？（注意 1）
rental_item_novalue: no

// 一般商店物品的最低購買價格。
// 官方設定中，物品不能以低於 1 Zeny 的價格購買。
min_shop_buy: 1

// 一般商店物品的最低出售價格。
// 官方設定中，物品可以 0 Zeny 出售。
min_shop_sell: 0

// 減少屬性／種族傷害的物品，是否應將所有怪物傷害都視為物理傷害？（注意 1）
// 官方設定中，「Asprika」（神器）會減少所有怪物造成的傷害，而不僅限於物理傷害。
// 另一方面，Shaman Hat 完全不會減少怪物傷害（但會減少 PVP 中的魔法傷害）。
// 此設定只影響具有 bonus3 bSubEle 與 bonus3 bSubRace 的物品。
cardfix_monster_physical: yes
