//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// MVP 怪物的 HP 倍率。（注意 2）
mvp_hp_rate: 100

// 一般怪物（非 MVP）的 HP 倍率。（注意 2）
monster_hp_rate: 100

// 怪物的最高攻擊速度。
monster_max_aspd: 199

// 設定各種怪物 AI 行為。（注意 3）
// 0x0001：啟用後，怪物每經過數次 AI 迴圈就會更新目標格，
//        （一般情況下，怪物追擊時在抵達目標格前不會更新目標格，
//         會持續追蹤原目標格）。
// 0x0002：怪物受到攻擊且無法反擊時，會使用「rude attack」技能（通常是瞬間移動離開），
//         不論遭受何種攻擊都會觸發；
//         否則只有在無法以近距離攻擊目標時（例如 GrimTooth），
//         才會觸發「rude attack」（例如遭到遠距離狙擊）。
// 0x0004：未啟用時，可切換目標的怪物只有在一定距離內受到攻擊才會切換目標，
//         距離必須為［攻擊射程 + 1］，否則怪物可能會更換目標並追逐其他單位。
//         遠距離攻擊者。此旗標也會覆蓋 provoke 指定的目標。
// 0x0008：啟用後，怪物失去目標時會立即散開。此模式可
//         大幅提高透過隱匿並將怪物聚集在同一位置來拖怪的難度，
//         例如 GrimTooth 拖怪。
// 0x0010：啟用後，定義給友方單位的怪物技能也會對自己觸發。
// 0x0020：啟用後，該地圖內所有魔物都會執行 AI，
//         而不只執行玩家附近怪物的 AI，不受玩家距離限制。
// 0x0040：啟用後，怪物的目標切換地圖時，怪物會朝視線範圍內的
//         NPC 傳送點移動（請搭配下方 mob_warp 使用）。
// 0x0080：未啟用時，處於攻擊狀態的怪物只有受到普通攻擊時才會切換目標；
//         若要讓怪物受到技能攻擊時也切換目標，請啟用此設定。
// 
// 0x0100：啟用後，怪物會從技能清單中隨機選擇一項技能作為起始項目，
//         而非依序檢查技能。未啟用時，若怪物擁有太多技能，
//         清單末端的技能就很少會被選中。
// 0x0200：啟用後，怪物技能的再次使用延遲不會套用到相同技能的所有項目，
//         而只套用到實際使用的那個項目（例如怪物在 mob_skill_db 中
//         有六筆 Heal 設定，只有實際使用的那筆會受到延遲限制）。
//         這會讓怪物變得更難對付，尤其是 MVP。
// 0x0400：啟用後，魔物所有技能的射程皆為 9 格；否則
//         會遵守一般技能射程規則。
// 0x0800：啟用後，受到挑釁的怪物一定會將目標切換為
//         挑釁者，即使一般情況下受到攻擊也不會切換目標。
// 0x1000：啟用後，怪物選定技能卻因射程內沒有有效目標而無法使用時，
//         會繼續尋找其他可用技能。
//         例如，Greatest General 可在距離 8～9 格時使用「Earth Spike」，
//         而官方行為是只有在距離 0～7 格時先使用「Blind Attack」後，
//         才會使用該技能。
// 範例：0x140 -> 追擊玩家穿越傳送點，並以隨機順序使用技能。
monster_ai: 0

// 怪物應多久重新判斷一次追擊路徑？
// 0：每 100 毫秒（MIN_MOBTHINKTIME）
// 1：每移動一格
// x：每移動 x 格，或抵達追擊路徑終點時
// 30（最大值）：只在追擊路徑結束時（官方行為）
// 無論此設定為何，怪物都會持續檢查攻擊
// 範圍內的目標。若要讓怪物追擊時反應更靈敏，請降低此值。
// 此值也會定義怪物失去目標後，最多還會移動幾格
//（例如目標隱匿或失去視線等情況）。
monster_chase_refresh: 30

// 是否允許怪物使用傳送點移動？（可組合設定）
// 0：停用。
// 1：允許怪物站在 NPC 傳送點上時進行傳送
// 2：允許怪物站在祭司的傳送門上時進行傳送
// 4：目標地圖為 nobranch 地圖時，禁止傳送
// 8：允許怪物站在次元之門上時進行傳送
mob_warp: 0

// 設定所有玩家離開怪物附近後，怪物 AI 還會持續運作的時間（毫秒）。
// 
mob_active_time: 5000
boss_active_time: 5000

// 怪物與寵物的視野範圍調整（mob_db 中的 range2 欄位）。（注意 2）
view_range_rate: 100

// Chase Range 是怪物放棄追擊前的基本追擊範圍，
// 前提是目標仍在怪物視野範圍之外。此值對應 mob_db 中的 range3
// 欄位。（注意 2）
chase_range_rate: 100

// 怪物應學會幾級的 Vulture's Eye 與 Snake's Eye？
// 官方設定中怪物不會學習這些技能，因此其遠距離技能
// 射程只有 9。若設為大於 0 的數值，射程就會
// 增加相同數值。
monster_eye_range_bonus: 0

// 是否允許怪物具有主動攻擊性並先行攻擊？（注意 1）
monster_active_enable: yes

// 是否使用 mob_db 中的名稱覆蓋出生點檔案指定的怪物名稱？
// 0：否
// 1：一律使用 mob_db 的 Name 欄位（英文怪物名稱）
// 2：一律使用 mob_db 的 JName 欄位（kRO 原始怪物名稱）
override_mob_names: 0

// 怪物受擊延遲倍率。（注意 1）
// 設為 no／0 時，效果等同怪物永久處於霸體狀態。
monster_damage_delay_rate: 100

// 怪物拾取物品時的行為。
// 0 = 怪物會消耗該物品。
// 1 = 怪物不會消耗該物品。
monster_loot_type: 0

// 怪物應如何搜尋地面物品並拾取？
// 0：最近的物品（舊版 Athena 行為）
// 1：範圍內最早掉落的物品（官方行為）
monster_loot_search_type: 1

// 怪物施放技能的機率。（注意 2）
// 倍率越高，怪物越可能 100% 使用技能，而不進行或只進行少量普通攻擊。
// 設為 0 可停用怪物技能。
mob_skill_rate: 100

// 怪物技能延遲調整。（注意 2）
// 怪物施放技能後，必須等待一段時間才能
// 再次施放。請注意，延遲為 0 的技能不受此
// 設定影響。
mob_skill_delay: 100

// 地圖上的怪物數量倍率；200 代表數量為正常的兩倍。（注意 2）
mob_count_rate: 100

// 地圖上的怪物重生倍率；50 代表怪物重生速度加倍（等待時間減半）。（注意 2）
// 注意：此設定不影響立即重生的怪物（大多數一般怪物）。
mob_spawn_delay: 100
plant_spawn_delay: 100
boss_spawn_delay: 100

// 怪物重生時間是否加入隨機變動值？（注意 3）
// 官方伺服器中，透過 boss_monster 指令生成的怪物（多為 MVP）會有隨機變動；舊版 Athena 則對所有怪物套用此變動。
// 0：不套用
// 1：僅 Boss 怪物（官方行為）
// 2：一般怪物
// 3：所有怪物（舊版 Athena 行為）
mob_spawn_variance: 1

// 怪物是否應避免在玩家視野範圍內生成？
// 設為 0 代表停用；其他數值代表放棄前允許重試的次數。
// 重試失敗後仍會在玩家視野內生成怪物；但若設為最大值（100），
// 怪物就不會生成，並會在
// 5 秒後再次嘗試。
// 注意：此設定不影響固定在同一格生成的怪物，
// 例如螞蟻卵；除非將數值設為最大值。
no_spawn_on_player: 0

// 是否忽略怪物出生點檔案中的生成座標？（注意 1）
// 設為 yes 時，所有怪物都會在整張
// 地圖中隨機選擇重生位置，不受怪物出生點檔案設定影響。
force_random_spawn: no

// 是否隨機決定每隻怪物的中心格？（注意 1）
// 官方行為：伺服器啟動時，會在出生區域中為每隻怪物隨機指定中心格。
// 怪物每次重生時，會以該中心格周圍的區域作為生成範圍，而不是
// 使用出生點定義中的原始中心。這會擴大整體生成範圍，並使
// 每次伺服器啟動後的怪物分布都不同。
// 若要讓同一個出生點的所有怪物都以原始中心附近生成，請設為 no，
// 這會縮小整體生成範圍（舊版 eAthena 行為）。
randomize_center_cell: yes

// 召喚出的從屬怪物是否繼承主人的被動／主動攻擊特性？
// 0：否，保留原本模式。
// 1：從屬怪物一律為主動攻擊。
// 2：從屬怪物一律為被動。
// 3：與主人目前的主動／被動狀態相同。
// 4：以從屬怪物自身的模式覆蓋（官方行為）。
slaves_inherit_mode: 4

// 召喚出的從屬怪物是否與主人具有相同移動速度？
// 注意：官方伺服器預設值為 3。
// 0：永不。
// 1：主人可以移動時
// 2：主人無法移動時（即使不會移動的怪物在
//    mob_db 中仍有移動速度設定）
// 3：一律套用
slaves_inherit_speed: 3

// 召喚怪物（化學家召喚物或透過 @summon 召喚的怪物）攻擊時，
// 是否有機率觸發主人的自動念咒卡片效果？（注意 1）
summons_trigger_autospells: yes

// 怪物受到另一隻怪物攻擊時，是否改為反擊該怪物的主人，而非攻擊怪物本身？
// 注意：召喚怪物包含透過 @summon 取得的怪物及化學家召喚的怪物。
retaliate_to_master: yes

// 技能觸發怪物反擊技能時，怪物是否應暫時切換目標？（注意 1）
// 例如：怪物正在攻擊玩家 B，而玩家 A 施放技能 C。若設為 yes，且
// 怪物具有會被技能 C 觸發的技能，則 A 會成為
// 該技能的目標；否則反擊技能仍會以 B 為目標。
mob_changetarget_byskill: no

// 怪物類型變更時，是否完全恢復 HP？（注意 1）
monster_class_change_full_recover: yes

// 是否在怪物名稱旁顯示部分資訊？（可組合設定）
//（不適用於守護者或 Emperium。）
// 1：顯示怪物 HP（目前 HP／最大 HP 格式）
// 2：顯示怪物 HP（生命值百分比格式）
// 4：顯示怪物等級
show_mob_info: 0

// 怪物掉落的 Zeny
zeny_from_mobs: no

// 怪物升級系統（每擊殺一名玩家，怪物就會升級並變得更強）。
// 經驗值倍率計算方式：((怪物等級 - 原始怪物等級) * (經驗值 * mobs_level_up_exp 設定倍率 / 100))。
// 注意：不適用於 WoE 守護者。
mobs_level_up: no
mobs_level_up_exp_rate: 1

// 動態怪物選項
// 是否使用動態怪物？（建議小型至中型伺服器使用）
dynamic_mobs: yes

// 即使怪物已受傷，是否仍將其移除？
mob_remove_damaged: yes

// 空地圖移除怪物前的延遲時間（預設 5 分鐘 = 300 秒）。
mob_remove_delay: 300000

// 定義怪物被擊殺時，mob npc_event 要對哪位玩家執行。
// 類型 1：對擊殺怪物的玩家執行（若由非玩家擊殺，則改用類型 0）。
// 類型 0：對怪物造成最高傷害的玩家執行。
// 注意：此設定會影響 Emperium（城堡水晶）被摧毀時，哪位玩家取得城堡。
mob_npc_event_type: 1

// 啟用防止搶怪保護的時間（毫秒）。
// 設為 0 可停用。
// 啟用此功能且玩家使用 @noks 時，非隊伍成員造成的搶怪傷害（KS）
// 將會降低為 0。
ksprotection: 0

// MVP 從屬怪物被召回主人身邊時，是否保留原本目標？
mob_slave_keep_target: yes

// 是否生成 MVP 墓碑。
// 參閱 http://irowiki.org/wiki/MVP#Gravestone
mvp_tomb_enabled: yes

// MVP 墓碑生成前的延遲時間。
// 預設值：9 秒。
mvp_tomb_delay: 9000

// 特殊召喚怪物的體型是否會影響經驗值、掉落率
// 及能力值。大型怪物的倍率會加倍，小型怪物則減半。
// 只有透過 monster 指令、@monsterbig 或 @monstersmall 召喚時才會生效。（注意 1）
// 預設值：no
mob_size_influence: no

// 怪物被直接施放在其身上的冰牆困住時，應如何處理？
// 官方伺服器中，怪物只能往西方或南方離開冰牆。若目標位於怪物北方或東方，
// 怪物會持續嘗試追擊但無法成功，進而陷入循環，不斷使用
// 閒置及追擊技能。Boss 怪物則會像被困住一樣無法移動，並會使用
// 閒置技能及受到攻擊時的 rudeattacked 技能。
// 0：怪物完全不會被冰牆困住。
// 1：怪物會依被困住的方式行動。
// 2～255：怪物依上述行為循環多少次後，才會自行脫離冰牆。
// 注意：部分伺服器中，一般怪物會依移動速度在 15～35 秒後自行脫困；但在其他
// 伺服器中，怪物可能會一直被困在冰牆內，直到冰牆消失。此外，許多官方伺服器（例如 iRO）
// 會在有 Boss 怪物的所有地圖完全禁止施放冰牆。
// 預設（最不容易被濫用）：一般怪物 - 75，Boss - 0
// 預設（最接近官方）：一般怪物 - 220，Boss - 1
mob_icewall_walk_block: 75
boss_icewall_walk_block: 0

// 是否顯示怪物 HP 條？
// 需要 2012-04-04aRagexeRE 或更新版本的用戶端。
monster_hp_bars_info: yes

// 怪物長時間無法移動時，是否讓怪物重生並在地圖伺服器輸出警告？
// 這可能是正常遊戲行為（例如玩家將 MVP 困在冰牆內）；但若要避免任何
// 利用此行為的情況並收到通知，可將此設定設為 yes。
monster_stuck_warning: no

// 附近沒有玩家時，怪物使用閒置技能的倍率。（注意 2）
// 官方伺服器中，怪物只要曾被玩家看見，即使附近已沒有玩家，仍會使用閒置技能。
// 在小型至中型伺服器中，這可能導致所有怪物（例如怪物蛋、Fabre／Pupa）都發生變態。
// 設為 0 可停用。
mob_nopc_idleskill_rate: 100
boss_nopc_idleskill_rate: 100

// 附近沒有玩家時，怪物移動的倍率。（注意 2）
// 官方伺服器中，怪物只要曾被玩家看見，即使附近已沒有玩家，仍會繼續移動。
// 設為 0 可停用。
mob_nopc_move_rate: 100
boss_nopc_move_rate: 100

// 擊殺怪物時，範圍內同隊伍的所有成員是否都會觸發 AG_BATTLE 類型成就？
// 作用範圍由 battle 設定中的 area_size 決定。
achievement_mob_share: no

// 從屬怪物追擊時距離主人太遠，是否應傳送回主人身邊？（注意 1）
// 預設（官方）：no
slave_stick_with_master: no

// 怪物重生的絕對最短時間（毫秒）。
// 也用於公會資料尚未載入時，延遲守護者生成。
// 預設（官方）：1000
mob_respawn_time: 1000

// 設定怪物受困時，經過多久（毫秒）才會解除目標鎖定。
// 在此期間，怪物仍會處於閒置模式，並對隨機
// 目標使用閒置技能；脫困後會繼續追擊原本的目標。
mob_unlock_time: 2000

// 啟用 MVP 傳送距離功能。
// 啟用後，MVP 太靠近固定 NPC 傳送點時，會被傳送到隨機位置。
// 此功能只適用於地圖上的 NPC 傳送點，不適用於祭司技能建立的玩家傳送門。
// 預設值：yes（可用值：yes/no）。
mvp_warp_distance_enable: yes

// MVP 靠近固定 NPC 傳送點時，觸發隨機傳送的距離（格）。
// MVP 進入 NPC 傳送點的此距離範圍內時，會被傳送至同一張地圖中的
// 隨機位置。
// 只有在 mvp_warp_distance_enable 設為 yes 時才會生效。
// 預設值：5
mvp_warp_distance: 5
