//--------------------------------------------------------------
// rAthena 戰鬥設定檔
// 原始翻譯：Peter Kieser <pfak@telus.net>
// 英文內容由 Ancyker 改寫為較易閱讀的版本。
//--------------------------------------------------------------
// 注意 1：此值為設定開關（on/off、yes/no 或 1/0）。
// 注意 2：此值以百分比表示（100 代表 100%）。
// 注意 3：此值為位元欄位。若未提供其他說明，
//         請依單位類型解讀（1：玩家、2：怪物、4：寵物、8：生命體、16：傭兵、128：NPC、512：元素）。
//--------------------------------------------------------------

// 生命體設定（注意 3）
// 啟用多種特殊行為，使生命體的行為與一般角色不同。
// 0x01：無法成為輔助技能的目標（其主人除外）
// 0x04：怪物會優先攻擊生命體而非玩家，直到生命體受到攻擊
// 0x08：生成／切換地圖時複製主人的移動速度
// 0x10：在狀態視窗中顯示 luk/3+1，而非實際暴擊值；
//       預設情況下生命體不會造成暴擊。
// 0x20：生命體的最小 MATK 永遠等於最大 MATK
hom_setting: 0x3D

// 生命體技能的冷卻時間或施法後延遲，是否應在
// 生命體被安息時重設？
// 官方伺服器預設：Pre-Renewal 為 yes，Renewal 為 no。
//hom_delay_reset_vaporize: no

// 生命體技能的冷卻時間或施法後延遲，是否應在
// 傳送或切換地圖時重設？
// 官方伺服器預設：Pre-Renewal 為 yes，Renewal 為 no。
//hom_delay_reset_warp: no

// 餵食後生命體親密度增加的倍率。（注意 2）
homunculus_friendly_rate: 100

// 是否允許重複使用相同名稱命名生命體？（注意 1）
hom_rename: no

// 生命體進化所需的最低親密度。
homunculus_evo_intimacy_need: 91100

// 進化後親密度重設為：
homunculus_evo_intimacy_reset: 1000

// 進化型巴尼米樂的 Bio Explosion 技能所需親密度。
hvan_explosion_intimate: 45000

// 生命體升級時，是否向主人顯示能力值成長資訊？
homunculus_show_growth: yes

// 怪物只由生命體擊殺時，自動拾取是否仍會生效？
homunculus_autoloot: no

// 主人死亡時，生命體是否應自動安息？（注意 2）
// 若生命體 HP 低於 80%，則不會自動安息。
homunculus_auto_vapor: 80

// 一般生命體的最高等級。
homunculus_max_level: 99

// 進化型生命體 S 的最高等級。
homunculus_S_max_level: 250

// 生命體 S 開始套用成長表的等級。
// 達到此等級後，生命體 S 才會套用其成長表。
// 若未設定此值，隨機調整會導致生命體 S 的所有等級都使用
// 成長表，造成能力值失衡。
homunculus_S_growth_level: 99

// Send auto-feed notice even if OFF (Note 1) 
// 官方設定：yes
homunculus_autofeed_always: yes

// 生命體主人處於閒置狀態時，是否禁止取得生命體的經驗值／物品？
// 可設為 no，或指定需要經過多少秒（不是毫秒）後，才將
// 角色判定為閒置。
// 正在聊天或擺設露天商店的角色，一律視為閒置。
// 角色使用物品、使用技能、攻擊（包含自動攻擊）或移動時，閒置狀態會重設。
// 只有啟用 homunculus_autoloot 時，生命體主人才能取得物品，
// 否則物品會像平常一樣掉落在地面。
// 注意：此選項使用獨立的特殊計時器追蹤閒置時間，不與一般閒置計時器共用。
hom_idle_no_share: no

// 伺服器應如何計算生命體主人的閒置時間？（僅用於生命體經驗值分享與自動拾取）（注意 3）
//（只有啟用 hom_idle_no_share 時，此功能才會生效。）
// 0x001 - 移動請求
// 0x002 - UseSkillToID 請求（嘗試對指定目標使用技能）
// 0x004 - UseSkillToPos 請求（嘗試在指定位置使用範圍技能）
// 0x008 - 使用物品請求（包含裝備／卸下裝備）
// 0x010 - 攻擊請求
// 0x020 - 聊天請求（密語、隊伍、公會、戰場等）
// 0x040 - 坐下／起立請求
// 0x080 - 表情動作請求
// 0x100 - 丟棄物品請求
// 0x200 - @／# 指令請求
// 請注意：至少必須啟用一個選項。
// 請留意：啟用的選項越多，越容易有人利用此功能進行作弊。
// 預設：walk (0x1) + useskilltoid (0x2) + useskilltopos (0x4) + useitem (0x8) + attack (0x10) = 0x1F
// 注意：此設定可為生命體設定獨立規則，與一般閒置計時器及 idletime_option 分開。
// 此設定只適用於生命體單獨擊殺的情況，不會影響一般自動拾取及隊伍分配設定。
idletime_hom_option: 0x1F

// 生命體透過擊殺取得經驗值的倍率。（注意 2）
// 僅適用於 Renewal 模式。
// 官方設定：10%。
homunculus_exp_gain: 10

// 生命體飢餓值小於或等於此數值時，飢餓延遲會變更。（注意 2）
// 延遲時間請參閱 homunculus_starving_delay。
// 設為 0 可停用。
// 官方設定：10
homunculus_starving_rate: 10

// 生命體一般每 60 秒降低一次飢餓值；當達到 homunculus_starving_rate 時，飢餓延遲會降至 20 秒（毫秒）。
// 官方設定：20 秒
homunculus_starving_delay: 20000
