// Athena 登入伺服器設定檔。
// 翻譯者：Peter Kieser <pfak@telus.net>

// 注意：「註解」是指雙斜線「//」右側的所有文字。
// 被註解的文字不會由伺服器解析，僅供
// 資訊參考用途。

// 登入伺服器會在此 IP 位址所指定的網路介面上監聽。
// 注意：此設定可讓您在多個網路介面上執行多個伺服器，
// 並讓每個伺服器使用相同的連接埠。
//bind_ip: 127.0.0.1
 
// 登入伺服器連接埠
login_port: 6900

// 顯示在所有訊息前方的時間戳記格式。
// 最多可使用 20 個字元。
// 常用格式：
// %I:%M:%S %p（時:分:秒，12 小時制，含 AM／PM）
// %H:%M:%S（時:分:秒，24 小時制）
// %d/%b/%Y（日／月份英文縮寫／年）
// 完整格式說明請參閱 strftime() 手冊。
//timestamp_format: [%d/%b %H:%M]

// 若輸出重新導向時包含跳脫序列（色彩碼），請設定是否保留。
stdout_with_ansisequence: no

// 將指定類型的伺服器訊息記錄至 /log/ 資料夾中的檔案。
// 1：記錄警告訊息
// 2：記錄錯誤與 SQL 錯誤訊息。
// 4：記錄除錯訊息
// 範例：設定「console_msg_log: 7」會記錄上述三種類型的訊息。
// 此設定所記錄的訊息優先於 console_silent 設定。
console_msg_log: 0

// 用來儲存上述主控台訊息的檔案路徑。
console_log_filepath: ./log/login-msg_log.log

// 可隱藏指定類型的訊息，讓伺服器輸出更精簡：
// 1：隱藏資訊訊息
// 2：隱藏狀態訊息
// 4：隱藏通知訊息
// 8：隱藏警告訊息
// 16：隱藏錯誤與 SQL 錯誤訊息。
// 32：隱藏除錯訊息
// 範例：「console_silent: 7」會隱藏資訊、狀態及通知訊息（1+2+4）。
console_silent: 0

// 主控台指令
// 設定是否允許使用主控台指令。
// 關閉後可避免使用 >& log.file 進行輸出重新導向。
console: off

// 是否允許使用 _M／_F 註冊新帳號？
// 注意：只有在用戶端未啟用密碼加密時，此功能才會生效。
new_account: no

// 啟用 new_account 時，可設定帳號名稱的最小長度。
// 預設為「4」或「6」（取決於登入介面版本）。
// 除非用戶端已套用「Remove 4/6 letter User Name limit」差異修補，否則請勿變更。
//acc_name_min_length: 6

// 啟用 new_account 時，可設定密碼的最小長度。
// 預設為「4」或「6」（取決於登入介面版本）。
// 除非用戶端已套用「Remove 4/6 letter Password limit」差異修補，否則請勿變更。
//password_min_length: 6

// 帳號註冊頻率限制系統
// allowed_regs 是 time_allowed（秒）時間內允許的註冊次數。
allowed_regs: 1
time_allowed: 10

// Log Filename. All operations received by the server are logged in this file. 
login_log_filename: log/login.log

// 是否記錄登入伺服器的操作？
// 注意：登入伺服器必須啟用登入記錄，才能使用動態密碼錯誤封鎖功能。
log_login: yes

// 指定記錄檔及玩家畫面中日期的顯示格式。
date_format: %d-%m-%Y %H:%M:%S

// 允許連線至伺服器所需的最低指定群組 ID。
// -1：停用
// 0 或更大：群組 ID
group_id_to_connect: -1

// 連線至伺服器所需的最低帳號群組 ID。
// 若已啟用 group_id_to_connect，此設定不會生效。
// -1：停用
// 0 或更大：群組 ID
min_group_id_to_connect: -1

// 哪一個群組（ID）會被視為 VIP 群組？
// 預設值：5
vip_group: 5

// 每個帳號最多允許建立多少個角色？
// 不可超過 mmo.hpp 中定義的 MAX_CHARS 上限，否則 chars_per_account
// 會自動使用 MAX_CHARS。
// 設為 0 時會使用 MIN_CHARS（預設值）。
chars_per_account: 0

// VIP 帳號可額外增加的角色欄位數（0 為停用）。
// 若要提高 vip_char_increase，請先提高 MAX_CHARS 的值。
// 注意：VIP 額外角色數量 = MAX_CHARS - chars_per_account。
// 注意 2：此設定必須放在 chars_per_account 之後。
// 設為 -1 時會使用 MAX_CHAR_VIP（src/config/core.hpp）。
vip_char_increase: -1

// 是否建立有使用期限的帳號？
// -1：新帳號使用期限不限（預設值）。
// 0 或更大：新帳號會在指定秒數後自動到期。
start_limited_time: -1

// 密碼是否以 MD5 雜湊儲存，而非明文？
// 注意：使用 <passwordencrypt> 的用戶端無法使用此功能。
use_MD5_passwords: no

// 登入視窗的線上人數顏色提示（需要 PACKETVER >= 20170726）。
// 是否完全停用顏色提示與說明文字？
usercount_disable: no
// 顯示為綠色的人數門檻。
usercount_low: 200
// 顯示為黃色的人數門檻。
usercount_medium: 500
// 顯示為紅色的人數門檻。
usercount_high: 1000

// IP 封鎖功能
ipban_enable: yes
// 密碼連續錯誤時動態封鎖 IP 的系統
// 密碼驗證失敗達指定次數後，是否封鎖使用者？
ipban_dynamic_pass_failure_ban: yes
// 計算密碼驗證失敗次數的時間區間（分鐘）。
ipban_dynamic_pass_failure_ban_interval: 5
// 觸發封鎖前允許的最大失敗次數。
ipban_dynamic_pass_failure_ban_limit: 7
// 封鎖持續時間（分鐘）。
ipban_dynamic_pass_failure_ban_duration: 5
// 清除已過期 IP 封鎖的間隔（秒）。0 = 停用；預設 = 60。
// 注意：即使停用此功能，登入伺服器啟動／停止時仍會清理已過期的 IP 封鎖。
// 若 IP 封鎖紀錄已超過到期時間，玩家仍可正常登入。
ipban_cleanup_interval: 60

// 執行 DNS／IP 更新的間隔（分鐘）；預設停用。
// 若伺服器使用會變動的動態 IP，請啟用此功能。
//ip_sync_interval: 10

// DNS 黑名單封鎖
// If enabled, each incoming connection will be tested against the blacklists 
// dnsbl_servers 中的項目以逗號分隔。
use_dnsbl: no
dnsbl_servers: bl.blocklist.de, socks.dnsbl.sorbs.net
// 以下是一些免費 DNS 黑名單服務的比較資料：http://en.wikipedia.org/wiki/Comparison_of_DNS_blacklists
//==============================================================================
//   dnsbl_servers                 說明
// - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
// bl.blocklist.de                 曾透過 SSH、FTP、IMAP 等方式攻擊其他伺服器／誘捕系統的 IP 位址。
// ircbl.ahbl.org                  AHBL（開放代理伺服器、遭入侵的主機、留言垃圾訊息發送者）。
// safe.dnsbl.sorbs.net            dnsbl.sorbs.net 中除「recent」及「escalations」以外的所有區域。
// sbl-xbl.spamhaus.org            Spamhaus 黑名單（垃圾訊息發送者、開放代理伺服器）。
// socks.dnsbl.sorbs.net           開放 SOCKS 代理伺服器。
// tor.ahbl.org                    目前的 Tor 中繼節點與出口節點。

// 用戶端 MD5 雜湊檢查
// 啟用後，登入伺服器會檢查用戶端雜湊是否符合
// 下方設定值；遭竄改的用戶端將無法連線。
// 注意：詳細資訊請參閱「doc/md5_hashcheck.txt」。
client_hash_check: off

// 啟用網頁驗證權杖系統
// 新版用戶端會透過額外的 HTTP API 取得資料，因此必須啟用此功能。
use_web_auth_token: yes

// 角色登出後，延遲停用網頁驗證權杖的時間（毫秒）。
// 用戶端登出時可能發生競爭條件：角色伺服器可能在用戶端
// 儲存變更後的設定前，就先撤銷權杖。
disable_webtoken_delay: 10000

// 用戶端 MD5 雜湊清單
// 符合指定雜湊的用戶端，可供群組 ID 大於或等於指定值的玩家
// 登入伺服器使用。
// 若雜湊指定為「disabled」，群組 ID 大於或
// 等於指定值的玩家將不受雜湊限制而可登入（即使
// 用戶端完全沒有傳送雜湊也可以）。
// 格式：group_id, hash
// 注意：詳細資訊請參閱「doc/md5_hashcheck.txt」。
//client_hash: 0, 113e195e6c051bb1cfb12a644bb084c5
//client_hash: 10, cb1ea78023d337c38e8ba5124e2338ae
//client_hash: 99, disabled

import: conf/inter_athena.conf
import: conf/import/login_conf.txt
