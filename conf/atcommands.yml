###########################################################################
# Atcommand Database
###########################################################################
#
# Atcommand Settings
#
###########################################################################
# - Command                  Command name.
#   Aliases:                 Aliases for the command. (Optional)
#     - <AliasName>
#   Help                     Help message for the command. (Optional)
###########################################################################

Header:
  Type: ATCOMMAND_DB
  Version: 1

Body:
  - Command: help
    Aliases:
      - h
    Help: |
      參數：<command>
      顯示指定指令的說明。
  - Command: noask
    Help: |
      自動拒絕交易與邀請。
  - Command: gmotd
    Help: |
      向所有玩家廣播每日訊息（MOTD）。
  - Command: me
    Help: |
      參數：<message>
      以「*名稱 訊息*」格式顯示一般文字（類似 mIRC 的 /me）。
  - Command: fakename
    Help: |
      參數：<name>
      暫時將您的名稱變更為指定名稱。
  - Command: npctalk
    Aliases:
      - npctalkc
    Help: |
      參數：<NPC name> <message>
      強制 NPC 在一般聊天頻道中顯示訊息。
  - Command: broadcast
    Help: |
      參數：<message>
      以您的名稱廣播訊息（黃色）。
  - Command: kami
    Help: |
      參數：<message>
      不顯示您的名稱，直接廣播訊息（黃色）。
  - Command: kamib
    Help: |
      參數：<message>
      不顯示您的名稱，直接廣播訊息（藍色）。
  - Command: localbroadcast
    Help: |
      參數：<message>
      只在您目前所在的地圖，以您的名稱廣播訊息（黃色）。
  - Command: commands
    Help: |
      顯示您可以使用的指令清單。
  - Command: rates
    Help: |
      顯示伺服器目前的倍率。
  - Command: uptime
    Help: |
      顯示伺服器已運作的時間。
  - Command: showdelay
    Help: |
      顯示／隱藏「此技能使用後有延遲」訊息。
  - Command: exp
    Help: |
      顯示目前等級及經驗值進度百分比。
  - Command: mobinfo
    Aliases:
      - monsterinfo
      - mi
    Help: |
      參數：<monster name|ID>
      顯示怪物資訊（能力值、經驗值、掉落物等）。
  - Command: iteminfo
    Aliases:
      - ii
    Help: |
      參數：<item name|ID>
      顯示物品資訊（類型、價格等）。
  - Command: whodrops
    Help: |
      參數：<item name|ID>
      顯示哪些怪物會掉落指定物品（依掉落率由高至低列出）。
  - Command: version
    Help: |
      顯示伺服器的 SVN 版本。
  - Command: email
    Help: |
      參數：<current email> <new email>
      變更您帳號的電子郵件地址。
  - Command: where
    Help: |
      參數：<char name>
      查詢指定角色所在的位置。
  - Command: time
    Aliases:
      - date
      - serverdate
      - servertime
    Help: |
      顯示伺服器的日期與時間。
  - Command: showexp
    Help: |
      顯示／隱藏取得的經驗值。
  - Command: showzeny
    Help: |
      顯示／隱藏取得的 Zeny。
  - Command: mobsearch
    Help: |
      參數：<monster name|ID>
      顯示指定怪物在目前地圖上的位置。
  - Command: who
    Aliases:
      - whois
    Help: |
      參數：[<name>]
      顯示線上玩家清單，以及其隊伍與公會資訊。
  - Command: who2
    Help: |
      參數：[<name>]
      顯示線上玩家清單，以及其職業資訊。
  - Command: who3
    Help: |
      參數：[<name>]
      顯示線上玩家清單，以及其所在位置。
  - Command: whomap
    Help: |
      @whomap/@whomap2/@whomap3 [map] - 類似 @who/@who2/@who3，但只列出指定地圖上的玩家。
  - Command: whogm
    Help: |
      參數：[match_text] - Like @who+@who2+who3, but only for GM.
  - Command: guildspy
    Help: |
      參數：<guild name|id> - You will receive all messages of the guild channel (Chat logging must be enabled)
  - Command: partyspy
    Help: |
      @partyspy <party name|id> - 接收隊伍頻道的所有訊息（必須啟用聊天記錄）。
  - Command: mapinfo
    Help: |
      參數：[<0-3> [map]] - Give information about a map (general info +: 0: no more, 1: players, 2: NPC, 3: chatrooms).
  - Command: go
    Help: |
      參數：<city name|number>
      將您傳送至指定城市。
      -3: (Memo point 2)  14: louyang         31: mora
      -2: (Memo point 1)  15: start point     32: dewata
      -1: (Memo point 0)  16: prison/jail     33: malangdo island
       0: prontera              17: jawaii             34: malaya port
       1: morocc                18: ayothaya       35: eclage
       2: geffen                  19: einbroch       36: lasagna
       3: payon                  20: lighthalzen
       4: alberta                 21: einbech
       5: izlude                   22: hugel
       6: aldebaran           23: rachel
       7: xmas (lutie)        24: veins
       8: comodo               25: moscovia
       9: yuno                     26: midgard camp
      10: amatsu               27: manuk
      11: gonryun              28: splendide
      12: umbala               29: brasilis
      13: niflheim              30: el dicastes
  - Command: jumpto
    Aliases:
      - goto
      - warpto
    Help: |
      參數：<char name>
      將您傳送至指定角色所在位置。
  - Command: follow
    Help: |
      參數：<char name>
      跟隨指定玩家。
  - Command: mount
    Aliases:
      - mountpeco
    Help: |
      給予／移除職業專屬坐騎（需要符合職業條件，但不需要學習技能）。
  - Command: mount2
    Help: |
      給予／移除商城坐騎。
  - Command: disguise
    Help: |
      參數：<monster name|ID>
      將您在其他玩家眼中的外觀變更為指定怪物。
  - Command: undisguise
    Help: |
      恢復您的正常外觀。
  - Command: disguiseguild
    Help: |
      將指定公會所有線上角色偽裝成怪物。
  - Command: undisguiseguild
    Help: |
      恢復指定公會所有角色的正常外觀。
  - Command: model
    Help: |
      參數：<hair ID: 0-17> <hair color: 0-8> <clothes color: 0-4> - Changes your characters appearence.
  - Command: size
    Help: |
      參數：<0-2> Changes your size (0-Normal 1-Small 2-Large)
  - Command: sizeall
    Help: |
      變更所有玩家的體型。
  - Command: sizeguild
    Help: |
      變更指定公會所有線上角色的體型。
  - Command: hide
    Help: |
      讓您的角色隱形（GM 隱形模式）。再次輸入即可恢復可見。
  - Command: save
    Help: |
      將重生位置設定為目前所在位置。
  - Command: load
    Aliases:
      - return
    Help: |
      將您傳送至儲存點。
  - Command: warp
    Aliases:
      - rura
      - mapmove
    Help: |
      參數：<mapname> [<x> <y>]
      將您傳送至指定地圖與座標。
  - Command: jump
    Help: |
      參數：[<x> [<y>]]
      如同使用蒼蠅翅膀般隨機傳送。
