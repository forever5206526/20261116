  - Command: skillid
    Help: |
      參數：<name>
      依技能名稱查詢技能。
  - Command: useskill
    Help: |
      參數：<skillid> <skillv> <target>
      對指定目標使用技能。
  - Command: skilltree
    Help: |
      參數：<skillnum> <charname>
      列出指定玩家要學會某技能所需的技能樹。
  - Command: marry
    Help: |
      參數：<player name>
      與另一名玩家結婚。
  - Command: divorce
    Help: |
      與玩家離婚。
  - Command: alive
    Help: |
      將自己從死亡狀態復活。
  - Command: blvl
    Aliases:
      - lvup
      - blevel
      - baselvl
      - baselvup
      - baselevel
      - baselvlup
    Help: |
      參數：<number of levels>
      依指定數量提高您的 Base Level。
  - Command: jlvl
    Aliases:
      - jlevel
      - joblvl
      - joblvup
      - joblevel
      - joblvlup
    Help: |
      參數：<number of levels>
      依指定數量提高您的 Job Level。
  - Command: allskill
    Aliases:
      - allskills
      - skillall
      - skillsall
    Help: |
      讓您學會所有技能。
  - Command: stpoint
    Help: |
      參數：<number of points> - Gives you the desired number of stat points.
  - Command: trpoint
    Help: |
      參數：<number of points> - Gives you the desired number of trait stat points.
  - Command: skpoint
    Help: |
      參數：<number of points> - Gives you the desired number of skill points.
  - Command: zeny
    Help: |
      參數：<amount> - Gives you desired amount of Zeny.
  - Command: cash
    Help: |
      參數：<amount> - Gives you the specified amount of cash points.
  - Command: points
    Help: |
      參數：<amount> - Gives you the specified amount of Kafra Points.
  - Command: str
    Help: |
      參數：<amount>
      依指定數值提高 STR。
  - Command: agi
    Help: |
      參數：<amount>
      依指定數值提高 AGI。
  - Command: dex
    Help: |
      參數：<amount>
      依指定數值提高 DEX。
  - Command: vit
    Help: |
      參數：<amount>
      依指定數值提高 VIT。
  - Command: int
    Help: |
      參數：<amount>
      依指定數值提高 INT。
  - Command: luk
    Help: |
      參數：<amount>
      依指定數值提高 LUK。
  - Command: pow
    Help: |
      參數：<amount>
      依指定數值提高 POW。
  - Command: sta
    Help: |
      參數：<amount>
      依指定數值提高 STA。
  - Command: wis
    Help: |
      參數：<amount>
      依指定數值提高 WIS。
  - Command: spl
    Help: |
      參數：<amount>
      依指定數值提高 SPL。
  - Command: con
    Help: |
      參數：<amount>
      依指定數值提高 CON。
  - Command: crt
    Help: |
      參數：<amount>
      依指定數值提高 CRT。
  - Command: allstats
    Aliases:
      - allstat
      - statall
      - statsall
    Help: |
      參數：<value>
      將所有能力值增加指定數值（未指定時提高至上限）。
  - Command: alltraits
    Aliases:
      - alltrait
      - traitall
      - traitsall
    Help: |
      參數：<value>
      將所有特性能力值增加指定數值（未指定時提高至上限）。
  - Command: addwarp
    Help: |
      參數：<map name> <x coord> <y coord> <NPC name>
  - Command: killmonster2
    Help: |
      擊殺您所在地圖的所有怪物（不會掉落物品）。
  - Command: monster
    Aliases:
      - spawn
    Help: |
      參數：<monster name|ID> [<number to spawn> [<desired_monster_name> [<x coord> [<y coord>]]]]
      @monster2 <desired_monster_name> <monster name|ID> [<number to spawn> [<x coord> [<y coord>]]]
      @spawn/@monster/@summon/@monster2 "desired monster name" <monster name|ID> [<number to spawn> [<x coord> [<y coord>]]]
      @spawn/@monster/@summon/@monster2 <monster name|ID> "desired monster name" [<number to spawn> [<x coord> [<y coord>]]]
      生成指定怪物，並可自訂怪物名稱。
  - Command: monstersmall
    Help: |
      參數：<monster name|ID>
      生成指定怪物的小型版本。
  - Command: monsterbig
    Help: |
      參數：<monster name|ID>
      生成指定怪物的大型版本。
  - Command: killmonster
    Help: |
      參數：<map>
      擊殺指定地圖上的所有怪物（會掉落物品）。
  - Command: autoloot
    Help: |
      參數：<on|off|#>
      讓物品直接進入您的背包。
  - Command: autotrade
    Aliases:
      - at
    Help: |
      允許您離線時繼續擺設露天商店。
  - Command: changegm
    Help: |
      參數：<charname>
      變更公會會長（您必須是公會會長）。
  - Command: changeleader
    Help: |
      參數：<charname>
      變更隊伍隊長（您必須是隊伍隊長）。
  - Command: request
    Help: |
      參數：<message>
      透過 GM 密語系統向所有已連線的 GM 傳送訊息。
  - Command: sound
    Help: |
      參數：<path to file in data folder or GRF file>
      播放用戶端 data 資料夾或 GRF 檔案中的音效。
  - Command: clone
    Help: |
