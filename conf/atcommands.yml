      服事 = 156：神聖之光
      盜賊 = 149：擲沙、150：後退迴避、151：拾取石頭、152：投擲石頭
      商人 = 153：手推車攻擊、154：更換手推車、155：大聲吶喊、2535：開設收購商店
      魔法師 = 157：能量外套
      獵人 = 1009：幻象箭
      吟遊詩人 = 1010：驚聲尖叫
      舞孃 = 1011：魅惑之眼
      騎士 = 1001：衝鋒攻擊
      十字軍 = 1002：縮小
      祭司 = 1014：聖靈降臨祈禱
      武僧 = 1015：氣功轉移、1016：氣功爆炸
      刺客 = 1003：音速投擲加速、1004：投擲毒匕首
      流氓 = 1005：緊密拘束
      鐵匠 = 1012：不公平交易、1013：貪婪
      煉金術士 = 238：生命基礎
      巫師 = 1006：火焰之眼
      賢者 = 1007：製作屬性轉換器、1008：屬性變化（水）、1017：屬性變化（地）、1018：屬性變化（火）、1019：屬性變化（風）
  - Command: skillid
    Help: |
      參數：<name>
      依技能名稱查詢技能。
  - Command: useskill
    Help: |
      參數：<skillid> <skillv> <target>
      對指定目標使用技能。
  - Command: skilltree
    Help: |
      參數：<skillnum> <charname>
      列出指定玩家要學會某技能所需的技能樹。
  - Command: marry
    Help: |
      參數：<player name>
      與另一名玩家結婚。
  - Command: divorce
    Help: |
      與玩家離婚。
  - Command: alive
    Help: |
      將自己從死亡狀態復活。
  - Command: blvl
    Aliases:
      - lvup
      - blevel
      - baselvl
      - baselvup
      - baselevel
      - baselvlup
    Help: |
      參數：<number of levels>
      依指定數量提高您的 Base Level。
  - Command: jlvl
    Aliases:
      - jlevel
      - joblvl
      - joblvup
      - joblevel
      - joblvlup
    Help: |
      參數：<number of levels>
      依指定數量提高您的 Job Level。
  - Command: allskill
    Aliases:
      - allskills
      - skillall
      - skillsall
    Help: |
      讓您學會所有技能。
  - Command: stpoint
    Help: |
      參數：<number of points> - Gives you the desired number of stat points.
  - Command: trpoint
    Help: |
      參數：<number of points> - Gives you the desired number of trait stat points.
  - Command: skpoint
    Help: |
      參數：<number of points> - Gives you the desired number of skill points.
  - Command: zeny
    Help: |
      參數：<amount> - Gives you desired amount of Zeny.
  - Command: cash
    Help: |
      參數：<amount> - Gives you the specified amount of cash points.
  - Command: points
    Help: |
      參數：<amount> - Gives you the specified amount of Kafra Points.
  - Command: str
    Help: |
      參數：<amount>
      依指定數值提高 STR。
  - Command: agi
    Help: |
      參數：<amount>
