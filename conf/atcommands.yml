  - Command: option
    Help: |
      參數：<param1> <param2>(stackable) <param3>(stackable)
      在您的角色身上或周圍加入不同的視覺效果。
       <參數1>       <參數2>        <參數3>
      01：石化　01：視界探知　01：視界探知　512：手推車等級 4
      02：冰凍　02：詛咒　02：隱藏　1024：手推車等級 5
      03：暈眩　04：沉默　04：隱匿　2048：獸人頭盔
      04：睡眠　08：十字驅魔　08：手推車等級 1　4096：婚禮服裝
      06：石化　16：黑暗　16：獵鷹　8192：天使之光
      07：燃燒　32：天使之障壁　32：騎乘　16384：伪裝漫步
      08：禁錮　64：出血　64：隱形
      16：（無）　128：致命毒藥　128：手推車等級 2
      32：（無）　256：恐懼　256：手推車等級 3
  - Command: heal
    Help: |
      參數：[<HP> <SP>]
      恢復指定數量的 HP 與 SP。未指定數值時會完全恢復。
  - Command: healap
    Help: |
      參數：[<AP>]
      恢復指定數量的 AP。未指定數值時會完全恢復 AP。
  - Command: dye
    Aliases:
      - ccolor
    Help: |
      參數：<clothes palette no.>
      變更您角色的服裝顏色。
  - Command: hairstyle
    Aliases:
      - hstyle
    Help: |
      參數：<hairstyle no.>
      變更您的髮型。
  - Command: haircolor
    Aliases:
      - hcolor
    Help: |
      參數：<髮型調色盤編號>
      變更您的髮色。
  - Command: speed
    Help: |
      參數：<1-1000>
      變更您的移動速度。1 為最快，1000 為最慢，預設值為 150。
  - Command: effect
    Help: |
      參數：<effect id> [<flag>]
      讓您的角色獲得指定效果。
  - Command: dropall
    Help: |
      參數：[<item type>]
      將您持有的物品全部丟在地上。未指定類型時會丟棄所有物品。
  - Command: stockall
    Help: |
      參數：[<item type>]
      將物品從手推車移至背包。未指定類型時會移動所有物品。
  - Command: storeall
    Help: |
      將您持有的物品全部存入倉庫。
  - Command: killable
    Help: |
      讓您的角色可以被擊殺。
  - Command: memo
    Help: |
      參數：[memo position]
      設定／變更記憶點位置（未指定位置時顯示目前記憶點）。
  - Command: spiritball
    Help: |
      參數：<1-100>
      給予您「氣彈」，效果類似技能「Call Spirits」。
