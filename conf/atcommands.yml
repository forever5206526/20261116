  - Command: option
    Help: |
      參數：<param1> <param2>(stackable) <param3>(stackable)
      在您的角色身上或周圍加入不同的視覺效果。
       <param1>       <param2>        <param3>
      01: Stone      01: Sight       01: Sight          512: Cart Lv. 4
      02: Frozen     02: Curse       02: Hiding        1024: Cart Lv. 5
      03: Stun       04: Silence     04: Cloaking      2048: Orc Head
      04: Sleep      08: Signum      08: Cart Lv. 1    4096: Wedding
      06: Petrify    16: Blind       16: Falcon        8192: Ruwach
      07: Burning    32: Angelus     32: Riding       16384: Chasewalk
      08: Imprison   64: Bleeding    64: Invisible
      16: (Nothing) 128: D. Poison  128: Cart Lv. 2
      32: (Nothing) 256: Fear       256: Cart Lv. 3
  - Command: heal
    Help: |
      參數：[<HP> <SP>]
      恢復指定數量的 HP 與 SP。未指定數值時會完全恢復。
  - Command: healap
    Help: |
      參數：[<AP>]
      恢復指定數量的 AP。未指定數值時會完全恢復 AP。
  - Command: dye
    Aliases:
      - ccolor
    Help: |
      參數：<clothes palette no.>
      變更您角色的服裝顏色。
  - Command: hairstyle
    Aliases:
      - hstyle
    Help: |
      參數：<hairstyle no.>
      變更您的髮型。
  - Command: haircolor
    Aliases:
      - hcolor
    Help: |
      Params <hair palette no.>
      變更您的髮色。
  - Command: speed
    Help: |
      參數：<1-1000>
      變更您的移動速度。1 為最快，1000 為最慢，預設值為 150。
  - Command: effect
    Help: |
      參數：<effect id> [<flag>]
      讓您的角色獲得指定效果。
  - Command: dropall
    Help: |
      參數：[<item type>]
      將您持有的物品全部丟在地上。未指定類型時會丟棄所有物品。
  - Command: stockall
    Help: |
      參數：[<item type>]
      將物品從手推車移至背包。未指定類型時會移動所有物品。
  - Command: storeall
    Help: |
      將您持有的物品全部存入倉庫。
  - Command: killable
    Help: |
      讓您的角色可以被擊殺。
  - Command: memo
    Help: |
      參數：[memo position]
      設定／變更記憶點位置（未指定位置時顯示目前記憶點）。
  - Command: spiritball
    Help: |
      參數：<1-100>
      給予您「氣彈」，效果類似技能「Call Spirits」。
  - Command: questskill
