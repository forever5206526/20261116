###########################################################################
# 道具組合資料庫
###########################################################################
#
# 設定
#
###########################################################################
# - Combos:                 List of combo sets.
#    - Combo:               定義組合效果的道具清單（至少 2 個道具）。
#       - <item name>       道具的 AEGIS 名稱。
#   Script                  裝備其中一組組合時要執行的腳本。（預設：null）
#   Clear                   是否從資料庫移除已定義的組合。（預設：false）
###########################################################################

Header:
  Type: COMBO_DB
  Version: 1

Footer:
  Imports:
  - Path: db/pre-re/item_combos.yml
    Mode: Prerenewal
  - Path: db/re/item_combos.yml
    Mode: Renewal
  - Path: db/import/item_combos.yml
