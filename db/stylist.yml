#
# 造型師設定
#
###########################################################################
# - Look                     要變更的外觀項目。
#   Options                  可供選擇的選項。
#     - Index                選項在客戶端使用的索引。
#       Value                外觀數值（也可以是道具名稱）。
#       RequiredJob          可購買此項目的職業。
#       CostsHuman:          人類玩家的費用。
#           Price            所需 Zeny。（預設：0）
#           RequiredItem     所需道具。（預設：None）
#           RequiredItemBox  所需道具箱。（預設：None）
#       CostsDoram:          杜蘭族玩家的費用。
#           Price            所需 Zeny。（預設：0）
#           RequiredItem     所需道具。（預設：None）
#           RequiredItemBox  所需道具箱。（預設：None）
