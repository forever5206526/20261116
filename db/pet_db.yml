###########################################################################
# 自訂寵物資料庫
###########################################################################
#
# 寵物設定
#
###########################################################################
# - Mob                      可作為寵物的魔物
#   TameItem                 寵物捕捉道具。
#   EggItem                  寵物蛋道具。
#   EquipItem                寵物配件道具。（預設：0）
#   FoodItem                 寵物食物道具。（預設：0）
#   Fullness                 每隔 [HungryDelay] 秒減少的飢餓值。
#   HungryDelay              餵食後飢餓值再次下降前的時間（秒）。（預設：60）
#   HungerIncrease           每次餵食增加的飢餓值。（預設：20）
#   IntimacyStart            寵物初始親密度。（預設：250）
#   IntimacyFed              餵食時增加的親密度。（預設：50）
#   IntimacyOverfed          過度餵食時親密度的變化量。（預設：-100）
#   IntimacyHungry           寵物飢餓時親密度的變化量。（預設：-5）
#   IntimacyOwnerDie         寵物主人死亡時親密度的變化量。（預設：-20）
#   CaptureRate              捕捉成功率。（10000 = 100%）
#   SpecialPerformance       寵物是否具有特殊表演。（預設：true）
#   AttackRate               寵物攻擊機率［親密度至少須達到 pet_support_min_friendly］。（10000 = 100%）
#   RetaliateRate            主人受到攻擊時寵物反擊的機率［親密度至少須達到 pet_support_min_friendly］。（10000 = 100%）
#   ChangeTargetRate         寵物更換攻擊目標的機率。（10000 = 100%）
#   AllowAutoFeed            是否允許啟用寵物自動餵食。（預設：false）
#   Script                   寵物存活時執行的 Bonus 腳本。（預設：null）
#   SupportScript            啟用 pet_status_support 時執行的 Bonus 腳本。（預設：null）
#   Evolution:               寵物進化設定。（選填；預設：null）
#     - Target               此寵物可進化成的魔物。
#       ItemRequirements:      此寵物進化所需的道具。
#         - Item               Self-explanatory
#           Amount
###########################################################################

Header:
  Type: PET_DB
  Version: 1

Footer:
  Imports:
  - Path: db/pre-re/pet_db.yml
    Mode: Prerenewal
  - Path: db/re/pet_db.yml
    Mode: Renewal
  - Path: db/import/pet_db.yml
