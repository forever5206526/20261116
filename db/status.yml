###########################################################################
# 狀態變更資料庫
###########################################################################
#
# 狀態變更設定
#
###########################################################################
# - Status                    狀態變更名稱。
#   Icon                      狀態變更圖示。（預設：EFST_BLANK）
#   DurationLookup            狀態變更預設持續時間。（預設：0）
#   States:                   用來判定玩家狀態的狀態變更類型。（預設：None）
#   CalcFlags:                狀態變更計算設定，用來指定調整的能力值。（預設：None）
#   Opt1                      狀態變更生效時的特殊效果，不可堆疊。（預設：None）
#   Opt2:                     狀態變更生效時的特殊選項／客戶端效果。（預設：None）
#   Opt3:                     狀態變更生效時的特殊選項／客戶端效果。（預設：Normal）
#   Options:                  狀態變更生效時的特殊選項／客戶端效果。（預設：Nothing）
#   Flags:                    在特定事件中觸發的特殊旗標。（預設：None）
#   MinRate                   狀態變更效果經過減少後的最低比率（10000 = 100%）。（預設：0）
#   MinDuration               狀態變更效果經過減少後的最短持續時間（毫秒）。（預設：1）
#   Fail:                     會導致此狀態無法啟動的其他狀態變更清單。（選填）
#   EndOnStart:               此狀態啟動時會結束的其他狀態變更清單。（選填）
#   EndReturn:                此狀態啟動時會結束且不會產生效果的其他狀態變更清單。（選填）
#   EndOnEnd:                 此狀態失效時會結束的其他狀態變更清單。（選填）
#   Script:                   此狀態變更開始時要執行的腳本。（選填）
###########################################################################

Header:
  Type: STATUS_DB
  Version: 4

Footer:
  Imports:
  - Path: db/pre-re/status.yml
    Mode: Prerenewal
  - Path: db/re/status.yml
    Mode: Renewal
  - Path: db/import/status.yml
