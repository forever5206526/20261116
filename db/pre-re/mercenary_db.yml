###########################################################################
# 傭兵資料庫
###########################################################################
#
# 傭兵設定
#
###########################################################################
# - Id                      傭兵 ID。
#   AegisName               伺服器腳本及查詢使用的傭兵名稱，不可包含空格。
#   Name                    英文名稱。
#   Level                   等級。（預設：1）
#   Hp                      HP 總量。（預設：1）
#   Sp                      SP 總量。（預設：1）
#   Attack                  最低攻擊力。（預設：0）
#   Attack2                 最高攻擊力。（預設：0）
#   Defense                 傭兵的物理防禦，可降低近戰與遠距離物理攻擊／技能傷害。（預設：0）
#   MagicDefense            傭兵的魔法防禦，可降低魔法技能傷害。（預設：0）
#   Str                     力量，影響攻擊力。（預設：1）
#   Agi                     敏捷，影響迴避率。（預設：1）
#   Vit                     體質，影響防禦力。（預設：1）
#   Int                     智力，影響魔法攻擊力。（預設：1）
#   Dex                     靈巧，影響命中率。（預設：1）
#   Luk                     幸運，影響完全迴避／幸運迴避／完全閃避／幸運閃避率。（預設：1）
#   AttackRange             攻擊距離。（預設：0）
#   SkillRange              技能施放距離。（預設：0）
#   ChaseRange              追擊距離。（預設：0）
#   Size                    體型。（預設：Small）
#   Race                    種族。（預設：Formless）
#   Element                 屬性。（預設：Neutral）
#   ElementLevel            屬性等級。（預設：1）
#   WalkSpeed               移動速度。（預設：DEFAULT_WALK_SPEED）
#   AttackDelay             攻擊延遲。（預設：4000）
#   AttackMotion            攻擊動作速度。（預設：2000）
#   DamageMotion            受傷動作速度。（預設：0）
#   Skills:                 傭兵技能清單。（選填）
#     - Name                技能名稱。
#       MaxLevel            技能最高等級。
###########################################################################

Header:
