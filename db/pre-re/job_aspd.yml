###########################################################################
# 職業資料庫
###########################################################################
#
# 職業設定
#
###########################################################################
# - Jobs:                    與群組關聯的職業清單。
#     Job                    職業名稱。
#   MaxWeight                基礎最大負重量。（預設：20000）
#   HpFactor                 HP 指數成長值。每個基本等級增加：[HpFactor * BaseLv / 100]。僅在停用 HP_SP_TABLES 巨集時使用。（預設：0）
#   HpIncrease               HP 線性成長值。每個基本等級增加：[HpIncrease / 100]。僅在停用 HP_SP_TABLES 巨集時使用。（預設：500）
#   SpIncrease               SP 線性成長值。每個基本等級增加：[SpIncrease / 100]。僅在停用 HP_SP_TABLES 巨集時使用。（預設：100）
#   BaseASPD:                各武器類型的基礎 ASPD。（預設：2000）
#     Weapon                 對應 ASPD 的武器類型。
#   BonusStats:              職業等級獎勵能力值／特性。
#     - Level                職業等級。
#       Str                  力量增加量。（預設：0）
#       Agi                  敏捷增加量。（預設：0）
#       Vit                  體質增加量。（預設：0）
#       Int                  智力增加量。（預設：0）
#       Dex                  靈巧增加量。（預設：0）
#       Luk                  幸運增加量。（預設：0）
#       Pow                  力量特性增加量。（預設：0）
#       Sta                  耐力特性增加量。（預設：0）
#       Wis                  智慧特性增加量。（預設：0）
#       Spl                  咒術特性增加量。（預設：0）
#       Con                  集中特性增加量。（預設：0）
#       Crt                  創造特性增加量。（預設：0）
#   MaxStats:                適用的能力值／特性上限。（預設：battle_config::max_*_parameter）
#     Str                    力量。
#     Agi                    敏捷。
#     Vit                    體質。
#     Int                    智力。
#     Dex                    靈巧。
#     Luk                    幸運。
#     Pow                    力量特性。
#     Sta                    耐力特性。
#     Wis                    智慧特性。
#     Spl                    咒術特性。
#     Con                    集中特性。
#     Crt                    創造特性。
#   MaxBaseLevel             基本等級上限。（預設：MAX_LEVEL）
#   BaseExp:                 各基本等級所需經驗值。
#     - Level                基本等級。
#       Exp                  基本經驗值。
#   MaxJobLevel              職業等級上限。（預設：MAX_LEVEL）
#   JobExp:                  各職業等級所需經驗值。
#     - Level                職業等級。
#       Exp                  職業經驗值。
#   BaseHp:                  各基本等級的基礎 HP。
#     - Level                基本等級。
#       Hp                   基礎 HP。
#   BaseSp:                  各基本等級的基礎 SP。
#     - Level                基本等級。
#       Sp                   基礎 SP。
#   BaseAp:                  各基本等級的基礎 AP。
#     - Level                基本等級。
#       Ap                   基礎 AP。
###########################################################################

