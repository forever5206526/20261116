###########################################################################
# 精煉資料庫
###########################################################################
#
# 精煉設定
#
###########################################################################
# - Group                               精煉道具類型。
#   Levels:                             各道具等級的精煉設定。（預設：null）
#     - Level                           道具等級。
#       RefineLevels:                   各精煉等級的精煉設定。（預設：null）
#         - Level                       精煉等級。
#           Bonus                       精煉加成。（預設：0）
#           RandomBonus                 額外精煉加成，範圍為 0～RandomBonus，並累加至 Bonus。（預設：0）
#           BlacksmithBlessingAmount    所需的鐵匠祝福數量。（預設：0）
#           BroadcastSuccess            此等級精煉成功時是否向全伺服器公告。（預設：false）
#           BroadcastFailure            此等級精煉失敗時是否向全伺服器公告。（預設：false）
#           Chances:                    依成本類型設定成功機率。（預設：null）
#             - Type                    依使用礦石決定的精煉成本類型。
#               Rate                    成功機率，範圍為 0～10000。（預設：0）
#               Price                   精煉所需的 Zeny 數量。（預設：0）
#               Material                精煉所需的礦石道具。（預設：0）
#               BreakingRate            道具損壞機率，範圍為 0～10000。（預設：0）
#               DowngradeAmount         失敗時降低的精煉等級數。（預設：0）
###########################################################################

