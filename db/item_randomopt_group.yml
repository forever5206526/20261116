###########################################################################
# 道具隨機附加能力群組資料庫
###########################################################################
#
# 道具隨機附加能力群組設定
#
###########################################################################
# - Id                  道具隨機附加能力群組 ID。
#   Group               道具隨機附加能力群組常數。
#   Slots:              保證套用道具隨機附加能力的欄位。最多為 MAX_ITEM_RDM_OPT。
#     - Slot            欄位編號。
#       Options:        此欄位可套用的道具隨機附加能力清單。
#         - Option      Item Random Option constant.
#           MinValue    最小值。（預設：0）
#           MaxValue    最大值。（預設：0）
#           Param       參數值。（預設：0）
#           Chance      此道具隨機附加能力的套用機率（1 = 0.01%，10000 = 100%）。（預設：0）
#   MaxRandom           最多套用的隨機附加能力數量。這些選項不保證一定套用，最大值為 MAX_ITEM_RDM_OPT 減去 Slots 總數。（預設：0）
#   Random:             剩餘欄位可套用的道具隨機附加能力清單。（選填）
#     - Option          Item Random Option constant.
#       MinValue        最小值。（預設：0）
#       MaxValue        最大值。（預設：0）
#       Param           參數值。（預設：0）
#       Chance          此道具隨機附加能力的套用機率（1 = 0.01%，10000 = 100%）。（預設：0）
###########################################################################

Header:
  Type: RANDOM_OPTION_GROUP
  Version: 1

Footer:
  Imports:
  - Path: db/re/item_randomopt_group.yml
    Mode: Renewal
  - Path: db/import/item_randomopt_group.yml
