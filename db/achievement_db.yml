###########################################################################
# 成就資料庫
###########################################################################
#
# 成就設定
#
###########################################################################
# - Id                  成就 ID。
#   Group               成就群組類型。（預設：None）
#   Name                成就名稱。
#   Targets:            完成成就所需目標清單。（預設：null）
#     - Id              匯入方法使用的索引值。
#       Mob             目標魔物。（預設：0）
#       Count           目標數量。（預設：1）
#   Condition           判定成就完成前必須符合的條件敘述。（預設：null）
#   Map                 AG_CHATTING 類型使用的地圖名稱。（預設：-1）
#   Dependents:         必須先完成才能完成此成就的其他成就清單。（預設：null）
#     - Id: <bool>      前置成就 ID。
#   Rewards:            完成時發放的獎勵清單。（預設：null）
#     Item              道具名稱。
#     Amount            道具數量。（預設：1）
#     Script            Bonus 腳本。（預設：null）
#     TitleId           稱號 ID。（預設：0）
#   Score               完成時取得的成就點數。（預設：0）
