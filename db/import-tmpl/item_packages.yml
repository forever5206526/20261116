#
# 道具組合包設定
#
###########################################################################
# - Item                       觸發道具組合包選擇介面的道具。
#   Groups:                    可供選擇的群組。
#     - Group                  可選擇的群組 ID（必須與客戶端 LUA 檔案一致）。
#       Items:                 將發放的道具清單。
#         - Item               將發放的道具。
#           Amount             道具數量。（預設：1）
#                              透過匯入移除道具時，請將數量設為 0。
#           RentalHours        租賃時間（小時）。（預設：0）
#           Refine             道具精煉等級。（預設：0）
#           RandomOptionGroup  要套用的隨機附加能力群組名稱。（預設：none）
