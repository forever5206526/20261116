###########################################################################
# 魔物資料庫
###########################################################################
#
# 魔物設定
#
###########################################################################
# - Id                      魔物 ID。
#   AegisName               伺服器腳本及查詢使用的魔物名稱，不可包含空格。
#   Name                    英文名稱。
#   JapaneseName            日文名稱。（預設：'Name' 欄位的值）
#   Level                   等級。（預設：1）
#   Hp                      HP 總量。（預設：1）
#   Sp                      SP 總量。（預設：1）
#   BaseExp                 取得的基本經驗值。（預設：0）
#   JobExp                  取得的職業經驗值。（預設：0）
#   MvpExp                  取得的 MVP 經驗值。（預設：0）
#   Attack                  在舊制中代表最低攻擊力，在新制中代表基礎攻擊力。（預設：0）
#   Attack2                 在舊制中代表最高攻擊力，在新制中代表基礎魔法攻擊力。（預設：0）
#   Defense                 魔物的物理防禦，可降低近戰與遠距離物理攻擊／技能傷害。（預設：0）
#   MagicDefense            魔物的魔法防禦，可降低魔法技能傷害。（預設：0）
#   Resistance              魔物的物理抗性，可降低近戰與遠距離物理攻擊／技能傷害。（預設：0）
#   MagicResistance         魔物的魔法抗性，可降低魔法技能傷害。（預設：0）
#   Str                     力量，影響攻擊力。（預設：1）
#   Agi                     敏捷，影響迴避率。（預設：1）
#   Vit                     體質，影響防禦力。（預設：1）
#   Int                     智力，影響魔法攻擊力。（預設：1）
#   Dex                     靈巧，影響命中率。（預設：1）
#   Luk                     幸運，影響完全迴避／幸運迴避／完全閃避／幸運閃避率。（預設：1）
#   AttackRange             攻擊距離。（預設：0）
#   SkillRange              技能施放距離。（預設：0）
#   ChaseRange              追擊距離。（預設：0）
#   Size                    體型。（預設：Small）
#   Race                    種族。（預設：Formless）
#   RaceGroups:             魔物可能所屬的次要群組清單。（選填）
#     <group>: <value>      要啟用或停用的群組。
#   Element                 屬性。（預設：Neutral）
#   ElementLevel            屬性等級。（預設：1）
#   WalkSpeed               移動速度。（預設：DEFAULT_WALK_SPEED）
#   AttackDelay             攻擊延遲。（預設：0）
#   AttackMotion            攻擊動作速度。（預設：0）
#   ClientAttackMotion      客戶端攻擊速度。（預設：AttackMotion）
#   DamageMotion            受傷動作速度。（預設：0）
#   DamageTaken             魔物承受傷害的比率。（預設：100）
#   Ai                      Aegis 魔物類型的 AI 行為。（預設：06）
#   Class                   Aegis 魔物類別。（預設：Normal）
#   Modes:                  未由 AI、Class 或 Attribute 定義的特殊行為清單。（選填）
#     <mode>: <value>       要啟用或停用的模式。
#   MvpDrops:               MVP 可能掉落的獎勵道具清單，最多 MAX_MVP_DROP 項。（選填）
#     - Item                道具名稱。
#       Rate                道具掉落率。（預設：1）
#       RandomOptionGroup   道具掉落時套用的隨機附加能力群組。（預設：None）
#       Index               用於覆寫道具的索引。（選填）
#   Drops:                  一般可能掉落的道具清單，最多 MAX_MOB_DROP 項。（選填）
#     - Item                道具名稱。
#       Rate                道具掉落率。（預設：1）
#       StealProtected      是否防止 TF_STEAL 偷取此道具。（預設：false）
#       RandomOptionGroup   道具掉落時套用的隨機附加能力群組。（預設：None）
#       Index               用於覆寫道具的索引。（選填）
###########################################################################

