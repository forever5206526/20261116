###########################################################################
# 技能資料庫
###########################################################################
#
# 技能設定
#
###########################################################################
# - Id                        技能唯一 ID。
#   Name                      技能 Aegis 名稱。
#   Description               技能說明。
#   MaxLevel                  技能最高等級。
#   Type                      技能類型。（預設：None）
#   TargetType                技能目標類型。（預設：Passive）
#   DamageFlags:              技能傷害屬性。
#   Flags:                    技能資訊旗標。
#   Range:                    技能射程。（預設：0）
#     - Level                 技能等級。
#       Size                  指定技能等級的射程。
#   Hit                       技能命中類型。（預設：Normal）
#   HitCount:                 技能命中次數。（預設：0）
#     - Level                 技能等級。
#       Count                 指定技能等級的命中次數。
#   Element:                  技能屬性。（預設：Neutral）
#     - Level                 技能等級。
#       Element               指定技能等級的屬性。
#   SplashArea:               技能範圍效果的作用區域。（預設：0）
#     - Level                 技能等級。
#       Area                  指定技能等級的範圍效果區域。
#   ActiveInstance:           地面上可同時存在的技能單位最大數量。（預設：0）
#     - Level                 技能等級。
#       Max                   指定技能等級可同時存在的技能單位數量。
#   Knockback:                技能擊退的格數。（預設：0）
#     - Level                 技能等級。
#       Amount                指定技能等級的擊退格數。
#   GiveAp:                   技能成功施放時取得的 AP。（預設：0）
#     - Level                 技能等級。
#       Amount                指定技能等級可取得的 AP。
#   CopyFlags:                指定技能是否可以複製。（選填）
#     Skill:                  可複製此技能的技能類型。
#     RemoveRequirement:      移除一種需求類型。（選填）
#   NoNearNPC:                指定技能是否可在 NPC 附近使用。（選填）
#     AdditionalRange         技能可施放時與 NPC 的距離格數。（選填）
#     Type:                   NPC 類型。
#   CastCancel                受到攻擊時是否中斷詠唱。（預設：false）
#   CastDefenseReduction      技能詠唱期間的防禦降低比率。（預設：0）
#   CastTime:                 技能詠唱時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的詠唱時間（毫秒）。
#   AfterCastActDelay:        角色無法使用技能的時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的詠唱後動作延遲（毫秒）。
#   AfterCastWalkDelay:       角色恢復移動前的等待時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的詠唱後移動延遲（毫秒）。
#   Duration1:                技能持續時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的技能持續時間（毫秒）。
#   Duration2:                技能持續時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的技能持續時間（毫秒）。
#   Cooldown:                 角色再次使用相同技能前的等待時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的冷卻時間（毫秒）。
#   FixedCastTime:            技能詠唱期間固定的時間（毫秒）。（預設：0）
#     - Level                 技能等級。
#       Time                  指定技能等級的詠唱後動作延遲（毫秒）。
#   CastTimeFlags:            技能詠唱時間的效果。（選填）
#   CastDelayFlags:           技能延遲的效果。（選填）
#   Requires:                 施放技能所需條件清單。（選填）
#     HpCost:                 施放技能所需 HP。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 HP。
#     SpCost:                 施放技能所需 SP。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 SP。
#     ApCost:                 施放技能所需 AP。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 AP。
#     HpRateCost:             施放技能所需的 HP 比率。正值使用目前 HP，負值使用最大 HP。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 HP 比率。
#     SpRateCost:             施放技能所需的 SP 比率。正值使用目前 SP，負值使用最大 SP。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 SP 比率。
#     ApRateCost:             施放技能所需的 AP 比率。正值使用目前 AP，負值使用最大 AP。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 AP 比率。
#     MaxHpTrigger:           施放技能時允許的最高 HP 數值。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放技能所需的最高 HP 觸發值。
#     ZenyCost:               施放技能所需的 Zeny。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的 Zeny。
#     Weapon:                 施放技能所需的武器。（預設：All）
#     Ammo:                   施放技能所需的彈藥。（預設：None）
#     AmmoAmount:             施放技能所需的彈藥數量。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的彈藥數量。
#     State                   施放技能所需的特殊狀態。（預設：None）
#     Status:                 施放技能所需的狀態變更。（預設：nullptr）
#     SpiritSphereCost:       施放技能所需的氣彈數量。（預設：0）
#       - Level               技能等級。
#         Amount              指定技能等級施放所需的氣彈數量。
#     ItemCost:               施放技能所需的道具。（預設：0）
#       - Item                道具名稱。
#         Amount              道具數量。
#         Level               技能等級。 Makes the skill item check become level dependent if supplied. (Default: applies to all levels)
#     Equipment:              施放技能所需裝備的道具。（預設：nullptr）
#   Unit:                     技能單位數值。（選填）
#     Id                      技能單位 ID。
#     AlternateId:            替代技能單位 ID。（預設：0）
#     Layout:                 技能單位配置。（預設：0）
#       - Level               技能等級。
#         Size                Unit layout at specific skill level.
#     Range:                  Skill unit range. (Default: 0)
#       - Level               技能等級。
#         Size                Unit range at specific skill level.
#     Interval                Skill unit interval in milliseconds. (Default: 0)
#     Target                  Skill unit target type. (Default: All)
#     Flag:                   Skill unit flags. (Default: None)
#   Status                    Status Change that is associated to the skill. (Optional)
###########################################################################

Header:
  Type: SKILL_DB
  Version: 3
