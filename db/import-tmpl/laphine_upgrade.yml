###########################################################################
# - Item                       觸發拉菲內升級的道具。
#   RandomOptionGroup          要套用的隨機附加能力群組名稱。（預設：none）
#   ResultRefine               升級後的指定精煉等級。（預設：none）
#   ResultRefineMinimum        升級後的最低精煉等級。（預設：none）
#   ResultRefineMaximum        升級後的最高精煉等級。（預設：none）
#   MinimumRefine              需求道具的最低精煉等級。（預設：0）
#   MaximumRefine              需求道具的最高精煉等級。（預設：MAX_REFINE）
#   RequiredRandomOptions      道具必須具有多少個隨機附加能力？（預設：0）
#   CardsAllowed               目標道具是否允許附有卡片？（預設：no）
#   TargetItems:               可選擇的目標道具清單。
#     - Item                   可選擇的目標道具名稱。
