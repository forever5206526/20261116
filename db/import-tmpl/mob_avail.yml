###########################################################################
# 魔物可用性與別名資料庫
###########################################################################
#
# 魔物可用性與別名設定
#
###########################################################################
# - Mob                     要調整的魔物。
#   Sprite                  傳送給客戶端以取代原魔物的外觀代碼。
#   Sex                     若 Sprite 為玩家外觀，則指定性別。（預設：Female）
#   HairStyle               若 Sprite 為玩家外觀，則指定髮型 ID。（預設：0）
#   HairColor               若 Sprite 為玩家外觀，則指定髮色 ID。（預設：0）
#   ClothColor              若 Sprite 為玩家外觀，則指定服裝顏色 ID。（預設：0）
#   Weapon                  若 Sprite 為玩家外觀，則指定武器道具名稱。（預設：0）
#   Shield                  若 Sprite 為玩家外觀，則指定盾牌道具名稱。（預設：0）
#   HeadTop                 若 Sprite 為玩家外觀，則指定頭飾道具名稱。（預設：0）
#   HeadMid                 若 Sprite 為玩家外觀，則指定頭飾道具名稱。（預設：0）
#   HeadLow                 若 Sprite 為玩家外觀，則指定頭飾道具名稱。（預設：0）
#   Robe                    若 Sprite 為玩家外觀，則指定披風道具名稱。（預設：0）
#   PetEquip                若 Mob 是有效寵物，則指定寵物裝備道具名稱。（預設：0）
#   Options:                為物件設定選項。（選填）
#     <Option>: bool
###########################################################################

Header:
  Type: MOB_AVAIL_DB
  Version: 1

