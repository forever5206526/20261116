###########################################################################
# 道具附魔資料庫
###########################################################################
#
# 道具附魔設定
#
###########################################################################
# - Id                         客戶端 LUA 索引。
#   TargetItems:               可選擇的目標道具清單。
#     <item name>              可選擇的目標道具名稱。
#   MinimumRefine              目標道具的最低精煉等級。（預設：0）
#   MinimumEnchantgrade        目標道具的最低附魔階級。（預設：0）
#   AllowRandomOptions         是否允許目標道具具有隨機附加能力。（預設：true）
#   Reset:                     重設選項。（預設：null）
#     Chance                   重設成功機率。（預設：0）
#     Price                    重設附魔所需價格。（預設：0）
#     Materials:               重設附魔所需道具。（預設：null）
#       - Material             需求道具名稱。
#         Amount               需求道具數量。（預設：1）
#   Order:                     插槽可進行附魔的順序。
#                              透過匯入覆寫時，會清除目前已定義的順序。
#     - Slot                   插槽編號（0～3）。
#   Slots:                     附魔選項。
#     - Slot                   插槽編號（0～3）。
#       Price                  一般附魔流程所需價格。（預設：0）
#       Materials:             一般附魔流程所需道具。（預設：null）
#         - Material           需求道具名稱。
#           Amount             需求道具數量。（預設：1）
#       Chance                 一般附魔流程的基礎成功機率。（預設：100000）
#       EnchantgradeBonus:     每個附魔階級額外增加的成功機率。（預設：null）
#         - Enchantgrade       套用加成所需的附魔階級。
#           Chance             額外增加至基礎機率的成功機率。
#       Enchants:              各附魔階級可使用的一般附魔選項。（預設：null）
#         - Enchantgrade       要附魔道具的附魔階級。
#           Items:             指定附魔階級可使用的一般附魔選項。（預設：null）
#             - Item           可用附魔道具的名稱。
#               Chance         取得此指定附魔道具的機率。
#       PerfectEnchants:       Available perfect enchants (100% chance + selectable) for this slot. (Default: null)
#         - Item               可用附魔道具的名稱。
#           Price              Price required for this perfect enchant. (Default: 0)
#           Materials:         Items required for this perfect enchant. (Default: null)
#             - Material       需求道具名稱。
#               Amount         需求道具數量。（預設：1）
#       Upgrades:              Available enchant upgrades for this slot. (Default: null)
#         - Enchant            Item name of the enchant item available for upgrade.
#           Upgrade            Item name of the enchant it can be upgrade to.
#           Price              Price required for this enchant upgrade. (Default: 0)
#           Materials:         Items required for this enchant upgrade (Default: null)
#             - Material       需求道具名稱。
#               Amount         需求道具數量。（預設：1）
###########################################################################

Header:
  Type: ITEM_ENCHANT_DB
  Version: 1
