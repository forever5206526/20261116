###########################################################################
# 戰場佇列資料庫
###########################################################################
#
# 戰場佇列設定
#
###########################################################################
# - Id                Unique ID for the battleground type.
#   Name              戰場名稱。必須與客戶端中的名稱完全一致，玩家才能加入。
#   MinPlayers        每隊所需的最低玩家人數。（預設：1）
#   MaxPlayers        每隊可容納的最高玩家人數。（預設：MAX_BG_MEMBERS / 2）
#   MinLevel          加入戰場所需的最低等級。（預設：1）
#   MaxLevel          可加入戰場的最高等級。（預設：MAX_LEVEL 值）
#   Deserter          玩家被標記為逃兵的時間（秒）。（預設：600）
#   StartDelay        佇列額滿後，傳送玩家前等待的時間（秒）。（預設：0）
#   Join:             允許的報名方式。entryqueuelist.lub 可控制這些選項是否顯示。
#     Solo            允許個人加入佇列。（預設：true）
#     Party           允許隊伍加入佇列。（預設：true）
#     Guild           允許公會加入佇列。（預設：true）
#   JobRestrictions   無法加入戰場的職業清單。
#   Locations:        戰場地點設定。
#     - Map           進行戰場的地圖。
#       StartEvent    戰場開始時觸發的 NPC 事件。
#       TeamA:        A 隊設定。
#         RespawnX    死亡後傳送的 X 座標。
#         RespawnY    死亡後傳送的 Y 座標。
#         DeathEvent  玩家死亡時觸發的 NPC 事件。
#         QuitEvent   玩家退出時觸發的 NPC 事件。
#         ActiveEvent 玩家加入進行中的戰場時觸發的 NPC 事件。
#         Variable    戰場腳本中使用的 BG ID 變數名稱。
#       TeamB:        B 隊設定。
#         RespawnX    死亡後傳送的 X 座標。
#         RespawnY    死亡後傳送的 Y 座標。
#         DeathEvent  玩家死亡時觸發的 NPC 事件。
#         QuitEvent   玩家退出時觸發的 NPC 事件。
#         ActiveEvent 玩家加入進行中的戰場時觸發的 NPC 事件。
#         Variable    戰場腳本中使用的 BG ID 變數名稱。
###########################################################################

Header:
  Type: BATTLEGROUND_DB
  Version: 1
