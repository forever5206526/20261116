###########################################################################
# 道具群組資料庫
###########################################################################
#
# 道具群組設定
#
###########################################################################
# - Group                      道具群組名稱。
#   SubGroups:
#     - SubGroup:              與道具清單關聯的子群組編號。詳細資訊請參閱 doc/item_group.txt。
#       Algorithm:             子群組使用的演算法類型。（預設：SharedPool）
#       List:                  子群組的道具清單。
#        - Index               可用來在清單中以不同資料新增相同道具的唯一編號。
#          Item                從此道具群組取得的道具 AegisName。
#          Rate                取得道具的機率。（預設：0）
#          Amount              取得的道具數量。（預設：1）
#          Duration            將道具設定為租賃道具，並於指定分鐘數後到期。不建議用於可堆疊道具。（預設：0）
#          Announced           玩家取得此道具時是否向全伺服器公告。（預設：false）
#          UniqueId            是否為指定道具配置唯一 ID。（預設：沿用 item_db 的 UniqueId）
#          Stacked             可堆疊道具是否以堆疊方式發放。（預設：true）
#          Named               是否在道具上刻印取得者名稱。（預設：false）
#          Bound               取得的道具綁定類型。（預設：None）
#          RandomOptionGroup   將此群組的隨機附加能力套用至所有可裝備道具。（預設：None）
#          RefineMinimum       所有可裝備道具至少套用的精煉等級。（預設：0）
#          RefineMaximum       所有可裝備道具最多套用的精煉等級。（預設：0）
#          Clear               是否移除目前資料。（選填）
#       Clear                  移除指定子群組。（選填）
###########################################################################

Header:
  Type: ITEM_GROUP_DB
  Version: 4
