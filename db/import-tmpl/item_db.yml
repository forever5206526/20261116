###########################################################################
# 道具資料庫
###########################################################################
#
# 道具設定
#
###########################################################################
# - Id                      道具 ID。
#   AegisName               伺服器腳本及查詢使用的道具名稱，不可包含空格。
#   Name                    遊戲顯示用的英文名稱。
#   Type                    道具類型。（預設：Etc）
#   SubType                 武器、彈藥或卡片類型。（預設：0）
#   Buy                     購買價格。未指定時，會設為出售價格的兩倍。（預設：0）
#   Sell                    出售價格。未指定時，會設為購買價格的一半。（預設：0）
#   Weight                  道具重量，每 10 點代表 1 單位重量。（預設：0）
#   Attack                  武器攻擊力。（預設：0）
#   MagicAttack             武器魔法攻擊力。（預設：0）
#   Defense                 防具防禦力。（預設：0）
#   Range                   武器攻擊距離。（預設：0）
#   Slots                   道具可用插槽數量。（預設：0）
#   Jobs                    可裝備此道具的職業。（Map 預設為 'All: true'）
#   Classes                 可裝備此道具的上位職業類型。（Map 預設為 'All: true'）
#   Gender                  可裝備此道具的性別。（預設：Both）
#   Locations               裝備穿戴位置。（預設：None）
#   WeaponLevel             武器等級。（武器預設：1）
#   ArmorLevel              防具等級。（防具預設：1）
#   EquipLevelMin           裝備所需最低等級。（預設：0）
#   EquipLevelMax           可裝備的最高等級。（預設：0）
#   Refineable              此道具是否可精煉。（預設：false）
#   Gradable                此道具是否可進行階級強化。（預設：false）
#   View                    道具顯示外觀的 Sprite 編號。（預設：0）
#   AliasName               傳送給客戶端以取代此道具 AegisName 的另一個道具 AegisName。（預設：null）
#   Flags:                  道具旗標。（預設：null）
#     BuyingStore           此道具是否可透過收購商店收購。（預設：false）
#     DeadBranch            此道具是否為枯樹枝。（預設：false）
#     Container             此道具是否屬於容器內容物。（預設：false）
#     UniqueId              此道具堆疊是否具有唯一 ID。（預設：false）
#     BindOnEquip           裝備此道具時是否綁定角色。（預設：false）
#     DropAnnounce          掉落此道具時是否向持有者顯示特殊公告。（預設：false）
#     NoConsume             使用此道具時是否消耗。（預設：false）
#     DropEffect            魔物掉落此道具時，地面是否顯示特殊效果。（預設：None）
#   Delay:                  道具使用延遲。（預設：null）
#     Duration              延遲時間（秒）。
#     Status                用於追蹤延遲的狀態變更。（預設：None）
#   Stack:                  道具堆疊設定。（預設：null）
#     Amount                可堆疊的最大數量。
#     Inventory             是否允許在玩家背包中堆疊。（預設：true）
#     Cart                  是否允許在玩家手推車中堆疊。（預設：false）
#     Storage               是否允許在玩家倉庫中堆疊。（預設：false）
#     GuildStorage          是否允許在公會倉庫中堆疊。（預設：false）
#   NoUse:                  道具無法使用時的條件。（預設：null）
#     Override              可覆寫這些條件的群組等級。（預設：100）
#     Sitting               玩家坐下時是否禁止使用此道具。（預設：false）
#   Trade:                  交易限制。（預設：null）
#     Override              可覆寫這些條件的群組等級。（預設：100）
#     NoDrop                是否禁止丟棄此道具。（預設：false）
#     NoTrade               是否禁止交易此道具。（預設：false）
#     TradePartner          是否禁止將此道具交易給玩家的交易對象。（預設：false）
#     NoSell                是否禁止販售此道具。（預設：false）
#     NoCart                是否禁止將此道具放入手推車。（預設：false）
#     NoStorage             是否禁止將此道具存入倉庫。（預設：false）
#     NoGuildStorage        是否禁止將此道具存入公會倉庫。（預設：false）
#     NoMail                是否禁止透過郵件寄送此道具。（預設：false）
#     NoAuction             是否禁止將此道具放入拍賣。（預設：false）
#   Script                  使用或裝備此道具時執行的腳本。（預設：null）
#   EquipScript             裝備此道具時執行的腳本。（預設：null）
#   UnEquipScript           卸下此道具或租賃道具到期時執行的腳本。（預設：null）
###########################################################################

