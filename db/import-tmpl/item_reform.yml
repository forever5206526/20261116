###########################################################################
# 道具改造資料庫
###########################################################################
#
# 道具改造設定
#
###########################################################################
# - Item                       開啟道具改造介面的觸發道具。
#   BaseItems:                 可進行改造的道具。
#     - BaseItem               可進行改造的道具。
#       MinimumRefine          需求道具的最低精煉等級。（預設：0）
#       MaximumRefine          需求道具的最高精煉等級。（預設：MAX_REFINE）
#       RequiredRandomOptions  道具必須具有的隨機附加能力數量。（預設：0）
#       CardsAllowed           是否允許目標道具附有卡片。（預設：true）
#       Materials:             改造所需的額外道具。（預設：none）
#         - Material           所需的材料道具。
#           Amount             所需材料道具數量。（預設：1）
#       ResultItem             改造後取得的道具。
#       ChangeRefine           改造時精煉等級增加或減少的數值。（預設：0）
#       RandomOptionGroup      要套用的隨機附加能力群組名稱。（預設：none）
#       ClearSlots             改造時是否移除卡片與插槽附魔。（預設：false）
#       RemoveEnchantgrade     改造時是否移除附魔階級。（預設：false）
###########################################################################

