###########################################################################
# 任務資料庫
###########################################################################
#
# 任務設定
#
###########################################################################
# - Id                     任務 ID。
#   Title                  任務標題。
#   TimeLimit              任務到期前的時間。（預設：0）
#   Targets:               任務目標設定。（預設：null）
#     - Mob                要擊殺的魔物名稱。
#       Count              要擊殺的魔物數量。匯入時設為 0 可略過此目標。
#       Id                 此任務 ID 的唯一目標索引，必須為正整數。
#       Race               目標魔物種族。（預設：All）
#       Size               目標魔物體型。（預設：All）
#       Element            目標魔物屬性。（預設：All）
#       MinLevel           目標魔物最低等級。若未設定但已設定 MaxLevel，MinLevel 將為 1。匯入時設為 0 可忽略此條件。（預設：0）
#       MaxLevel           目標魔物最高等級。匯入時設為 0 可忽略此條件。（預設：0）
#       Location           計算擊殺數的地圖名稱。（預設：All）
#       MapName            任務介面顯示的地圖名稱。（預設：空字串）
#       MapMobTargets      魔物名稱清單。只有清單中的魔物會增加擊殺計數，且僅在使用 Id 時生效。（預設：所有魔物）
#         <name>: <bool>   魔物名稱，以及是否將該魔物加入或移出清單。
#   Drops:                 任務道具掉落目標。（預設：null）
#     - Mob                要擊殺的魔物。設為 0 表示適用所有魔物。（預設：0）
#       Item               要掉落的道具。
#       Count              掉落道具數量。不可堆疊道具的預設數量為 1。（預設：1）
#       Rate               道具掉落率。（10000 = 100%）
###########################################################################

Header:
  Type: QUEST_DB
  Version: 3
