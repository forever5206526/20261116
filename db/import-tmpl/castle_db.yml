###########################################################################
# 公會城堡資料庫
###########################################################################
#
# 公會城堡設定
#
###########################################################################
# - Id                城堡的唯一識別碼。
#   Map               作為城堡地圖的地圖名稱。
#   Name              城堡名稱（供腳本及守護者名稱標籤使用）。
#   Npc               公會解散期間，已佔領城堡遭到放棄時，要呼叫 ::OnGuildBreak 的 NPC 唯一名稱。
#   Type              此城堡所屬的攻城戰類型。（預設：First_Edition）
#   ClientId          城堡在客戶端使用的 ID。（預設：0）
#   WarpEnabled       是否啟用傳送至城堡的功能。（預設：false）
#   WarpX             傳送目的地的 X 座標。（預設：0）
#   WarpY             傳送目的地的 Y 座標。（預設：0）
#   WarpCost          使用傳送功能所需的 Zeny。（預設：100）
#   WarpCostSiege     攻城戰期間使用傳送功能所需的 Zeny。（預設：100000）
###########################################################################

