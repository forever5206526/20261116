###########################################################################
# 技能樹資料庫
###########################################################################
#
# 技能樹設定
#
###########################################################################
# - Job                   職業名稱。
#   Inherit               此職業要繼承技能樹的來源職業名稱對照表。（預設：null）
#                         注意：職業不會繼承子職業技能，只會繼承指定職業 Tree 中定義的技能。
#   Tree:                 此職業可使用的技能清單。（預設：null）
#     - Name              技能名稱。
#       MaxLevel          技能最高等級。設為 0 可移除此技能。
#       Exclude           是否排除此技能，使其不會被繼承。（預設：false）
#       BaseLevel         解鎖此技能所需的最低基本等級。（預設：0）
#       JobLevel          解鎖此技能所需的最低職業等級。（預設：0）
#       Requires:         解鎖此技能所需的前置技能清單。（預設：null）
#         - Name          技能名稱。
#           Level         所需技能等級。設為 0 可移除此技能。
###########################################################################

Header:
  Type: SKILL_TREE_DB
  Version: 1

Footer:
  Imports:
  - Path: db/pre-re/skill_tree.yml
    Mode: Prerenewal
  - Path: db/re/skill_tree.yml
    Mode: Renewal
  - Path: db/import/skill_tree.yml
