###########################################################################
# 地圖掉落資料庫
###########################################################################
#
# 地圖掉落設定
#
###########################################################################
# - Map                             地圖名稱。
#   GlobalDrops                     此地圖上所有魔物的掉落設定。（預設：空）
#                                   這些掉落不受伺服器掉落率影響，也無法透過偷竊取得。
#     - Index                       掉落項目的唯一索引。
#       Item                        道具名稱。
#       Rate                        道具掉落率，格式為 n/100000。
#       RandomOptionGroup           道具掉落時套用的隨機附加能力群組。（預設：None）
#   SpecificDrops                   此地圖上指定魔物的掉落設定。（預設：空）
#     - Monster                     魔物名稱。
#       Drops                       此指定魔物的掉落設定。（預設：空）
#                                   這些掉落不受伺服器掉落率影響，也無法透過偷竊取得。
#         - Index                   掉落項目的唯一索引。
#           Item                    道具名稱。
#           Rate                    道具掉落率，格式為 n/100000。
#           RandomOptionGroup       道具掉落時套用的隨機附加能力群組。（預設：None）
###########################################################################

Header:
  Type: MAP_DROP_DB
  Version: 2

Footer:
  Imports:
  - Path: db/re/map_drops.yml
    Mode: Renewal
  - Path: db/import/map_drops.yml
