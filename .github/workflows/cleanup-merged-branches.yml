name: Cleanup merged working branches

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-working-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove only safely merged branches
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged and inactive branches
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + "/" + repo;
            const protectedNames = new Set([
              "main",
              "work/brhades-pandas-full-port",
            ]);

            // Reviewed on 2026-11-20: these old branches contain no unique
            // functionality or documentation beyond main. Their tips are
            // pinned so any new commit automatically disables this exception.
            const reviewedSupersededBranches = new Map([
              ["archive/pre-consolidation-2026-11-17", "79c5da17204d948310b8c49397260f2840cf626a"],
              ["work/mapflag-parameter-framework-2026-11-18", "d6b4104c84cfc0a31180e8d1eee9993a8fa6627c"],
              ["work/pandas-mapflag-parameter-framework-2026-11-19", "7ac7e3c149d0d36c2a12c7e1131468dbddf62de9"],
            ]);

            const [branches, openPullRequests, closedPullRequests] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, {
                owner,
                repo,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "closed",
                per_page: 100,
              }),
            ]);

            const activeRefs = new Set();
            for (const pr of openPullRequests) {
              if (pr.head.repo?.full_name === repository) {
                activeRefs.add(pr.head.ref);
              }
              if (pr.base.repo?.full_name === repository) {
                activeRefs.add(pr.base.ref);
              }
            }

            const mergedHeadShas = new Map();
            for (const pr of closedPullRequests) {
              if (!pr.merged_at || pr.base.ref !== "main" ||
                  pr.head.repo?.full_name !== repository) {
                continue;
              }
              const shas = mergedHeadShas.get(pr.head.ref) ?? new Set();
              shas.add(pr.head.sha);
              mergedHeadShas.set(pr.head.ref, shas);
            }

            let deleted = 0;
            let kept = 0;
            for (const branch of branches) {
              const name = branch.name;
              if (protectedNames.has(name) || branch.protected || activeRefs.has(name)) {
                core.info("Keep " + name + ": protected or used by an open pull request.");
                kept++;
                continue;
              }

              let safeToDelete = mergedHeadShas.get(name)?.has(branch.commit.sha) ?? false;
              const reviewedSha = reviewedSupersededBranches.get(name);
              if (!safeToDelete && reviewedSha && branch.commit.sha === reviewedSha) {
                safeToDelete = true;
                core.info("Delete " + name + ": exact branch tip was manually reviewed as superseded by main.");
              }
              if (!safeToDelete && reviewedSha && branch.commit.sha !== reviewedSha) {
                core.warning("Keep " + name + ": branch tip changed after its review; manual review is required.");
                kept++;
                continue;
              }
              if (!safeToDelete) {
                try {
                  const comparison = await github.rest.repos.compareCommits({
                    owner,
                    repo,
                    base: "main",
                    head: name,
                  });
                  safeToDelete = comparison.data.ahead_by === 0;
                } catch (error) {
                  core.warning("Keep " + name + ": unable to prove it is merged (" + error.message + ").");
                  kept++;
                  continue;
                }
              }

              if (!safeToDelete) {
                core.info("Keep " + name + ": it still contains commits not merged into main.");
                kept++;
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: "heads/" + name,
                });
                core.info("Deleted " + name + ": its current tip is included in main or matches a merged PR head.");
                deleted++;
              } catch (error) {
                core.warning("Could not delete " + name + ": " + error.message);
                kept++;
              }
            }

            core.notice("Branch cleanup complete. Deleted " + deleted + "; kept " + kept + ".");
