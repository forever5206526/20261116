name: Windows 雲端編譯驗證

on:
  push:
    branches:
      - work/brhades-pandas-full-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify-event-integration:
    runs-on: ubuntu-latest
    steps:
      - name: 取得目前正式工作分支
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 執行鑑定事件 C++ 回歸測試
        run: python tools/integration/test_identify_event.py

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: 取得目前正式工作分支
        uses: actions/checkout@v6

      - name: 設定 Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: 安裝 TortoiseGit 與 Notepad++
        shell: pwsh
        run: choco install tortoisegit notepadplusplus --yes --no-progress

      - name: 驗證指定開發工具
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $git = Get-Command git.exe -ErrorAction Stop
          Write-Host "Git for Windows: $($git.Source)"
          git --version

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw '找不到 Visual Studio Installer 的 vswhere.exe。'
          }
          $vsVersion = & $vswhere -latest -products '*' -property installationVersion
          if (-not $vsVersion) {
            throw '找不到 Visual Studio 安裝版本。'
          }
          Write-Host "Visual Studio version: $vsVersion"

          $msbuild = Get-Command msbuild.exe -ErrorAction Stop
          Write-Host "MSBuild: $($msbuild.Source)"
          & msbuild.exe -version -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $tortoiseCandidates = @(
            (Join-Path ${env:ProgramFiles} 'TortoiseGit/bin/TortoiseGitProc.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'TortoiseGit/bin/TortoiseGitProc.exe')
          )
          $tortoise = $tortoiseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tortoise) { throw 'TortoiseGit 安裝檔未找到。' }
          Write-Host "TortoiseGit: $tortoise"

          $notepadCandidates = @(
            (Join-Path ${env:ProgramFiles} 'Notepad++/notepad++.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Notepad++/notepad++.exe')
          )
          $notepad = $notepadCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $notepad) { throw 'Notepad++ 安裝檔未找到。' }
          Write-Host "Notepad++: $notepad"

      - name: 編譯目前正式工作樹（Release x64）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $solution = Join-Path $env:GITHUB_WORKSPACE 'brHades.sln'
          if (-not (Test-Path $solution)) { throw "找不到解決方案：$solution" }
          & msbuild.exe $solution /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
