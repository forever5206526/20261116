name: Feature integration regression tests

on:
  push:
    branches:
      - main
      - work/brhades-pandas-full-port
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Source-contract and feature regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Identify event regression test
        run: python tools/integration/test_identify_event.py

      - name: NoAutoLoot mapflag regression test
        run: python tools/integration/test_noautoloot_mapflag.py

      - name: NoToken mapflag regression test
        run: python tools/integration/test_notoken_mapflag.py

      - name: NoMail mapflag regression test
        run: python tools/integration/test_nomail_mapflag.py

      - name: NoCapture alias regression test
        run: python tools/integration/test_nocapture_mapflag.py

      - name: NoSlave mapflag regression test
        run: python tools/integration/test_noslave_mapflag.py

      - name: NoAttack mapflag regression test
        run: python tools/integration/test_noattack_mapflag.py

      - name: NoUseItem mapflag regression test
        run: python tools/integration/test_nouseitem_mapflag.py

      - name: NoHomun mapflag regression test
        run: python tools/integration/test_nohomun_mapflag.py

      - name: NoPet mapflag regression test
        run: python tools/integration/test_nopet_mapflag.py

      - name: NoMerc mapflag regression test
        run: python tools/integration/test_nomerc_mapflag.py
