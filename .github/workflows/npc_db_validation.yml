name: NPC and database validation (Visual Studio)

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.vsconfig'
      - 'Directory.Build.props'
      - 'brHades.sln'
      - 'tools/ci/**'
      - 'src/**'
      - '3rdparty/**'
      - 'conf/**'
      - 'db/**'
      - 'npc/**'

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    name: NPC and DB validation [${{ matrix.mode }}]
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [PRE, RE]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Visual C++ 2012 x64 runtime required by PCRE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vcredist_x64.exe'
          $downloadUrl = 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x64.exe'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $downloadUrl -OutFile $installer
              $downloaded = $true
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds 5
            }
          }
          if (-not $downloaded) { throw 'Unable to download the Microsoft Visual C++ 2012 x64 runtime.' }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "The Visual C++ 2012 installer signature is invalid or not from Microsoft: $($signature.Status)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010, 1638)) {
            throw "Visual C++ 2012 runtime installer failed with exit code $($process.ExitCode)"
          }
          $runtime = Join-Path $env:WINDIR 'System32/msvcr110.dll'
          if (-not (Test-Path $runtime)) {
            throw "Visual C++ 2012 x64 runtime was not installed: $runtime"
          }
          Write-Host "Verified Microsoft-signed Visual C++ 2012 runtime: $runtime"

      - name: Set up MySQL
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: '8.0'

      - name: Set MySQL root password for repository CI scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & mysqladmin.exe -uroot password root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build map-server with Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $defines = 'BUILDBOT'
          if ('${{ matrix.mode }}' -eq 'PRE') { $defines = 'BUILDBOT%3BPRERE' }
          & msbuild.exe brHades.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 "/p:DefineConstants=$defines" /p:CppLanguageStandard=stdcpp20 /warnaserror /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'map-server.exe')) { throw 'Visual Studio build did not produce map-server.exe' }

      - name: Import database schema and seed data
        shell: bash
        run: bash tools/ci/sql.sh

      - name: Reject missing Windows SQL root password before running MySQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stubDir = Join-Path $env:RUNNER_TEMP 'brhades-mysql-negative-test'
          New-Item -ItemType Directory -Path $stubDir -Force | Out-Null
          $stub = Join-Path $stubDir 'mysql.cmd'
          $marker = Join-Path $stubDir 'mysql-was-invoked.txt'
          @(
            '@echo off'
            "echo invoked>""$marker"""
            'exit /b 99'
          ) | Set-Content -LiteralPath $stub -Encoding ascii

          $env:MYSQL = '"' + $stub + '"'
          $env:DB_ROOT = 'root'
          Remove-Item Env:DB_ROOTPW -ErrorAction SilentlyContinue
          $env:DB_NAME = 'missing_password_test'
          $env:DB_USER = 'brhades_missing_password_test'
          $env:DB_HOST = '127.0.0.1'
          $env:DB_USERPW = 'unused-test-password'

          $output = & $env:ComSpec /d /c 'call tools\ci\sql.bat' 2>&1
          $exitCode = $LASTEXITCODE
          $joined = [string]::Join([Environment]::NewLine, $output)
          if ($exitCode -ne 1) {
            throw "sql.bat must fail with exit code 1 when DB_ROOTPW is missing. Exit: $exitCode. Output: $joined"
          }
          if ($joined -notmatch 'DB_ROOTPW') {
            throw "sql.bat did not identify the missing DB_ROOTPW variable. Output: $joined"
          }
          if (Test-Path -LiteralPath $marker) {
            throw 'sql.bat invoked mysql despite the missing DB_ROOTPW variable.'
          }
          Write-Host 'PASS: missing DB_ROOTPW is rejected before any MySQL command is executed.'

      - name: Validate Windows SQL batch helper against MySQL 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command mysql.exe -ErrorAction SilentlyContinue)) { throw 'mysql.exe was not found on PATH.' }
          $bytes = New-Object byte[] 32
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $password = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+', '-').Replace('/', '_')
          $env:MYSQL = 'mysql.exe'
          $env:DB_ROOT = 'root'
          $env:DB_ROOTPW = 'root'
          $env:DB_NAME = 'ragnarok_batch_test'
          $env:DB_USER = 'brhades_batch_ci'
          $env:DB_HOST = '127.0.0.1'
          $env:DB_USERPW = $password
          try {
            & cmd.exe /d /c 'call tools\ci\sql.bat'
            if ($LASTEXITCODE -ne 0) { throw "Windows SQL batch helper failed with exit code $LASTEXITCODE." }
            $env:MYSQL_PWD = $password
            & mysql.exe -h 127.0.0.1 -u brhades_batch_ci ragnarok_batch_test -e 'SELECT COUNT(*) FROM login;'
            if ($LASTEXITCODE -ne 0) { throw 'The generated database account could not read the imported login table.' }
            $env:MYSQL_PWD = 'root'
            $grants = & mysql.exe -u root -e "SHOW GRANTS FOR 'brhades_batch_ci'@'127.0.0.1';"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the Windows batch helper database grants.' }
            $grantText = $grants -join "`n"
            if ($grantText -notmatch 'SELECT, INSERT, UPDATE, DELETE') { throw 'The batch helper did not grant the expected database permissions.' }
            if ($grantText -match 'ALL PRIVILEGES') { throw 'The batch helper granted excessive database permissions.' }
            Write-Host 'PASS: Windows sql.bat imported the schema, created a usable account and granted only the expected permissions.'
          } finally {
            $env:MYSQL_PWD = 'root'
            & mysql.exe -u root -e "DROP USER IF EXISTS 'brhades_batch_ci'@'127.0.0.1'; DROP DATABASE IF EXISTS ragnarok_batch_test;"
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Windows SQL helper test cleanup reported a database cleanup error.' }
          }

      - name: Configure temporary SQL credentials for server startup validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = $env:BRHADES_SQL_USER
          $password = $env:BRHADES_SQL_PASSWORD
          if ([string]::IsNullOrWhiteSpace($user) -or [string]::IsNullOrWhiteSpace($password)) {
            throw 'The temporary CI SQL account was not exported by tools/ci/sql.sh.'
          }
          if ($user -eq 'ragnarok' -and $password -eq 'ragnarok') {
            throw 'The public default SQL credentials must never be used in startup validation.'
          }

          $configPath = Join-Path $PWD 'conf/inter_athena.conf'
          $content = [System.IO.File]::ReadAllText($configPath)
          if ([regex]::Matches($content, '(?m)^sql_user:').Count -ne 1) {
            throw 'Expected exactly one sql_user setting in conf/inter_athena.conf.'
          }
          if ([regex]::Matches($content, '(?m)^sql_password:').Count -ne 1) {
            throw 'Expected exactly one sql_password setting in conf/inter_athena.conf.'
          }
          $content = [regex]::Replace($content, '(?m)^sql_user:.*$', ('sql_user: ' + $user))
          $content = [regex]::Replace($content, '(?m)^sql_password:.*$', ('sql_password: ' + $password))
          [System.IO.File]::WriteAllText($configPath, $content, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Configured the dedicated temporary CI SQL account without exposing its password.'

      - name: Enable custom and test NPC scripts
        shell: bash
        run: bash tools/ci/npc.sh

      - name: Verify and stage map-server runtime DLL dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeDlls = @(
            @{ Name = 'libmysql.dll'; Source = '3rdparty/mysql/lib/x64/libmysql.dll' },
            @{ Name = 'pcre8.dll'; Source = '3rdparty/pcre/lib/x64/pcre8.dll' },
            @{ Name = 'zlib.dll'; Source = '3rdparty/zlib/lib/x64/zlib.dll' }
          )
          foreach ($dll in $runtimeDlls) {
            if (-not (Test-Path $dll.Source)) {
              throw "Required runtime DLL source is missing: $($dll.Source)"
            }
            Copy-Item -LiteralPath $dll.Source -Destination (Join-Path $PWD $dll.Name) -Force
            if (-not (Test-Path (Join-Path $PWD $dll.Name))) {
              throw "Failed to stage runtime DLL: $($dll.Name)"
            }
            Write-Host "Staged $($dll.Name)"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found on the Visual Studio runner.' }
          $vsPath = & $vswhere -latest -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Could not locate the Visual Studio installation.' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe') -ErrorAction Stop |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual C++ dumpbin.exe was not found.' }
          foreach ($binary in @('map-server.exe', 'libmysql.dll', 'pcre8.dll', 'zlib.dll')) {
            Write-Host "===== Native dependencies: $binary ====="
            & $dumpbin.FullName /dependents $binary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $mysqlBin = 'C:/Program Files/MySQL/MySQL Server 8.0/bin'
          if (Test-Path $mysqlBin) {
            Write-Host 'MySQL server runtime DLL inventory:'
            Get-ChildItem -Path $mysqlBin -Filter '*.dll' | Select-Object Name,Length | Format-Table -AutoSize
          }
          Write-Host 'Application runtime DLL inventory:'
          Get-ChildItem -Path . -Filter '*.dll' | Select-Object Name,Length | Format-Table -AutoSize

      - name: Run map-server NPC and database startup validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $processes = @()
          $loginOut = Join-Path $env:RUNNER_TEMP 'login-server.stdout.log'
          $loginErr = Join-Path $env:RUNNER_TEMP 'login-server.stderr.log'
          $charOut = Join-Path $env:RUNNER_TEMP 'char-server.stdout.log'
          $charErr = Join-Path $env:RUNNER_TEMP 'char-server.stderr.log'
          $mapOut = Join-Path $env:RUNNER_TEMP 'map-server.stdout.log'
          $mapErr = Join-Path $env:RUNNER_TEMP 'map-server.stderr.log'

          function Wait-ForServerPort([int]$port, $process, [string]$serverName) {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "$serverName exited early with code $($process.ExitCode)."
              }
              if (Test-NetConnection -ComputerName 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue) {
                return
              }
              Start-Sleep -Seconds 1
            }
            throw "$serverName did not open TCP port $port within 45 seconds."
          }

          try {
            $login = Start-Process -FilePath '.\\login-server.exe' -PassThru -NoNewWindow -RedirectStandardOutput $loginOut -RedirectStandardError $loginErr
            $processes += $login
            Wait-ForServerPort 6900 $login 'login-server'

            $char = Start-Process -FilePath '.\\char-server.exe' -PassThru -NoNewWindow -RedirectStandardOutput $charOut -RedirectStandardError $charErr
            $processes += $char
            Wait-ForServerPort 6121 $char 'char-server'

            $map = Start-Process -FilePath '.\\map-server.exe' -ArgumentList '--run-once' -PassThru -Wait -NoNewWindow -RedirectStandardOutput $mapOut -RedirectStandardError $mapErr
            if (Test-Path $mapOut) { Get-Content $mapOut }
            if (Test-Path $mapErr) { Get-Content $mapErr }
            if ($map.ExitCode -ne 0) { throw "map-server --run-once exited with code $($map.ExitCode)." }
          }
          catch {
            foreach ($log in @($loginOut, $loginErr, $charOut, $charErr, $mapOut, $mapErr)) {
              if (Test-Path $log) {
                Write-Host "===== $log ====="
                Get-Content $log
              }
            }
            throw
          }
          finally {
            foreach ($process in $processes) {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }
