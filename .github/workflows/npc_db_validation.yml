name: NPC and database validation (Visual Studio)

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.vsconfig'
      - 'brHades.sln'
      - 'tools/ci/**'
      - 'src/**'
      - '3rdparty/**'
      - 'db/**'
      - 'npc/**'

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, 'ci-skip')"
    name: NPC and DB validation [${{ matrix.mode }}]
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [PRE, RE]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up MySQL
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: '8.0'

      - name: Set MySQL root password for repository CI scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & mysqladmin.exe -uroot password root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build map-server with Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $defines = 'BUILDBOT'
          if ('${{ matrix.mode }}' -eq 'PRE') { $defines = 'BUILDBOT%3BPRERE' }
          & msbuild.exe brHades.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 "/p:DefineConstants=$defines" /p:CppLanguageStandard=stdcpp20 /warnaserror /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'map-server.exe')) { throw 'Visual Studio build did not produce map-server.exe' }

      - name: Import database schema and seed data
        shell: bash
        run: bash tools/ci/sql.sh

      - name: Enable custom and test NPC scripts
        shell: bash
        run: bash tools/ci/npc.sh

      - name: Run map-server NPC and database startup validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $processes = @()
          $loginOut = Join-Path $env:RUNNER_TEMP 'login-server.stdout.log'
          $loginErr = Join-Path $env:RUNNER_TEMP 'login-server.stderr.log'
          $charOut = Join-Path $env:RUNNER_TEMP 'char-server.stdout.log'
          $charErr = Join-Path $env:RUNNER_TEMP 'char-server.stderr.log'
          $mapOut = Join-Path $env:RUNNER_TEMP 'map-server.stdout.log'
          $mapErr = Join-Path $env:RUNNER_TEMP 'map-server.stderr.log'

          function Wait-ForServerPort([int]$port, $process, [string]$serverName) {
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "$serverName exited early with code $($process.ExitCode)."
              }
              if (Test-NetConnection -ComputerName 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue) {
                return
              }
              Start-Sleep -Seconds 1
            }
            throw "$serverName did not open TCP port $port within 45 seconds."
          }

          try {
            $login = Start-Process -FilePath '.\\login-server.exe' -PassThru -NoNewWindow -RedirectStandardOutput $loginOut -RedirectStandardError $loginErr
            $processes += $login
            Wait-ForServerPort 6900 $login 'login-server'

            $char = Start-Process -FilePath '.\\char-server.exe' -PassThru -NoNewWindow -RedirectStandardOutput $charOut -RedirectStandardError $charErr
            $processes += $char
            Wait-ForServerPort 6121 $char 'char-server'

            $map = Start-Process -FilePath '.\\map-server.exe' -ArgumentList '--run-once' -PassThru -Wait -NoNewWindow -RedirectStandardOutput $mapOut -RedirectStandardError $mapErr
            if (Test-Path $mapOut) { Get-Content $mapOut }
            if (Test-Path $mapErr) { Get-Content $mapErr }
            if ($map.ExitCode -ne 0) { throw "map-server --run-once exited with code $($map.ExitCode)." }
          }
          catch {
            foreach ($log in @($loginOut, $loginErr, $charOut, $charErr, $mapOut, $mapErr)) {
              if (Test-Path $log) {
                Write-Host "===== $log ====="
                Get-Content $log
              }
            }
            throw
          }
          finally {
            foreach ($process in $processes) {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }
