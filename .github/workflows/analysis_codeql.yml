name: CodeQL security analysis

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/**'
      - 'src/**'
      - '3rdparty/**'

jobs:
  analyze:
    name: CodeQL [${{ matrix.mode }}] using Visual Studio
    runs-on: windows-2022
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: ['PRE', 'RE']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Visual Studio MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: c-cpp
        build-mode: manual
        queries: +security-and-quality

    - name: Set build mode
      shell: pwsh
      run: |
        if ('${{ matrix.mode }}' -eq 'PRE') {
          "PRERE=yes" | Out-File -FilePath $env:GITHUB_ENV -Append
          $defines = 'BUILDBOT%3BPRERE'
        } else {
          "PRERE=no" | Out-File -FilePath $env:GITHUB_ENV -Append
          $defines = 'BUILDBOT'
        }
        "BUILD_DEFINES=$defines" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build with Visual Studio for CodeQL
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & msbuild.exe brHades.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 "/p:DefineConstants=$env:BUILD_DEFINES" /p:CppLanguageStandard=stdcpp20 /v:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:c-cpp"
